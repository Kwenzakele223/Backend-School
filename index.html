     checks:[{l:'Has serialVersionUID', t:/serialVersionUID/i}],
     s:'private static final long serialVersionUID = 1L;',
     m:['Forgetting "static final" — serialVersionUID is meant to be a fixed constant on the class.','Changing its value between versions without meaning to — that intentionally breaks compatibility with old saved files.']},
    {p:'Here is a class with a field of a type that is NOT Serializable, causing an error. Fix it by making that field transient.',
     checks:[{l:'Uses transient on the problem field', t:/transient/i}],
     s:'class Player implements Serializable {\n    String name;\n    transient Thread workerThread; // Thread is not Serializable\n}',
     m:['Trying to make Thread itself Serializable — you cannot, it is a built-in Java class you do not control.','Removing the field entirely instead of marking it transient, losing functionality you may still need at runtime.']},
    {p:'Serialize a whole <span class="inline-code">ArrayList&lt;Player&gt;</span> instead of just one Player.',
     checks:[{l:'Uses ArrayList<Player>', t:/ArrayList\s*<\s*Player\s*>/i},{l:'Calls writeObject on it', t:/writeObject\s*\(/i}],
     s:'ArrayList<Player> players = new ArrayList<>();\nObjectOutputStream out = new ObjectOutputStream(new FileOutputStream("players.dat"));\nout.writeObject(players);',
     m:['Forgetting ArrayList itself is already Serializable — but every object you put inside it also has to be, or the whole write fails.','Trying to writeObject() each Player one at a time when the whole list can be written in a single call.']},
    {p:'Give Player a nested serializable field: a <span class="inline-code">Team</span> object that also implements Serializable.',
     checks:[{l:'Team implements Serializable', t:/class\s+Team\s+implements\s+Serializable/i},{l:'Player has a Team field', t:/Team\s+\w+/i}],
     s:'class Team implements Serializable {\n    String teamName;\n}\n\nclass Player implements Serializable {\n    String name;\n    Team team;\n}',
     m:['Forgetting the nested class also needs implements Serializable — a Player being Serializable does not automatically cover Team.','Leaving the Team field null and being surprised the saved file has no team information.']},
    {p:'Write the line that reads an Object back and casts it to <span class="inline-code">ArrayList&lt;Player&gt;</span>.',
     checks:[{l:'Casts to (ArrayList<Player>)', t:/\(\s*ArrayList\s*<\s*Player\s*>\s*\)/i},{l:'Calls readObject()', t:/readObject\s*\(\s*\)/i}],
     s:'ArrayList<Player> players = (ArrayList<Player>) in.readObject();',
     m:['Casting to just ArrayList without the <Player> — it compiles with a warning, but it is safer and clearer to include it.','Forgetting readObject() can throw both IOException and ClassNotFoundException.']},
    {p:'Wrap a serialization read in a try/catch that handles both <span class="inline-code">IOException</span> and <span class="inline-code">ClassNotFoundException</span>.',
     checks:[{l:'Has a try block', t:/try\s*\{/i},{l:'Catches IOException', t:/catch\s*\([^)]*IOException/i},{l:'Catches ClassNotFoundException', t:/catch\s*\([^)]*ClassNotFoundException/i}],
     s:'try {\n    Player p = (Player) in.readObject();\n} catch (IOException | ClassNotFoundException e) {\n    e.printStackTrace();\n}',
     m:['Only catching IOException and forgetting ClassNotFoundException — readObject() can throw either one.','Catching Exception broadly instead of naming the real ones — it works, but hides which specific thing went wrong.']}
  ]
},

{ id:'databases', tab:'Databases', title:'Databases, JDBC & ORM', blurb:'SQL commands organized by category, plus how Java actually talks to a database — all in one place.',
  links:[
    {label:'W3Schools — SQL Tutorial', url:'https://www.w3schools.com/sql/'},
    {label:'PostgreSQL — official documentation', url:'https://www.postgresql.org/docs/'},
    {label:'SQLite — official documentation', url:'https://www.sqlite.org/docs.html'},
    {label:'Oracle — JDBC Basics tutorial', url:'https://docs.oracle.com/javase/tutorial/jdbc/basics/'},
    {label:'Hibernate ORM — official documentation', url:'https://hibernate.org/orm/documentation/'},
    {label:'Jakarta Persistence (JPA) specification', url:'https://jakarta.ee/specifications/persistence/'}
  ],
  concepts:[
    {name:'What a relational database is', explain:'A relational database stores data in tables, like spreadsheets — each row is one record, each column is one field. "Relational" means tables can be linked to each other, the way a library card catalog points you to where a book actually sits on a shelf.', code:'-- a "dogs" table: id, name, age (three columns)'},
    {name:'SQL, the language you talk to it in', explain:'SQL is how you ask a database to do something. It reads almost like plain English on purpose, and splits into a few families of commands you will meet below: creating structure, reading data, and changing data.', code:'SELECT * FROM dogs;'},
    {divider:'SQL Commands, By Category'},
    {name:'What the categories mean', explain:'Every SQL command belongs to one of four families, and knowing which one you are looking at tells you a lot about what it does before you even read the details. <b>DDL</b> (Data Definition Language) defines or changes the STRUCTURE — tables and columns. <b>DML</b> (Data Manipulation Language) works with the DATA inside those tables — reading, adding, changing, removing rows. <b>DCL</b> (Data Control Language) controls WHO is allowed to do what. <b>TCL</b> (Transaction Control Language) manages transactions — grouping several steps into one safe, all-or-nothing unit.', code:'// DDL: shapes the containers\n// DML: fills and changes what is inside them\n// DCL: controls who is allowed to touch them\n// TCL: makes multi-step changes safe'},
    {name:'DDL — Data Definition Language: CREATE, ALTER, DROP, TRUNCATE', explain:'DDL commands define and change the STRUCTURE of a database — not the data inside it, but the containers that data lives in. CREATE TABLE builds a new one. ALTER TABLE changes an existing one — adding, renaming, or removing a column without starting over. TRUNCATE TABLE instantly empties every row but leaves the table itself standing, ready to be filled again. DROP TABLE deletes the whole table, structure and all the data in it, permanently.', code:'CREATE TABLE dogs (id INT PRIMARY KEY, name VARCHAR(50));  -- builds a new table\nALTER TABLE dogs ADD COLUMN age INT;                        -- changes its structure\nTRUNCATE TABLE dogs;                                        -- empties it, keeps the table\nDROP TABLE dogs;                                            -- deletes it completely'},
    {name:'Choosing data types', explain:'Columns have types just like variables do — INT for whole numbers, VARCHAR for text with a length limit, BOOLEAN for true/false, DATE for calendar dates, DECIMAL for precise money-style numbers. Picking the right one matters for both storage size and catching bad data early.', code:'age INT, name VARCHAR(50), is_active BOOLEAN, price DECIMAL(6,2)'},
    {name:'Primary keys and relationships', explain:'A primary key is a column guaranteed to be unique per row, like an ID number — no two dogs share the same id. A foreign key is a column in one table that points to a primary key in another, which is how tables get linked together.', code:'FOREIGN KEY (owner_id) REFERENCES owners(id)'},
    {name:'Constraints', explain:'Constraints are rules the database enforces automatically: NOT NULL requires a value, UNIQUE forbids duplicates, CHECK validates a condition, and DEFAULT fills in a value automatically when none is given. They stop bad data from ever getting saved in the first place.', code:'age INT CHECK (age >= 0) DEFAULT 0,\nemail VARCHAR(100) UNIQUE NOT NULL'},
    {name:'DML — Data Manipulation Language: SELECT, INSERT, UPDATE, DELETE', explain:'DML commands manipulate the DATA inside tables that already exist — reading it, adding to it, changing it, removing it. These four are the commands used constantly, day to day, once a table\'s structure is already in place. The next two concepts cover each in real depth.', code:"SELECT * FROM dogs;                                    -- reads rows\nINSERT INTO dogs (name, age) VALUES ('Milo', 3);       -- adds a row\nUPDATE dogs SET age = 4 WHERE name = 'Milo';           -- changes existing rows\nDELETE FROM dogs WHERE age < 1;                        -- removes rows"},
    {name:'DML in depth — reading data: SELECT, WHERE, and DISTINCT', explain:"SELECT chooses which columns to read, WHERE filters which rows come back, and DISTINCT removes duplicate results. Comparison operators like =, !=, >, and < work inside WHERE, alongside special ones like LIKE (pattern matching), IN (matches any value in a list), BETWEEN (a range), and IS NULL (checking for missing values).", code:"SELECT DISTINCT name FROM dogs\nWHERE age BETWEEN 1 AND 5\n  AND name LIKE 'M%'\n  AND owner_id IS NOT NULL;"},
    {name:'DML in depth — changing data: INSERT, UPDATE, DELETE', explain:'INSERT adds new rows, UPDATE changes existing ones, and DELETE removes rows entirely. UPDATE and DELETE are both dangerous without a WHERE clause, since without one they apply to every single row in the table.', code:"INSERT INTO dogs (name, age) VALUES ('Milo', 3);\nUPDATE dogs SET age = 4 WHERE name = 'Milo';\nDELETE FROM dogs WHERE age < 1;"},
    {name:'Sorting and limiting results', explain:'ORDER BY sorts results by one or more columns, ascending by default or descending with DESC. LIMIT caps how many rows come back at all, useful for things like "just show me the 10 newest."', code:'SELECT * FROM dogs ORDER BY age DESC LIMIT 10;'},
    {name:'Aggregate functions', explain:'Aggregate functions summarize many rows into one number: COUNT counts rows, SUM adds a column up, AVG averages it, and MIN/MAX find the smallest or largest value.', code:'SELECT COUNT(*), AVG(age), MAX(age) FROM dogs;'},
    {name:'Grouping with GROUP BY and HAVING', explain:'GROUP BY collapses rows sharing a value into one summarized row per group, usually paired with an aggregate function — like "how many dogs does each owner have?" HAVING then filters those grouped results, the way WHERE filters plain rows (WHERE cannot be used with aggregates directly).', code:'SELECT owner_id, COUNT(*) AS dog_count\nFROM dogs\nGROUP BY owner_id\nHAVING COUNT(*) > 1;'},
    {name:'Joining tables — visually', explain:'A JOIN combines rows from two tables based on a matching column. The type of join controls exactly which rows survive when there is not a perfect match on both sides — pictured below as overlapping circles, one per table.',
     svg:'<div class="join-diagrams">'

     code:'-- INNER: only rows with a match on both sides\nSELECT * FROM dogs JOIN owners ON dogs.owner_id = owners.id;\n\n-- LEFT: every dog, even ones with no owner on file\nSELECT * FROM dogs LEFT JOIN owners ON dogs.owner_id = owners.id;\n\n-- RIGHT: every owner, even ones with no dog on file\nSELECT * FROM dogs RIGHT JOIN owners ON dogs.owner_id = owners.id;\n\n-- FULL OUTER: everything from both sides, matched where possible\nSELECT * FROM dogs FULL OUTER JOIN owners ON dogs.owner_id = owners.id;'},
    {name:'Subqueries', explain:'A subquery is a query nested inside another one, often inside a WHERE clause — useful for "find dogs belonging to owners who live in Cape Town" without writing a separate step.', code:"SELECT * FROM dogs\nWHERE owner_id IN (SELECT id FROM owners WHERE city = 'Cape Town');"},
    {name:'Combining results with UNION', explain:'UNION stacks the results of two separate SELECT queries into one combined result set (removing duplicates by default), as long as both queries return the same number and type of columns.', code:'SELECT name FROM dogs\nUNION\nSELECT name FROM cats;'},
    {name:'Views', explain:'A VIEW is a saved query that behaves like a virtual table — handy for a complicated query you reuse often, without retyping it or duplicating the underlying data.', code:'CREATE VIEW young_dogs AS\nSELECT * FROM dogs WHERE age < 2;'},
    {name:'Transactions and ACID', explain:'A transaction groups several steps into one all-or-nothing unit — like a bank transfer, where money leaving one account and arriving in another must both happen, or neither should. ACID (Atomicity, Consistency, Isolation, Durability) describes the guarantees a database makes about transactions.', code:'BEGIN;\nUPDATE accounts SET balance = balance - 100 WHERE id = 1;\nUPDATE accounts SET balance = balance + 100 WHERE id = 2;\nCOMMIT;'},
    {name:'TCL — Transaction Control Language: COMMIT, ROLLBACK, SAVEPOINT', explain:'TCL commands are how you actually control a transaction once it has started. COMMIT makes every change in the current transaction permanent. ROLLBACK undoes them instead, as if the transaction never happened at all — essential if, say, the second half of a bank transfer fails and the first half needs to be undone too. SAVEPOINT marks a checkpoint partway through a transaction that you can roll back to, without undoing everything before it.', code:'BEGIN;\nUPDATE accounts SET balance = balance - 100 WHERE id = 1;\nSAVEPOINT before_credit;\nUPDATE accounts SET balance = balance + 100 WHERE id = 2;\n\nCOMMIT;                    -- keep every change\n-- or, if something went wrong:\nROLLBACK TO before_credit; -- undo back to that checkpoint only\nROLLBACK;                  -- undo the whole transaction'},
    {name:'DCL — Data Control Language: GRANT, REVOKE', explain:'DCL commands control WHO is allowed to do what. GRANT hands out a specific permission to a specific database user or role; REVOKE takes it back. A real shelter database might let volunteers SELECT and INSERT, but only let the manager account DELETE — DCL is how that boundary gets enforced by the database itself, not just agreed on by convention.', code:'GRANT SELECT, INSERT ON dogs TO shelter_volunteer;  -- allow reading and adding\nREVOKE INSERT ON dogs FROM shelter_volunteer;        -- take that permission back'},
    {name:'Indexes', explain:'An index is a lookup shortcut on a column that makes searches much faster, at the cost of a bit of extra storage and slightly slower writes (since the index has to be updated too).', code:'CREATE INDEX idx_dogs_name ON dogs(name);'},
    {name:'Normalization, briefly', explain:'Normalization is the practice of organizing tables to avoid repeating the same data in multiple places — like storing an owner\'s address once in an owners table instead of copying it onto every single dog row that owner has.', code:'-- instead of repeating owner_name on every dog row,\n-- store it once in owners, and link with owner_id'},
    {name:'SQL vs NoSQL', explain:'Not every database stores data in tables. NoSQL databases (like MongoDB) organize data differently — often as flexible documents instead of rigid rows and columns — which suits some problems better than the relational model does.', code:'// relational: rows and columns\n// NoSQL: flexible documents, key-value pairs, or graphs'},

    {divider:'JDBC — Java Talking to a Database'},
    {name:'What JDBC is', explain:'JDBC (Java Database Connectivity) is the standard Java API for talking to any SQL database. The same code pattern works whether you are connecting to SQLite, PostgreSQL, or MySQL — you just swap the connection URL and driver, and every SQL command above works exactly the same way once you are connected.', code:'String url = "jdbc:sqlite:shelter.db"; // jdbc:<database-type>:<connection-details>'},
    {name:'Opening a connection', explain:'DriverManager.getConnection() opens an actual connection to the database, using a URL that tells JDBC which database engine to talk to and where.', code:'Connection conn = DriverManager.getConnection("jdbc:sqlite:shelter.db");'},
    {name:'Statement vs PreparedStatement', explain:'A plain Statement runs a raw SQL string exactly as written — convenient, but dangerous if any part of that string comes from user input, a security hole called SQL injection. A PreparedStatement uses ? placeholders instead, with values supplied separately and safely, which is why real code almost always prefers it.', code:'PreparedStatement stmt = conn.prepareStatement(\n    "INSERT INTO dogs (name, age) VALUES (?, ?)"\n);\nstmt.setString(1, "Milo");\nstmt.setInt(2, 3);\nstmt.executeUpdate();'},
    {name:'Reading results with ResultSet', explain:'executeQuery() returns a ResultSet — a cursor you step through one row at a time with .next(), reading each column by name, very similar in spirit to looping through a JSONArray in the JSON chapter.', code:'ResultSet rs = conn.createStatement().executeQuery("SELECT * FROM dogs");\nwhile (rs.next()) {\n    System.out.println(rs.getString("name") + " is " + rs.getInt("age"));\n}'},
    {name:'Closing what you open', explain:'Connections, Statements, and ResultSets all hold real system resources and need to be closed when you are done — try-with-resources (from the Sockets chapter) handles this automatically and is the safest default.', code:'try (Connection conn = DriverManager.getConnection(url);\n     PreparedStatement stmt = conn.prepareStatement("SELECT * FROM dogs")) {\n    ResultSet rs = stmt.executeQuery();\n    // use rs here\n}'},

    {divider:'ORM — Object-Relational Mapping'},
    {name:'What an ORM actually does', explain:'An ORM (Object-Relational Mapper) automatically translates between Java objects and SQL rows, so you write and think in classes instead of hand-writing SQL and manually copying ResultSet columns into fields yourself. Hibernate is the most widely used Java ORM, and JPA (Jakarta Persistence API) is the standard interface it — and others — implement.', code:'// without an ORM: manually copy every ResultSet column into a field, by hand, every single time'},
    {name:'Marking a class as an entity', explain:'@Entity tells the ORM "this class corresponds to a table." @Id marks the primary key field, and @GeneratedValue tells it the database should generate that id automatically, the same auto-increment idea from earlier in this chapter.', code:'@Entity\npublic class Dog {\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    private int id;\n\n    private String name;\n    private int age;\n}'},
    {name:'Saving and querying without writing SQL', explain:'Once a class is mapped, an EntityManager (or a Spring Data JpaRepository, in larger projects) handles the actual INSERT and SELECT statements behind the scenes — you call methods on Java objects, and the ORM generates and runs the SQL for you.', code:'entityManager.persist(new Dog("Milo", 3));    // generates an INSERT, behind the scenes\nDog found = entityManager.find(Dog.class, 1); // generates a SELECT ... WHERE id = 1'},
    {name:'ORM vs raw JDBC — the actual trade-off', explain:'An ORM saves a huge amount of repetitive boilerplate and reduces SQL injection risk, since you are no longer hand-building query strings. But it can hide what is actually happening underneath — a badly designed entity relationship can generate wildly inefficient SQL without you ever writing a line of it yourself. Most real projects use an ORM for typical everyday work, and still drop down to raw JDBC or hand-written queries for anything performance-critical or unusual. Understanding JDBC first, before reaching for an ORM, is what makes that second option possible at all.'}

  challenges:[
    {p:'Write a <span class="inline-code">CREATE TABLE</span> statement for a "dogs" table with an id (INT, PRIMARY KEY), a name (VARCHAR), and an age (INT).',
     checks:[{l:'CREATE TABLE dogs', t:/CREATE\s+TABLE\s+dogs/i},{l:'Has a PRIMARY KEY', t:/PRIMARY\s+KEY/i},{l:'Has a name column', t:/name/i},{l:'Has an age column', t:/age/i}],
     s:'CREATE TABLE dogs (\n    id INT PRIMARY KEY,\n    name VARCHAR(50),\n    age INT\n);',
     m:['Forgetting PRIMARY KEY on the id column — without it, nothing stops two rows from sharing the same id.','Mismatching data types, like storing age as text instead of a number.']},
    {p:'Write an <span class="inline-code">INSERT INTO</span> statement adding a dog named "Milo", age 3, to the dogs table.',
     checks:[{l:'INSERT INTO dogs', t:/INSERT\s+INTO\s+dogs/i},{l:'Uses VALUES', t:/VALUES/i},{l:'Includes Milo', t:/Milo/i},{l:'Includes 3', t:/\b3\b/}],
     s:"INSERT INTO dogs (id, name, age) VALUES (1, 'Milo', 3);",
     m:['Leaving out one of the columns without also leaving out its matching value — the counts have to match up.','Using double quotes around text values instead of single quotes — standard SQL expects single quotes for strings.']},
    {p:'Write a query that selects every column and every row from the dogs table.',
     checks:[{l:'SELECT * FROM dogs', t:/SELECT\s+\*\s+FROM\s+dogs/i}],
     s:'SELECT * FROM dogs;',
     m:['Forgetting the semicolon at the end — most SQL tools expect one to mark the end of a statement.','Using * outside of SELECT, where it does not mean the same thing.']},
    {p:'Write a query selecting dogs where age is greater than 2.',
     checks:[{l:'SELECT ... FROM dogs', t:/SELECT[\s\S]*FROM\s+dogs/i},{l:'Has WHERE age > 2', t:/WHERE\s+age\s*>\s*2/i}],
     s:'SELECT * FROM dogs WHERE age > 2;',
     m:['Using = instead of > when the intent was "greater than" — they filter completely differently.','Forgetting WHERE entirely, which returns every row instead of only the ones that match.']},
    {p:'Write an <span class="inline-code">UPDATE</span> statement that changes Milo\'s age to 4.',
     checks:[{l:'UPDATE dogs', t:/UPDATE\s+dogs/i},{l:'SET age', t:/SET\s+age\s*=\s*4/i},{l:'Has a WHERE clause', t:/WHERE/i}],
     s:"UPDATE dogs SET age = 4 WHERE name = 'Milo';",
     m:['Forgetting WHERE — an UPDATE with no WHERE clause changes every single row in the table.','Updating the wrong column name, which either errors or silently does nothing useful.']},
    {p:'Write a <span class="inline-code">DELETE</span> statement removing dogs younger than 1.',
     checks:[{l:'DELETE FROM dogs', t:/DELETE\s+FROM\s+dogs/i},{l:'Has WHERE age < 1', t:/WHERE\s+age\s*<\s*1/i}],
     s:'DELETE FROM dogs WHERE age < 1;',
     m:['Forgetting WHERE — same danger as UPDATE, a bare DELETE removes every row in the table.','Mixing up < and > and deleting the opposite group of rows from the one intended.']},
    {p:'Write a second table "owners" with an owner_id column that is a FOREIGN KEY referencing dogs(id).',
     checks:[{l:'CREATE TABLE owners', t:/CREATE\s+TABLE\s+owners/i},{l:'Has FOREIGN KEY', t:/FOREIGN\s+KEY/i},{l:'References dogs(id)', t:/REFERENCES\s+dogs\s*\(\s*id\s*\)/i}],
     s:'CREATE TABLE owners (\n    id INT PRIMARY KEY,\n    owner_name VARCHAR(50),\n    dog_id INT,\n    FOREIGN KEY (dog_id) REFERENCES dogs(id)\n);',
     m:['Referencing a column that is not actually a primary key on the other table — foreign keys normally point at a primary key.','Mismatching the data type between the foreign key column and the primary key it points to.']},
    {p:'Write a query using <span class="inline-code">JOIN</span> to combine dogs and owners based on the dog_id link.',
     checks:[{l:'Uses JOIN', t:/JOIN/i},{l:'Has an ON clause', t:/ON\s+/i}],
     s:'SELECT dogs.name, owners.owner_name\nFROM dogs\nJOIN owners ON dogs.id = owners.dog_id;',
     m:['Forgetting the ON clause — without it, the database has no idea how the two tables relate.','Joining on columns that do not actually reference each other, producing meaningless combinations.']},
    {p:'Write a query that sorts dogs by age, from oldest to youngest, using ORDER BY.',
     checks:[{l:'Uses ORDER BY age', t:/ORDER\s+BY\s+age/i},{l:'Sorts descending', t:/DESC/i}],
     s:'SELECT * FROM dogs ORDER BY age DESC;',
     m:['Forgetting DESC, which defaults to ascending (youngest first) instead of the requested oldest-first order.','Ordering by the wrong column entirely, like name instead of age.']},
    {p:'Write a query that counts how many dogs are in the table, using COUNT(*).',
     checks:[{l:'Uses COUNT(*)', t:/COUNT\s*\(\s*\*\s*\)/i},{l:'Selects from dogs', t:/FROM\s+dogs/i}],
     s:'SELECT COUNT(*) FROM dogs;',

{ id:'apis', tab:'APIs', title:'APIs (and free ones for your portfolio)', blurb:'Borrowing someone else\'s data machine, politely.',
  links:[
    {label:'Java SE 17 — HttpClient (official API docs)', url:'https://docs.oracle.com/en/java/javase/17/docs/api/java.net.http/java/net/http/HttpClient.html'},
    {label:'Open-Meteo — free weather API, no key required', url:'https://open-meteo.com/en/docs'},
    {label:'RESTful API — design basics', url:'https://restfulapi.net/'}
  ],
  concepts:[
    {name:'What an API call actually is', explain:'An API call is a formatted request sent to a URL that is always listening, asking for (or sending) specific data, and getting a structured response back — like ordering through a waiter instead of walking into the kitchen yourself.', code:'HttpClient client = HttpClient.newHttpClient();'},
    {name:'Building a request', explain:'A request needs a URL at minimum, and often a method (GET, POST...), headers, and sometimes a body — this is what you are actually asking for, spelled out precisely.', code:'HttpRequest request = HttpRequest.newBuilder()\n    .uri(URI.create("https://api.open-meteo.com/v1/forecast"))\n    .build();'},
    {name:'Reading the response', explain:'The response comes back with a status code (200 means success, 404 means not found) and a body, which is often JSON you will want to parse afterward.', code:'HttpResponse<String> response = client.send(request, HttpResponse.BodyHandlers.ofString());\nSystem.out.println(response.statusCode());'},
    {name:'REST, in plain terms', explain:'REST is a common style for designing APIs around resources (like /dogs or /dogs/5) combined with standard HTTP methods to act on them, instead of every API inventing its own unique pattern for everything.', code:'GET /dogs/5    -> get the dog with id 5\nDELETE /dogs/5 -> remove the dog with id 5'},
    {name:'Authentication styles', explain:'Different APIs prove who you are differently: a simple API key in a header, a Bearer token you attach to every request, or OAuth — a longer back-and-forth flow used for things like "Sign in with Google".', code:'.header("Authorization", "Bearer YOUR_TOKEN")'},
    {name:'Rate limiting', explain:'Most free APIs cap how many requests you can make in a given time window, like 60 per minute. Going over that limit usually gets you a 429 "Too Many Requests" status code instead of your actual data.', code:'// statusCode() == 429 means you have been rate-limited'},
    {name:'Pagination', explain:'Large result sets are rarely sent all at once — they get split across pages, and you ask for one page at a time using something like a page or offset parameter in the URL.', code:'https://api.example.com/dogs?page=2'},
    {name:'API documentation', explain:'Real APIs almost always publish documentation describing every endpoint, what parameters it accepts, and what a response looks like — often as an OpenAPI/Swagger specification. Reading it first saves a lot of guessing.', code:'// most API docs list: endpoint, method, parameters, example response'},
    {name:'Timeouts and retries', explain:"Networks fail sometimes — a request can hang or drop entirely. Real client code sets a reasonable timeout so it doesn't wait forever, and often retries a failed request a few times (ideally only for safe, idempotent requests) before giving up.", code:'.timeout(Duration.ofSeconds(5))\n// then retry once or twice on failure, with a short delay between tries'},
    {name:'Webhooks', explain:"A normal API call is you asking a server for something. A webhook flips that around — you give the server a URL of yours, and it calls YOU when something happens later, like a payment succeeding, instead of you having to keep asking \"is it done yet?\"", code:'// you register: https://yourapp.com/webhooks/payment-completed\n// the API POSTs to that URL whenever a payment finishes'},
    {name:'Versioning an API', explain:'APIs change over time, and breaking every existing user\'s code with each change would be a disaster. Many APIs put a version number right in the URL (like /v1/ or /v2/), so old and new versions can run side by side while users migrate on their own schedule.', code:'https://api.example.com/v1/dogs\nhttps://api.example.com/v2/dogs'}
  ],
  interview:[
    {level:'Beginner', q:'What is an API, in plain terms?'},
    {level:'Beginner', q:'What is the difference between GET and POST?'},
    {level:'Beginner', q:'What does a status code tell you about a response?'},
    {level:'Intermediate', q:'What is REST, and how does it use URLs and HTTP methods together?'},
    {level:'Intermediate', q:'What is the difference between an API key and a Bearer token?'},
    {level:'Intermediate', q:'What is rate limiting, and what status code usually signals you have hit it?'},
    {level:'Intermediate', q:'Why is pagination necessary for large result sets?'}
  ],
  projects:[{
    title:'A Weather Lookup Tool',
    blurb:'Build a console app that asks for a city, calls a free weather API, and prints a friendly summary of the current conditions.',
    requirements:[
      'Uses HttpClient to call a free API like Open-Meteo.',
      'Parses the JSON response and extracts at least temperature and conditions.',
      'Handles a non-200 status code gracefully instead of crashing.',
