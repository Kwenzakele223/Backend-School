  }],
  challenges:[
    {p:'Build and send a GET request to the free Open-Meteo weather API, then print the response body.',
     checks:[{l:'Uses HttpClient', t:/HttpClient/i},{l:'Uses HttpRequest', t:/HttpRequest/i},{l:'Calls .send(', t:/\.send\s*\(/i},{l:'Has an https:// URL', t:/https:\/\//i},{l:'Prints something', t:/System\.out\.println/i}],
     s:'HttpClient client = HttpClient.newHttpClient();\nHttpRequest request = HttpRequest.newBuilder()\n    .uri(URI.create("https://api.open-meteo.com/v1/forecast?latitude=-26.2&longitude=28.0&current_weather=true"))\n    .build();\nHttpResponse<String> response = client.send(request, HttpResponse.BodyHandlers.ofString());\nSystem.out.println(response.body());',
     m:['Building the request but never calling .send() — building it only describes what you want, .send() actually makes the call.','Printing "response" instead of "response.body()" — the object itself is just metadata, the data is inside .body().']},
    {p:'Add an <span class="inline-code">Accept</span> header requesting <span class="inline-code">application/json</span> on a request.',
     checks:[{l:'Adds Accept header', t:/\.header\s*\(\s*"Accept"\s*,\s*"application\/json"\s*\)/i}],
     s:'HttpRequest request = HttpRequest.newBuilder()\n    .uri(URI.create("https://example.com/api"))\n    .header("Accept", "application/json")\n    .build();',
     m:['Confusing Accept (what you want back) with Content-Type (what you are sending) — they mean different things.','Misspelling the header name — headers are matched exactly as text.']},
    {p:'Build a POST request that sends the text <span class="inline-code">name=Milo</span> as its body.',
     checks:[{l:'Uses .POST(', t:/\.POST\s*\(/i},{l:'Body contains name=Milo', t:/name=Milo/i}],
     s:'HttpRequest request = HttpRequest.newBuilder()\n    .uri(URI.create("https://example.com/api/dogs"))\n    .POST(HttpRequest.BodyPublishers.ofString("name=Milo"))\n    .build();',
     m:['Using .GET() by accident when data actually needs to be sent — GET requests are not meant to carry a body.','Forgetting BodyPublishers.ofString(...) around the data you want to send.']},
    {p:'After sending a request, read and print the numeric status code from the response.',
     checks:[{l:'Calls response.statusCode()', t:/response\.statusCode\s*\(\s*\)/i},{l:'Prints it', t:/System\.out\.println\s*\(\s*response\.statusCode/i}],
     s:'System.out.println(response.statusCode());',
     m:['Trying response.getStatusCode() — the actual method name has no "get" prefix, it is just statusCode().','Confusing the status code with the body — they are two separate pieces of the response.']},
    {p:'Parse a JSON response body into a <span class="inline-code">JSONObject</span> and print its "name" field.',
     checks:[{l:'Creates JSONObject from response.body()', t:/new\s+JSONObject\s*\(\s*response\.body\s*\(\s*\)\s*\)/i},{l:'Calls getString("name")', t:/getString\s*\(\s*"name"\s*\)/i}],
     s:'JSONObject data = new JSONObject(response.body());\nSystem.out.println(data.getString("name"));',
     m:['Trying to call getString() directly on the response object — it needs to be parsed into a JSONObject first.','Assuming the body is always valid JSON — a failed request often returns an error page instead.']},
    {p:'Add a query parameter directly in the URL: search for a city called "Pretoria".',
     checks:[{l:'URL has a query parameter with Pretoria', t:/\?.*Pretoria|city=Pretoria/i}],
     s:'String url = "https://example.com/weather?city=Pretoria";',
     m:['Forgetting the ? that starts the query string, or the & between multiple parameters.','Leaving spaces in a query value unescaped — real code should URL-encode values with spaces or special characters.']},
    {p:'Set a request timeout of 5 seconds using <span class="inline-code">.timeout(Duration.ofSeconds(5))</span>.',
     checks:[{l:'Uses .timeout(Duration.ofSeconds(5))', t:/\.timeout\s*\(\s*Duration\.ofSeconds\s*\(\s*5\s*\)\s*\)/i}],
     s:'HttpRequest request = HttpRequest.newBuilder()\n    .uri(URI.create("https://example.com/api"))\n    .timeout(Duration.ofSeconds(5))\n    .build();',
     m:['Forgetting to import java.time.Duration.','Assuming a timeout cancels the whole program — it only fails that one request, which still needs to be handled.']},
    {p:'Add an <span class="inline-code">Authorization</span> header carrying an API key, in the form "Bearer YOUR_KEY".',
     checks:[{l:'Adds Authorization: Bearer header', t:/\.header\s*\(\s*"Authorization"\s*,\s*"Bearer /i}],
     s:'HttpRequest request = HttpRequest.newBuilder()\n    .uri(URI.create("https://example.com/api"))\n    .header("Authorization", "Bearer YOUR_KEY")\n    .build();',
     m:['Putting the API key directly in the URL instead of a header — many free APIs expect it as a header for a reason.','Hardcoding a real key in code you plan to commit publicly — that is a common way keys leak.']},
    {p:'After sending a request, write an if-statement that prints "Something went wrong" whenever the status code is not 200.',
     checks:[{l:'Checks statusCode() != 200', t:/statusCode\s*\(\s*\)\s*!=\s*200/i},{l:'Prints error message', t:/something went wrong/i}],
     s:'if (response.statusCode() != 200) {\n    System.out.println("Something went wrong");\n}',
     m:['Assuming every response is a success and skipping this check entirely — real APIs fail sometimes, and code should expect that.','Checking == 404 only, missing every other kind of failure like 500 or 403.']},
    {p:'Build two separate GET requests to the same API, one for page=1 and one for page=2.',
     checks:[{l:'Two HttpRequest objects', t:c=>((c.match(/HttpRequest\.newBuilder/gi)||[]).length>=2)},{l:'URL has page=1', t:/page=1/i},{l:'URL has page=2', t:/page=2/i}],
     s:'HttpRequest page1 = HttpRequest.newBuilder()\n    .uri(URI.create("https://example.com/api?page=1"))\n    .build();\n\nHttpRequest page2 = HttpRequest.newBuilder()\n    .uri(URI.create("https://example.com/api?page=2"))\n    .build();',
     m:['Reusing the exact same URL for both requests, so page 2 never actually gets asked for.','Sending both requests but only ever reading the response from one of them.']}
  ]
},

{ id:'junit', tab:'JUnit', title:'JUnit & Unit Testing', blurb:'Proving your code still works, automatically, every time.',
  links:[
    {label:'JUnit 5 — User Guide', url:'https://junit.org/junit5/docs/current/user-guide/'},
    {label:'Mockito — official site', url:'https://site.mockito.org/'}
  ],
  concepts:[
    {name:'What a unit test checks', explain:'A unit test checks one small piece of code — usually one method — automatically, every single time, instead of a person manually re-checking it by hand after every change. Every test method needs a @Test annotation above it, or JUnit will not run it at all.', code:'@Test\nvoid testAddition() { assertEquals(4, 2 + 2); }'},
    {name:'assertEquals and assertNotEquals', explain:'assertEquals(expected, actual) checks two values are equal, and fails with a clear "expected X but got Y" message if not. assertNotEquals checks the opposite — that two values are NOT equal.', code:'assertEquals(4, 2 + 2);\nassertNotEquals(5, 2 + 2);'},
    {name:'assertTrue and assertFalse', explain:'assertTrue checks that a condition is true; assertFalse checks that it is false. Both read very naturally for yes/no style checks.', code:'assertTrue(5 > 2);\nassertFalse(2 > 5);'},
    {name:'assertNull and assertNotNull', explain:'assertNull checks that a value is null (nothing there); assertNotNull checks that it actually holds something.', code:'Player p = null;\nassertNull(p);\nassertNotNull(new Player());'},
    {name:'assertSame and assertNotSame', explain:'assertSame checks that two references point to the exact same object in memory, not just two equal-looking ones — a stricter check than assertEquals. assertNotSame checks the opposite.', code:'Player p1 = new Player();\nPlayer p2 = p1;\nassertSame(p1, p2); // same object\nassertNotSame(p1, new Player()); // different objects'},
    {name:'assertArrayEquals', explain:'Comparing two arrays with plain assertEquals checks if they are the same array object, not whether they contain the same values. assertArrayEquals compares their contents, element by element, instead.', code:'int[] expected = {1, 2, 3};\nint[] actual = {1, 2, 3};\nassertArrayEquals(expected, actual);'},
    {name:'assertThrows', explain:'assertThrows checks that running some code actually throws a specific exception — useful for proving error-handling code really does reject bad input. The code under test has to be wrapped in a lambda.', code:'assertThrows(ArithmeticException.class, () -> {\n    int x = 10 / 0;\n});'},
    {name:'assertTimeout', explain:'assertTimeout checks that a piece of code finishes within a given time limit, and fails the test if it takes too long — useful for catching accidental infinite loops or very slow logic.', code:'assertTimeout(Duration.ofSeconds(1), () -> {\n    slowCalculation();\n});'},
    {name:'assertAll', explain:'Normally, if one assertion in a test fails, the rest of that method never runs. assertAll groups several assertions together and runs every one of them regardless, then reports all the failures at once instead of stopping at the first.', code:'assertAll(\n    () -> assertEquals(4, 2 + 2),\n    () -> assertTrue(5 > 2)\n);'},
    {name:'fail()', explain:'fail() immediately fails a test with a message, no condition needed — useful for marking code paths that should never actually be reached, like the line right after a call you expect to always throw.', code:'try {\n    riskyOperation();\n    fail("Expected an exception but none was thrown");\n} catch (Exception e) {\n    // expected\n}'},
    {name:'Setup and teardown', explain:'@BeforeEach runs before every single test in a class, which is useful for resetting shared objects. @AfterEach runs after every one, useful for cleaning up.', code:'@BeforeEach\nvoid setup() { calculator = new Calculator(); }'},
    {name:'@BeforeAll and @AfterAll', explain:'Unlike @BeforeEach/@AfterEach, which run around every single test, @BeforeAll and @AfterAll run exactly once for the whole test class — useful for expensive setup you only want to do a single time, like starting a shared test database. They also have to be static.', code:'@BeforeAll\nstatic void setupOnce() { /* runs once, before any test */ }'},
    {name:'@DisplayName and @Disabled', explain:'@DisplayName gives a test a readable name shown in test reports instead of the raw method name. @Disabled temporarily switches a test off without deleting it, useful when something is a known, not-yet-fixed issue.', code:'@Test\n@DisplayName("adds two positive numbers correctly")\n@Disabled("waiting on a bug fix")\nvoid testAddition() { }'},
    {name:'Mocking dependencies', explain:"Tools like Mockito let you create a fake version of a dependency (like a database or another class) so a unit test can check just your code's logic, without needing the real, slower thing to actually be there.", code:'PaymentService fake = Mockito.mock(PaymentService.class);'},
    {name:'Parameterized tests', explain:'Instead of writing several nearly-identical test methods for different inputs, a parameterized test runs the same test logic once for each value in a list you provide.', code:'@ParameterizedTest\n@ValueSource(ints = {2, 4, 6})\nvoid testIsEven(int n) { assertTrue(n % 2 == 0); }'},
    {name:'Test coverage', explain:'Test coverage is a percentage measuring how much of your code actually gets run by your tests. It is a useful signal for spotting untested areas, but a high number does not by itself prove the code is correct.', code:'// 85% coverage means 85% of lines ran during testing — not that they are all bug-free'}
  ],
  interview:[
    {level:'Beginner', q:'What does the @Test annotation do?'},
    {level:'Beginner', q:'What is the difference between assertEquals and assertTrue?'},
    {level:'Beginner', q:'What happens if a test method has no assertions at all?'},
    {level:'Intermediate', q:'What is the difference between @BeforeEach and @BeforeAll?'},
    {level:'Intermediate', q:'How would you test that a method throws a specific exception?'},
    {level:'Intermediate', q:'What is a mock, and why would you use one instead of a real dependency?'},
    {level:'Intermediate', q:'What does test coverage measure, and what does it NOT guarantee?'}
  ],
  projects:[{
    title:'A Fully Tested Calculator',
    blurb:'Build a small Calculator class and a genuinely thorough JUnit test suite for it, covering normal cases, edge cases, and error cases.',
    requirements:[
      'Methods for add, subtract, multiply, and divide.',
      'At least 8 test methods total, covering typical values and edge cases like zero and negative numbers.',
      'A test using assertThrows to confirm dividing by zero throws the right exception.',
      'A @BeforeEach method that creates a fresh Calculator before every test.'
    ]
  }],
  challenges:[
    {p:'Write a JUnit test method <span class="inline-code">testAddition</span> that checks 2 + 2 equals 4, using assertEquals and the @Test annotation.',
     checks:[{l:'Has @Test', t:/@Test/i},{l:'Method testAddition', t:/testAddition/i},{l:'Uses assertEquals(', t:/assertEquals\s*\(/i},{l:'Checks against 4', t:/\b4\b/}],
     s:'@Test\nvoid testAddition() {\n    int result = 2 + 2;\n    assertEquals(4, result);\n}',
     m:['Forgetting @Test — without it, JUnit does not recognize this method as a test at all, and it is silently skipped.','Writing assertEquals(result, 4) instead of assertEquals(4, result) — the convention is (expected, actual).']},
    {p:'Write a test called <span class="inline-code">testIsPositive</span> that uses <span class="inline-code">assertTrue</span> to check that 5 is greater than 0.',
     checks:[{l:'Has @Test', t:/@Test/i},{l:'Uses assertTrue(', t:/assertTrue\s*\(/i}],
     s:'@Test\nvoid testIsPositive() {\n    assertTrue(5 > 0);\n}',
     m:['Using assertEquals(true, ...) instead of the more direct assertTrue(...) — both technically work, but assertTrue reads clearer.','Testing a condition that is always true no matter what the code does, which proves nothing useful.']},
    {p:'Write a test that checks a variable is not null, using <span class="inline-code">assertNotNull</span>.',
     checks:[{l:'Has @Test', t:/@Test/i},{l:'Uses assertNotNull(', t:/assertNotNull\s*\(/i}],
     s:'@Test\nvoid testObjectExists() {\n    Player p = new Player();\n    assertNotNull(p);\n}',
     m:['Using assertTrue(p != null) instead — it works, but assertNotNull is the clearer, more standard way to say it.','Testing a variable that was never actually assigned anything, so the check is meaningless either way.']},
    {p:'Write an <span class="inline-code">@BeforeEach</span> method called <span class="inline-code">setup</span> that creates a new Calculator before every test.',
     checks:[{l:'Has @BeforeEach', t:/@BeforeEach/i},{l:'Method named setup', t:/setup\s*\(/i},{l:'Creates a Calculator', t:/new\s+Calculator\s*\(\s*\)/i}],
     s:'@BeforeEach\nvoid setup() {\n    calculator = new Calculator();\n}',
     m:['Forgetting @BeforeEach runs before EVERY test, not just once for the whole class — that is a different annotation (@BeforeAll).','Creating the object inside a single test instead, which means other tests do not get a fresh one.']},
    {p:'Write an <span class="inline-code">@AfterEach</span> method that prints "Test finished" after every test.',
     checks:[{l:'Has @AfterEach', t:/@AfterEach/i},{l:'Prints "Test finished"', t:/test finished/i}],
     s:'@AfterEach\nvoid cleanup() {\n    System.out.println("Test finished");\n}',
     m:['Confusing @AfterEach (runs after every test) with @AfterAll (runs once at the very end).','Using cleanup logic that depends on a specific test having run first — each test should be independent.']},
    {p:'Write a test that expects a method to throw an exception, using <span class="inline-code">assertThrows</span>.',
     checks:[{l:'Has @Test', t:/@Test/i},{l:'Uses assertThrows(', t:/assertThrows\s*\(/i}],
     s:'@Test\nvoid testDivideByZeroThrows() {\n    assertThrows(ArithmeticException.class, () -> {\n        int x = 10 / 0;\n    });\n}',
     m:['Forgetting the code that is expected to throw has to be wrapped in a lambda, not called directly.','Naming the wrong exception type — assertThrows fails if a different exception (or none) is actually thrown.']},
    {p:'Write one test with two separate assertEquals checks in it.',
     checks:[{l:'Has @Test', t:/@Test/i},{l:'At least 2 assertEquals(', t:c=>((c.match(/assertEquals\s*\(/gi)||[]).length>=2)}],
     s:'@Test\nvoid testCalculations() {\n    assertEquals(4, 2 + 2);\n    assertEquals(6, 2 * 3);\n}',
     m:['Cramming unrelated checks into one test — if either fails, it can be unclear which one actually broke.','Forgetting that if the FIRST assertion fails, the rest of that test method never even runs.']},
    {p:'Write a test comparing two doubles, 0.1 + 0.2 and 0.3, using assertEquals with a small delta to allow for floating-point rounding.',
     checks:[{l:'Has @Test', t:/@Test/i},{l:'assertEquals with 3 args (delta)', t:/assertEquals\s*\([^)]*,[^)]*,[^)]*\)/i}],
     s:'@Test\nvoid testDoubleAddition() {\n    assertEquals(0.3, 0.1 + 0.2, 0.0001);\n}',
     m:['Comparing doubles without a delta — 0.1 + 0.2 is not exactly 0.3 in floating-point math, and the test would fail without one.','Making the delta far too large, which can let a genuinely wrong result pass by accident.']},
    {p:'Write a test that checks two Strings, "hello" and "hello", are equal using assertEquals.',
     checks:[{l:'Has @Test', t:/@Test/i},{l:'assertEquals with two "hello" strings', t:/assertEquals\s*\(\s*"hello"\s*,\s*"hello"\s*\)/i}],
     s:'@Test\nvoid testStringsMatch() {\n    assertEquals("hello", "hello");\n}',
     m:['Using == to compare Strings elsewhere in real code instead of assertEquals/.equals() — == checks identity, not content.','Testing two strings that are obviously always equal, instead of comparing an actual method\'s output.']},
    {p:'Add a <span class="inline-code">@DisplayName</span> annotation giving the test a readable name like "adds two positive numbers correctly".',
     checks:[{l:'Has @DisplayName', t:/@DisplayName/i},{l:'Has @Test too', t:/@Test/i}],
     s:'@Test\n@DisplayName("adds two positive numbers correctly")\nvoid testAddition() {\n    assertEquals(4, 2 + 2);\n}',
     m:['Forgetting @DisplayName is purely cosmetic — the test still needs @Test to actually be recognized and run.','Writing a display name that does not actually describe what the test checks, which defeats its purpose.']}
  ]
},

{ id:'tdd', tab:'TDD', title:'Test-Driven Development', blurb:'Writing the test before the code that makes it pass.',
  links:[
    {label:'Martin Fowler — Test Driven Development (bliki)', url:'https://martinfowler.com/bliki/TestDrivenDevelopment.html'},
    {label:'Agile Alliance — TDD glossary entry', url:'https://www.agilealliance.org/glossary/tdd/'}
  ],
  concepts:[
    {name:'Red, Green, Refactor', explain:'TDD works in a small cycle: write a test that fails first (red, because the code does not exist yet), write just enough code to make it pass (green), then clean the code up without breaking the test (refactor).', code:'// 1. red: write a failing test\n// 2. green: write minimal code to pass it\n// 3. refactor: clean up, test still passes'},
    {name:'Why the test comes first', explain:'Writing the test before the implementation forces you to decide exactly what "done" looks like before you start guessing at a solution — it turns a vague idea into a concrete, checkable target.', code:'@Test\nvoid testAdd() { assertEquals(5, calc.add(2,3)); } // written before add() exists'},
    {name:'Small steps', explain:'TDD works best in tiny increments — one small behavior, one small test, one small bit of code — rather than writing a huge test for an entire feature all at once.', code:'// one behavior at a time, not the whole feature in one go'},
    {name:'The testing pyramid', explain:'A healthy test suite usually has lots of fast unit tests at the bottom, fewer integration tests in the middle (checking pieces work together), and even fewer slow, full end-to-end tests at the top.', code:'// many unit tests -> some integration tests -> few end-to-end tests'},
    {name:'Arrange, Act, Assert', explain:'Most tests naturally fall into three parts: Arrange (set up the situation), Act (do the thing being tested), Assert (check the result is what you expected). Structuring tests this way keeps them easy to read.', code:'// Arrange: Calculator calc = new Calculator();\n// Act:     int result = calc.add(2, 3);\n// Assert:  assertEquals(5, result);'},
    {name:'Mocking in TDD', explain:'When the code under test depends on something slow or external (like a real database or network call), a mock fakes that dependency, so the test stays fast and focused only on the logic actually being tested.', code:'Database fakeDb = Mockito.mock(Database.class);'},
    {name:'Benefits and trade-offs', explain:'TDD tends to catch regressions early and doubles as living documentation of intended behavior. The trade-off is that writing tests first takes discipline and can feel slower up front, even though it often saves time later.', code:'// slower to start, usually faster to change safely later'},
    {name:'Test doubles: stub, mock, and fake', explain:'These three are all "fake" stand-ins for a real dependency, but they mean slightly different things: a stub returns canned answers with no real logic, a mock also checks HOW it was called (like "was save() called exactly once?"), and a fake has a simplified but working implementation, like an in-memory database standing in for a real one.', code:'// stub: always returns the same canned value\n// mock: also verifies it was called correctly\n// fake: a working, simplified version'},
    {name:'TDD and BDD', explain:'TDD focuses on one small unit of code at a time, driven by the developer. BDD (covered more in the Acceptance Testing chapter) applies a similar red-then-green rhythm, but at the level of whole features, described in language the rest of the team can read too.', code:'// TDD: one method at a time, developer-facing\n// BDD: one feature at a time, whole-team-facing'}
  ],
  interview:[
    {level:'Beginner', q:'What does "red, green, refactor" mean?'},
    {level:'Beginner', q:'Why do you write the test before the code in TDD?'},
    {level:'Intermediate', q:'What is the Arrange-Act-Assert pattern?'},
    {level:'Intermediate', q:'What is the testing pyramid, and why are there more unit tests than end-to-end tests?'},
    {level:'Intermediate', q:'What is the difference between a mock, a stub, and a fake?'},
    {level:'Intermediate', q:'What is one real trade-off of practicing TDD?'}
  ],
  projects:[{
    title:'A Test-First String Utility',
    blurb:'Build a small StringUtils class entirely test-first — write each failing test before any implementation exists, one small behavior at a time.',
    requirements:[
      'At least 4 full red-green-refactor cycles, each adding one method (like isPalindrome, reverse, or countVowels).',
      'Every method has its test written and confirmed failing before the implementation exists.',
      'At least one refactor step that changes code structure without changing test results.',
      'A short written log of each red-green-refactor cycle you went through.'
    ]
  }],
  challenges:[
    {p:'Write a failing test FIRST for a method <span class="inline-code">add(2, 3)</span> on a Calculator class that does not exist yet, expecting 5.',
     checks:[{l:'Has @Test', t:/@Test/i},{l:'Calls add(2, 3)', t:/add\s*\(\s*2\s*,\s*3\s*\)/i},{l:'Uses assertEquals(5', t:/assertEquals\s*\(\s*5/i}],
     s:'@Test\nvoid testAdd() {\n    Calculator calc = new Calculator();\n    assertEquals(5, calc.add(2, 3));\n}',
     m:['Writing the Calculator class first out of habit — TDD specifically asks you to write the test before the code exists.','Testing something vague like "addition works" instead of one specific, concrete input and expected output.']},
    {p:'Now write the minimal Calculator class with just enough of an add() method to make that test pass.',
     checks:[{l:'Class Calculator', t:/class\s+Calculator/i},{l:'int add(...) method', t:/int\s+add\s*\(/i},{l:'Returns a+b or similar', t:/return\s+\w+\s*\+\s*\w+/i}],
     s:'class Calculator {\n    int add(int a, int b) {\n        return a + b;\n    }\n}',
     m:['Writing extra methods "just in case" — TDD favors writing only what the current failing test actually needs.','Hardcoding "return 5;" to cheat the test — technically green, but it is not really implementing addition.']},
    {p:'Write a failing test for <span class="inline-code">subtract(5, 3)</span> expecting 2.',
     checks:[{l:'Has @Test', t:/@Test/i},{l:'Calls subtract(5, 3)', t:/subtract\s*\(\s*5\s*,\s*3\s*\)/i},{l:'Uses assertEquals(2', t:/assertEquals\s*\(\s*2/i}],
     s:'@Test\nvoid testSubtract() {\n    assertEquals(2, calc.subtract(5, 3));\n}',
     m:['Reusing the exact same test method name as an earlier test — method names in one test class need to be unique.','Testing subtract with numbers where the answer would be the same regardless of a mistake, like subtract(2,2).']},
    {p:'Implement subtract() minimally so that test passes.',
     checks:[{l:'int subtract(...)', t:/int\s+subtract\s*\(/i},{l:'Returns a-b or similar', t:/return\s+\w+\s*-\s*\w+/i}],
     s:'int subtract(int a, int b) {\n    return a - b;\n}',
     m:['Copy-pasting the add() method and forgetting to actually change + to -.','Getting the argument order backwards, computing b - a instead of a - b.']},
    {p:'Do a refactor step: add a comment explaining what you cleaned up, without changing any test\'s expected result.',
     checks:[{l:'Has a comment mentioning refactor', t:/\/\/.*refactor/i}],
     s:'// refactor: renamed parameters a/b to num1/num2 for clarity — tests still pass unchanged\nint add(int num1, int num2) {\n    return num1 + num2;\n}',
     m:['Changing behavior during a "refactor" — refactoring should never change what the code actually does, only how it is written.','Skipping re-running the tests after refactoring, which is the entire point of doing it safely.']},
    {p:'Write a failing test first for a method <span class="inline-code">isEven(4)</span> expecting true.',
     checks:[{l:'Has @Test', t:/@Test/i},{l:'Calls isEven(4)', t:/isEven\s*\(\s*4\s*\)/i},{l:'Uses assertTrue', t:/assertTrue/i}],
     s:'@Test\nvoid testIsEvenTrue() {\n    assertTrue(calc.isEven(4));\n}',
     m:['Using assertEquals(true, ...) instead of the clearer assertTrue(...).','Testing only one case (even) without ever adding a test for the opposite (odd) later.']},
    {p:'Implement isEven() minimally so that test passes.',
     checks:[{l:'boolean isEven(', t:/boolean\s+isEven\s*\(/i},{l:'Uses modulo % 2', t:/%\s*2/i}],
     s:'boolean isEven(int n) {\n    return n % 2 == 0;\n}',
     m:['Hardcoding "return true;" to pass the single known test without truly checking anything.','Forgetting == 0, and instead just returning n % 2 directly, which is not a boolean.']},
    {p:'Write a test for the edge case <span class="inline-code">isEven(0)</span>, expecting true.',
     checks:[{l:'Has @Test', t:/@Test/i},{l:'Calls isEven(0)', t:/isEven\s*\(\s*0\s*\)/i},{l:'Uses assertTrue', t:/assertTrue/i}],
     s:'@Test\nvoid testZeroIsEven() {\n    assertTrue(calc.isEven(0));\n}',
     m:['Assuming zero is a strange, "neither" case — mathematically, 0 is even, and code should reflect that on purpose.','Skipping edge cases like 0 and negative numbers entirely, only ever testing "normal" values.']},
    {p:'Write a failing test that expects an exception when dividing by zero.',
     checks:[{l:'Has @Test', t:/@Test/i},{l:'Uses assertThrows', t:/assertThrows\s*\(/i}],
     s:'@Test\nvoid testDivideByZeroThrows() {\n    assertThrows(ArithmeticException.class, () -> calc.divide(10, 0));\n}',
     m:['Testing divide(10, 0) with assertEquals against some number — dividing by zero should be treated as an error case, not a normal result.','Forgetting the code under test has to be wrapped in a lambda for assertThrows to work.']},
    {p:'Implement divide() so it throws an ArithmeticException when the divisor is zero, otherwise returns a / b.',
     checks:[{l:'int divide(', t:/int\s+divide\s*\(/i},{l:'Checks for zero', t:/==\s*0/i},{l:'Throws ArithmeticException', t:/throw\s+new\s+ArithmeticException/i}],
     s:'int divide(int a, int b) {\n    if (b == 0) {\n        throw new ArithmeticException("Cannot divide by zero");\n    }\n    return a / b;\n}',
     m:['Letting Java throw its own default ArithmeticException by just writing a / b — that actually already happens automatically for integer division by zero, but explicit handling is often clearer and testable with a specific message.','Checking a == 0 instead of b == 0 — it is the divisor that cannot be zero, not the numerator.']}
  ]
},

{ id:'acceptance', tab:'Acceptance', title:'Acceptance Testing', blurb:'Checking a whole feature works the way a real user expects.',
  links:[
    {label:'Cucumber — official documentation', url:'https://cucumber.io/docs/guides/overview/'},
    {label:'Cucumber — Gherkin reference', url:'https://cucumber.io/docs/gherkin/reference/'}
  ],
  concepts:[
    {name:'What acceptance testing checks', explain:'Where a unit test checks one small method in isolation, an acceptance test checks a whole feature behaves correctly from a user\'s point of view — like test-driving an entire car instead of just checking that one bolt is tight.', code:'// "can a user actually log in end-to-end?" — not just "does hashPassword() work?"'},
    {name:'Given / When / Then', explain:'Acceptance tests are often written first in plain language using a Given/When/Then structure: Given some starting situation, When something happens, Then something specific should be true.', code:'Given the user is on the login page\nWhen they enter valid credentials\nThen they see their dashboard'},
    {name:'Gherkin and feature files', explain:'Gherkin is a simple, near-English syntax for writing these scenarios in a ".feature" file, which tools like Cucumber can then run against real, automated step definitions in code.', code:'Feature: User login\n\n  Scenario: successful login\n    Given the user is on the login page'},
    {name:'BDD (Behavior-Driven Development)', explain:'Acceptance testing is often paired with BDD, which is about the whole team — not just developers — agreeing on exactly how a feature should behave, described in plain language, before any code gets written.', code:'// BDD: agree on behavior in plain English first, automate it second'},
    {name:'Definition of done', explain:'A feature is not really "done" just because the code compiles and runs. Many teams treat passing acceptance tests as part of the actual checklist for calling a feature complete.', code:'// "done" often means: code written, unit tested, AND acceptance criteria pass'},
    {name:'Acceptance testing vs UAT', explain:'Acceptance tests, as covered here, are usually automated and run constantly as part of the pipeline. User Acceptance Testing (UAT) is a separate, typically manual round where real users or stakeholders try the feature themselves before it ships.', code:'// automated acceptance tests run constantly; UAT is a manual round near the end'},
    {name:'Background and Scenario Outline', explain:'Gherkin also supports a Background section for steps shared by every scenario in a file, and a Scenario Outline paired with an Examples table, which runs the same scenario shape against several different sets of data.', code:'Scenario Outline: login attempts\n  Given a username of "<username>"\n  Examples:\n    | username |\n    | milo     |\n    | bella    |'},
    {name:'Writing good acceptance criteria', explain:'Good criteria describe an observable outcome, not an implementation detail — "the user sees an error message" is testable and durable; "the code calls validateInput()" is not, and will break the moment the implementation changes.', code:'// good: the user sees an error message\n// too implementation-specific: validateInput() returns false'},
    {name:'Where acceptance tests fit in the pyramid', explain:'Acceptance and end-to-end tests sit at the top of the testing pyramid mentioned in the TDD chapter — valuable, but slower and more expensive to run than unit tests, so teams usually write far fewer of them and rely on unit tests for most day-to-day coverage.', code:'// few acceptance/end-to-end tests, on top of many fast unit tests underneath'}
  ],
  interview:[
    {level:'Beginner', q:'What is the difference between a unit test and an acceptance test?'},
    {level:'Beginner', q:'What do Given, When, and Then each represent in Gherkin?'},
    {level:'Intermediate', q:'What is BDD, and how does it relate to acceptance testing?'},
    {level:'Intermediate', q:'What is the difference between acceptance testing and User Acceptance Testing (UAT)?'},
    {level:'Intermediate', q:'What is a Scenario Outline, and when would you use one?'},
    {level:'Intermediate', q:'Why should acceptance criteria describe behavior, not implementation?'}
  ],
  projects:[{
    title:'Acceptance Scenarios for a Login Feature',
    blurb:'Write a complete .feature file with multiple Gherkin scenarios covering both a successful and a failed login, from a user\'s point of view.',
    requirements:[
      'A Feature: line naming the feature clearly.',
      'At least 3 scenarios: successful login, wrong password, and a locked account.',
      'Every scenario follows a proper Given/When/Then structure.',
      'A short list of acceptance criteria, in your own words, that these scenarios are meant to prove.'
    ]
  }],
  challenges:[
    {p:'Write a Given/When/Then scenario, in plain Gherkin text, for logging in with correct credentials.',
     checks:[{l:'Has Given', t:/Given/i},{l:'Has When', t:/When/i},{l:'Has Then', t:/Then/i}],
     s:'Given the user is on the login page\nWhen they enter a correct username and password\nThen they are taken to their dashboard',
     m:['Skipping straight to Then without a When — the reader loses track of what action actually triggered the outcome.','Writing implementation details (like specific button IDs) instead of describing user-facing behavior.']},
    {p:'Write a Gherkin <span class="inline-code">Feature:</span> line describing "User login".',
     checks:[{l:'Feature: line present', t:/Feature\s*:\s*User login/i}],
     s:'Feature: User login',
     m:['Forgetting the colon after Feature — Gherkin syntax expects it.','Describing an implementation detail as the feature name instead of the actual user-facing capability.']},
    {p:'Write a <span class="inline-code">Scenario:</span> line for "successful login".',
     checks:[{l:'Scenario: line present', t:/Scenario\s*:\s*successful login/i}],
     s:'Scenario: successful login',
     m:['Using vague scenario names like "test 1" instead of something that describes exactly what is being checked.','Forgetting a Feature: file usually needs at least one Scenario: underneath it to actually test anything.']},
    {p:'Write a Given step: "Given the user is on the login page".',
     checks:[{l:'Given the user is on the login page', t:/Given the user is on the login page/i}],
     s:'Given the user is on the login page',
     m:['Describing an unrelated starting state that has nothing to do with the scenario being tested.','Combining multiple unrelated setup steps into one overly long Given line.']},
    {p:'Write a When step describing the user entering valid credentials.',
     checks:[{l:'Starts with When', t:/^When/im},{l:'Mentions credentials or username/password', t:/credentials|username|password/i}],
     s:'When they enter a valid username and password',
     m:['Writing the When step as a Then by accident — When describes the action being taken, not the result.','Being too vague, like "When they log in", which hides what specific action is actually happening.']},
    {p:'Write a Then step verifying the user sees their dashboard.',
     checks:[{l:'Starts with Then', t:/^Then/im},{l:'Mentions dashboard', t:/dashboard/i}],
     s:'Then they see their dashboard',
     m:['Writing something unverifiable, like "Then everything works", instead of a specific, checkable outcome.','Putting a Then step before the When that is supposed to cause it.']},
    {p:'Write a second scenario for a FAILED login (wrong password), with its own Given/When/Then.',
     checks:[{l:'Has a second Scenario:', t:/Scenario\s*:/i},{l:'Mentions wrong or incorrect password', t:/wrong password|incorrect password/i},{l:'Has Then', t:/Then/i}],
     s:'Scenario: failed login with wrong password\n  Given the user is on the login page\n  When they enter a valid username and an incorrect password\n  Then they see an error message',
     m:['Reusing the exact same scenario name as the successful-login one — each scenario should be named uniquely.','Forgetting to actually change the outcome in Then — a failed login should not end up back at the dashboard.']},
    {p:'Write a Java step definition method that matches a Given string, using the <span class="inline-code">@Given</span> annotation.',
     checks:[{l:'Uses @Given(', t:/@Given\s*\(/i}],
     s:'@Given("the user is on the login page")\npublic void userIsOnLoginPage() {\n    driver.get("https://example.com/login");\n}',
     m:['Letting the text inside @Given(...) not match the .feature file exactly — Cucumber matches these strings precisely.','Putting real assertions inside a Given step — Given is for setup, Then is normally where checks belong.']},
    {p:'Write a short list of acceptance criteria for a login feature, as comment bullet points.',
     checks:[{l:'Has at least one comment bullet', t:/\/\/\s*-|\/\/\s*\*/},{l:'Mentions login-related behavior', t:/login|password|credential/i}],
     s:'// Acceptance criteria:\n// - a user with correct credentials reaches their dashboard\n// - a user with an incorrect password sees an error, and stays on the login page',
     m:['Writing criteria so vague they could never actually be turned into a Given/When/Then scenario.','Describing how the code works internally instead of what a user actually experiences.']},
    {p:'Write a code comment contrasting a unit test with an acceptance test, in your own words.',
     checks:[{l:'Mentions "unit"', t:/unit/i},{l:'Mentions "acceptance"', t:/acceptance/i}],
     s:'// A unit test checks one small method in isolation, like hashPassword().\n// An acceptance test checks the whole login feature works end-to-end, the way a real user would experience it.',
     m:['Describing them as basically the same thing — they check very different levels of the system, and both matter.','Assuming more acceptance tests always means better coverage — they are usually slower, so unit tests still carry most of the detailed checking.']}
  ]
},

{ id:'buildtools', tab:'Build Scripts', title:'Build Scripts (Maven, Gradle & Make)', blurb:'Automating compile, test, and package instead of doing it by hand.',
  links:[
    {label:'Apache Maven — Guides', url:'https://maven.apache.org/guides/index.html'},
    {label:'Gradle — User Manual', url:'https://docs.gradle.org/current/userguide/userguide.html'},
    {label:'GNU Make — official manual', url:'https://www.gnu.org/software/make/manual/make.html'}
  ],
  concepts:[
    {name:'What a build tool actually does', explain:'A build tool automates the tasks needed to turn source code into something runnable — commonly clean, then compile, then test, then package. Instead of typing each of those commands by hand, every single time, a build tool runs them the same way, in the same order, automatically. That saves time, avoids repeated typing mistakes, keeps builds consistent between developers, and makes it far easier for someone else to build your project at all.', code:'clean -> compile -> test -> package\n// the same four steps, automated instead of typed by hand each time'},
    {name:'Build tool vs. build script — they are not the same thing', explain:'A build tool is the actual program that performs the work — Maven, Gradle, and Make are all build tools. A build script is the file of instructions that tells a tool what to do — a pom.xml, a build.gradle, or a Makefile. The tool is the engine; the script is the set of directions you hand it.', code:'// build tool:   Maven, Gradle, Make (the programs)\n// build script:  pom.xml, build.gradle, Makefile (the instructions)'},

    {divider:'Maven'},
    {name:'What Maven is, and checking it is installed', explain:'Maven is a Java build automation and dependency management tool: it compiles code, runs tests, manages external libraries, packages applications, and cleans old build output — all through one command, mvn, typed in a terminal. Before using it, confirm it is actually installed.', code:'mvn --version\n// prints the installed Maven version and which Java it is using'},
    {name:'A complete pom.xml, explained line by line', explain:'pom.xml stands for Project Object Model — the file that tells Maven everything about your project. This is not a fragment — it is a genuinely complete, working Maven project file for a small Java app with JUnit. Every real pom.xml you will ever open has these same core pieces: <ul style="margin:10px 0 0 18px; padding:0;">'
      +'<li style="margin-bottom:6px;"><code>&lt;?xml version="1.0"?&gt;</code> — every XML file starts with this line. It just tells the computer "this is XML, version 1.0" — you never need to think about it again.</li>'
      +'<li style="margin-bottom:6px;"><code>&lt;project&gt;...&lt;/project&gt;</code> — the single outer container. Everything about your project lives inside this one tag.</li>'
      +'<li style="margin-bottom:6px;"><code>&lt;modelVersion&gt;4.0.0&lt;/modelVersion&gt;</code> — tells Maven which POM model the file follows. This is not the Maven software\'s own version — for a normal project you almost always just leave this as 4.0.0.</li>'
      +'<li style="margin-bottom:6px;"><code>&lt;groupId&gt;com.example&lt;/groupId&gt;</code> — identifies the organisation or person responsible for the project, usually a domain written backwards. Groups related projects together.</li>'
      +'<li style="margin-bottom:6px;"><code>&lt;artifactId&gt;dog-shelter&lt;/artifactId&gt;</code> — the actual name of THIS project. This becomes part of the built jar\'s filename.</li>'
      +'<li style="margin-bottom:6px;"><code>&lt;version&gt;1.0.0&lt;/version&gt;</code> — this specific project\'s version number, following the MAJOR.MINOR.PATCH pattern covered a few concepts down.</li>'
      +'<li style="margin-bottom:6px;"><code>&lt;properties&gt;</code> — small settings, here just fixing which Java version to compile for so it does not depend on whatever happens to be installed on a given machine.</li>'
      +'<li style="margin-bottom:6px;"><code>&lt;dependencies&gt;</code> — the list of outside libraries this project needs. Everything you learned in the Java Libraries chapter gets pulled in exactly like this.</li>'
      +'<li style="margin-bottom:6px;"><code>&lt;dependency&gt;...&lt;/dependency&gt;</code> — one single library: JUnit here, identified by its own groupId, artifactId, and version, plus a scope (covered a few concepts down).</li>'
      +'</ul>Save this exact file as <code>pom.xml</code> in your project\'s root folder, and <code>mvn test</code> already knows how to find and use it — no extra setup.',
     code:'<?xml version="1.0" encoding="UTF-8"?>\n<project xmlns="http://maven.apache.org/POM/4.0.0">\n    <modelVersion>4.0.0</modelVersion>\n\n    <groupId>com.example</groupId>\n    <artifactId>dog-shelter</artifactId>\n    <version>1.0.0</version>\n\n    <properties>\n        <maven.compiler.source>17</maven.compiler.source>\n        <maven.compiler.target>17</maven.compiler.target>\n    </properties>\n\n    <dependencies>\n        <dependency>\n            <groupId>org.junit.jupiter</groupId>\n            <artifactId>junit-jupiter</artifactId>\n            <version>5.10.0</version>\n            <scope>test</scope>\n        </dependency>\n    </dependencies>\n</project>'},
    {name:'A standard Maven project structure', explain:'Maven expects a specific, predictable folder shape — once you know it, you can open ANY Maven project and immediately know where to look. src/main/java holds your actual application code. src/test/java holds your test code, in a completely separate tree so tests never accidentally ship inside the real application. pom.xml sits at the very root, next to both.', code:'project/\n│\n├── pom.xml\n│\n└── src/\n    ├── main/\n    │   └── java/     <- your application code\n    │\n    └── test/\n        └── java/     <- your test code'},
    {name:"Maven's build lifecycle", explain:'Maven runs through ordered phases: validate, compile, test, package, verify, install, deploy. Running a later phase automatically runs every phase before it too — running "package" also compiles and tests first. That is why mvn package can fail before it ever gets to actually packaging anything: a failing test earlier in the chain stops it cold.', code:'validate -> compile -> test -> package -> verify -> install -> deploy'},
    {name:'Dependency scopes', explain:'Not every dependency is needed the same way: "compile" scope is needed everywhere, "test" scope is only needed for running tests, and "provided" scope is available while building but expected to already exist wherever the app actually runs.', code:'<scope>test</scope>'},
    {name:'Where dependencies come from', explain:'When you declare a dependency, the build tool first checks your local cache on your own machine. If it is not there yet, it downloads it from a remote repository, like Maven Central, and caches it locally for next time.', code:'// local cache first, then a remote repository like Maven Central'},
    {name:'Maven plugins', explain:'Plugins are what actually let Maven perform specific tasks — compiling, testing, packaging, checking code style, generating files. Maven itself is mostly a coordinator; a plugin is what does the real work for one particular phase.', code:'Maven\n  -> plugin\n    -> specific task (compile / test / package / ...)'},
    {name:'Semantic versioning', explain:'Most libraries use version numbers like 1.4.2, following MAJOR.MINOR.PATCH. PATCH means a bug fix (1.4.2 -> 1.4.3). MINOR means a new feature that does not break anything existing (1.4.2 -> 1.5.0). MAJOR means a breaking change (1.4.2 -> 2.0.0). Reading a version number this way tells you how risky an upgrade might be before you even open the changelog.', code:'1.4.2\n// MAJOR . MINOR . PATCH\n\n// bug fix      -> PATCH  (1.4.2 -> 1.4.3)\n// new feature  -> MINOR  (1.4.2 -> 1.5.0)\n// breaking     -> MAJOR  (1.4.2 -> 2.0.0)'},
    {name:'SNAPSHOT versions', explain:'A version ending in -SNAPSHOT, like 1.0-SNAPSHOT, means "this version is still under active development" — not yet a finished release. When it is actually ready to ship, the SNAPSHOT suffix gets dropped (1.0-SNAPSHOT becomes 1.0.0), and work on the next version can then start under a new SNAPSHOT, like 1.1.0-SNAPSHOT.', code:'1.0-SNAPSHOT   -- still being worked on\n     |\n     v\n1.0.0          -- released\n     |\n     v\n1.1.0-SNAPSHOT -- next version, in progress'},
    {name:'Multi-module projects', explain:'Larger projects are often split into several smaller modules (like an "api" module and a "core" module) that build together but can be developed and tested somewhat independently — a parent pom.xml or settings.gradle ties them together.', code:'// settings.gradle\ninclude "api", "core"'},
    {name:'Build profiles', explain:'A profile lets you switch build settings depending on context — like using a different database URL for a local build versus a production one — without maintaining two entirely separate build files.', code:'<profiles>\n  <profile>\n    <id>production</id>\n  </profile>\n</profiles>'},
    {name:'Clean builds', explain:'mvn clean removes previously generated build files — usually everything under target/ — before rebuilding from scratch. mvn clean package chains the two together: wipe out anything old, then build a fresh package, ruling out stale leftovers as the cause of a confusing bug.', code:'mvn clean\nmvn clean package'},
    {name:'The complete relationship, all in one place', explain:'Every piece covered in this chapter fits into one chain, top to bottom. A build script (a Makefile) automates project commands. Maven is the actual tool that performs the Java build tasks those commands trigger. pom.xml is what configures Maven so it knows what to build in the first place. Keeping these three roles straight in your head — automator, doer, configuration — makes any new build tool you meet later far less confusing, because they all split the same way.', code:'BUILD SCRIPT\n     |\n  Makefile          (automates project commands)\n     |\n   Maven             (performs Java build tasks)\n     |\n  pom.xml            (configures the Maven project)\n     |\nJava Project'},

    {divider:'Gradle'},
    {name:'The same project, as a complete build.gradle', explain:'Same project, same one dependency, Gradle\'s shorter syntax instead of XML: <ul style="margin:10px 0 0 18px; padding:0;">'
      +'<li style="margin-bottom:6px;"><code>plugins { id \'java\' }</code> — tells Gradle this is a Java project, which unlocks built-in tasks like compileJava, test, and build.</li>'
      +'<li style="margin-bottom:6px;"><code>group</code> and <code>version</code> — the direct equivalent of Maven\'s groupId and version tags.</li>'
      +'<li style="margin-bottom:6px;"><code>repositories { mavenCentral() }</code> — WHERE to download dependencies from. mavenCentral() is the same public repository Maven uses by default too.</li>'
      +'<li style="margin-bottom:6px;"><code>dependencies { testImplementation \'...\' }</code> — the one JUnit dependency again, written as a single compact string instead of nested XML tags.</li>'
      +'</ul>Save as <code>build.gradle</code> in the project root, and <code>./gradlew test</code> already knows how to find and use it.',
     code:'plugins {\n    id \'java\'\n}\n\ngroup = \'com.example\'\nversion = \'1.0.0\'\n\nrepositories {\n    mavenCentral()\n}\n\ndependencies {\n    testImplementation \'org.junit.jupiter:junit-jupiter:5.10.0\'\n}\n\ntest {\n    useJUnitPlatform()\n}'},

    {divider:'Make'},
    {name:'What Make is, and why it still matters', explain:'Maven and Gradle are Java-specific. Make is older, far more general-purpose, and still shows up constantly — wrapping Docker commands, gluing together multi-language projects, or standing in for a full build tool on something small. Instead of typing a full command like "mvn test" every time, a Makefile lets you define a short target once, then just type "make test" from then on.', code:'// instead of typing this every time:\nmvn test\n\n// define it once in a Makefile as a target named "test",\n// then just run:\nmake test'},
    {name:'A complete Makefile, explained line by line', explain:'A Makefile is a list of named shortcuts for commands you would otherwise have to type out in full, every time. Walk through this one: <ul style="margin:10px 0 0 18px; padding:0;">'
      +'<li style="margin-bottom:6px;"><code>build:</code> — this is a "target". Typing <code>make build</code> in a terminal runs everything indented underneath it.</li>'
      +'<li style="margin-bottom:6px;">The indented line under it, <code>javac -d out src/main/java/chat/*.java</code>, is the ACTUAL command — the exact same one from the capstones chapter, just given a short name.</li>'
      +'<li style="margin-bottom:6px;"><code>run: build</code> — the word after the colon is a dependency. This says "before running \'run\', always run \'build\' first" — so <code>make run</code> alone compiles AND runs, in the right order, automatically.</li>'
      +'<li style="margin-bottom:6px;"><code>test:</code> — another independent target; <code>make test</code> runs only the test command, nothing else.</li>'
      +'<li style="margin-bottom:6px;"><code>clean:</code> — deletes the out/ folder, a common shortcut before a fresh rebuild, mirroring "mvn clean" above.</li>'
      +'<li style="margin-bottom:6px;"><code>rebuild: clean build</code> — a dependency can list MORE than one target; this runs clean first, then build, giving you a genuinely fresh build in one command.</li>'
      +'<li style="margin-bottom:6px;"><code>.PHONY: build run test clean rebuild</code> — this line is easy to forget and worth remembering: it tells Make that these words are ACTIONS, not real files it should check for on disk. Without it, if a file literally named "clean" ever existed in the folder, Make would get confused and refuse to run.</li>'
      +'</ul><b>The one gotcha that trips up almost everyone the first time:</b> the command line under each target MUST be indented with a real TAB character, not spaces. A text editor that quietly converts tabs to spaces will break every Makefile you write with a confusing "missing separator" error — this is the single most common first-time Makefile mistake there is.',
     code:'.PHONY: build run test clean rebuild\n\nbuild:\n\tjavac -d out src/main/java/chat/*.java\n\nrun: build\n\tjava -cp out chat.ChatServer\n\ntest:\n\tmvn test\n\nclean:\n\trm -rf out\n\nrebuild: clean build'},
    {name:'The full chain, start to finish', explain:'It is easy to lose track of how these pieces actually connect once a project has all of them at once. Typing "make test" sets off a short chain: Make reads the Makefile, finds the "test" target, and runs the real command written underneath it — which happens to be a Maven command, which Maven then carries out using the configuration in pom.xml, against your actual Java project.', code:'make test\n   |\n   v\nMakefile          (finds the "test" target)\n   |\n   v\nmvn test          (the real command underneath it)\n   |\n   v\nMaven             (reads pom.xml, runs the tests)\n   |\n   v\nYour Java project'}
  ],

    {p:'Write a code comment explaining, in your own words, what <span class="inline-code">mvn clean package</span> does and why someone would run it instead of just <span class="inline-code">mvn package</span>.',

     s:'// mvn clean package wipes out any old build files first, then does a fresh package build —\n// useful when something feels stale or broken and you want to rule out leftover files as the cause',

    {p:'Write a Makefile with a <span class="inline-code">run</span> target that depends on <span class="inline-code">build</span> (so <span class="inline-code">make run</span> always builds first), then runs <span class="inline-code">java Main</span>.',

     checks:[{l:'Has .PHONY listing the targets', t:/\.PHONY:.*clean.*compile.*test.*package/i},{l:'clean target runs mvn clean', t:/clean:\n\tmvn clean/},{l:'compile target runs mvn compile', t:/compile:\n\tmvn compile/},{l:'test target runs mvn test', t:/test:\n\tmvn test/},{l:'package target runs mvn package', t:/package:\n\tmvn package/}],

     m:['Forgetting .PHONY entirely — harmless on a small project, but a bad habit that eventually causes a confusing failure on a real one.','Mixing up the order of words in .PHONY with the actual target names below — they need to match exactly.']},
    {p:'Add <span class="inline-code">build</span> and <span class="inline-code">rebuild</span> targets to a Makefile, where build runs <span class="inline-code">mvn package</span> and rebuild depends on both <span class="inline-code">clean</span> and <span class="inline-code">build</span>.',

    {p:'Given the version <span class="inline-code">1.2.3</span>, write three comment lines showing the new version number after: a bug fix, a new feature, and a breaking change.',

     s:'// bug fix (PATCH):     1.2.3 -> 1.2.4\n// new feature (MINOR): 1.2.3 -> 1.3.0\n// breaking change (MAJOR): 1.2.3 -> 2.0.0',
     m:['Bumping the wrong segment — a new feature resets PATCH back to 0, it does not just increment it.','Forgetting a MAJOR bump resets BOTH minor and patch back to zero, not just major itself.']},
    {p:'Write a code comment explaining the chain: running <span class="inline-code">make test</span> leads to the Makefile, which leads to <span class="inline-code">mvn test</span>, which leads to Maven actually running the tests.',
     checks:[{l:'Mentions make test', t:/make test/i},{l:'Mentions Makefile', t:/Makefile/i},{l:'Mentions mvn test', t:/mvn test/i},{l:'Mentions Maven', t:/Maven/i}],
     s:'// make test -> reads the Makefile -> finds the "test" target ->\n// runs "mvn test" underneath it -> Maven actually runs the tests',
