<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Backend Basics — field notes</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --grid:28px;
    --paper:#F5F5F3;
    --paper-dark:#E7E7E4;
    --line:#CCCCCC;
    --ink:#1F1F1F;
    --ink-soft:#5A5A5A;
    --blue:#454545;
    --red:#6E6E6E;
    --green:#2E2E2E;
    --highlight:#DADAD7;
    --card:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper-dark);
    color:var(--ink);
    font-family:'Times New Roman', Times, Georgia, serif;
    font-size:15px;
    line-height:var(--grid);
  }
  p, li, .concept-explain, .note-text{
    line-height:var(--grid);
    margin:0 0 var(--grid) 0;
    font-size:15px;
  }

  /* ---------- MASTHEAD ---------- */
  header.masthead{
    background:var(--paper-dark);
    padding:22px 28px 14px 28px;
    border-bottom:2px solid var(--line);
  }
  header.masthead h1{
    font-weight:700;
    font-family:'Times New Roman', Times, Georgia, serif;
    font-size:44px;
    margin:0;
    color:var(--ink);
    line-height:1.1;
  }
  header.masthead .byline{
    font-size:13px;
    color:var(--ink-soft);
    font-style:italic;
    margin-top:2px;
  }
  header.masthead .byline b{font-style:normal;color:var(--blue);}
  .search-wrap{position:relative; margin-top:12px; max-width:360px;}
  .search-input{
    width:100%;
    font-family:'JetBrains Mono',monospace;
    font-size:12.5px;
    padding:8px 11px;
    border:1.5px solid var(--line);
    border-radius:5px;
    background:var(--card);
    color:var(--ink);
  }
  .search-input:focus{outline:2px solid var(--blue); outline-offset:1px;}
  .search-results{
    position:absolute;
    top:calc(100% + 5px);
    left:0; right:0;
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:6px;
    max-height:320px;
    overflow-y:auto;
    z-index:30;
    box-shadow:2px 4px 10px rgba(0,0,0,0.15);
    display:none;
  }
  .search-results.open{display:block;}
  .search-result-item{padding:9px 12px; cursor:pointer; border-bottom:1px solid var(--line); font-size:12.5px;}
  .search-result-item:last-child{border-bottom:none;}
  .search-result-item:hover{background:var(--paper-dark);}
  .search-result-item .srtype{font-family:'JetBrains Mono',monospace; font-size:9.5px; color:var(--blue); text-transform:uppercase; letter-spacing:0.6px; display:block; margin-bottom:3px;}
  .search-result-item .srtitle{font-weight:700; color:var(--ink); display:block;}
  .search-result-item .srsnippet{color:var(--ink-soft); font-size:11.5px; margin-top:2px; line-height:16px;}
  .search-empty{padding:12px; font-size:12px; color:var(--ink-soft); font-style:italic;}

  /* ---------- HORIZONTAL CHAPTER NAV ---------- */
  nav.tabbar{
    display:flex;
    overflow-x:auto;
    gap:2px;
    background:var(--paper-dark);
    border-bottom:2px solid var(--line);
    padding:0 20px;
    scrollbar-width:thin;
  }
  nav.tabbar .tabitem{
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:7px;
    padding:11px 15px;
    cursor:pointer;
    font-size:13px;
    font-family:'JetBrains Mono',monospace;
    color:var(--ink-soft);
    border-bottom:3px solid transparent;
    white-space:nowrap;
  }
  nav.tabbar .tabitem:hover{color:var(--ink);}
  nav.tabbar .tabitem.active{
    color:var(--ink);
    border-bottom:3px solid var(--red);
    font-weight:700;
  }
  nav.tabbar .tabitem .dot{
    width:16px;height:16px;border-radius:50%;
    font-size:9px;
    display:flex;align-items:center;justify-content:center;
    border:1.3px solid var(--ink-soft);
    background:var(--card);
  }
  nav.tabbar .tabitem.done .dot{background:var(--green); border-color:var(--green); color:#fff;}

  /* ---------- PAGE ---------- */
  .page{
    background-color:var(--paper);
    min-height:60vh;
  }
  .wrap{
    max-width:820px;
    margin:0 auto;
    padding:var(--grid) 28px 0 28px;
  }

  /* ---------- HOME VIEW ---------- */
  .home-lead{
    font-size:15px;
    margin-bottom:var(--grid);
  }
  .chapter-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(230px,1fr));
    gap:16px;
    margin-bottom:var(--grid);
  }
  .chapter-card{
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:8px;
    padding:14px 16px;
    cursor:pointer;
    transition:transform .1s ease;
  }
  .chapter-card:hover{transform:translateY(-2px); border-color:var(--blue);}
  .chapter-card .num{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--blue);
    letter-spacing:1px;
  }
  .chapter-card h3{
    font-family:'Times New Roman', Times, Georgia, serif;
    font-size:26px;
    margin:2px 0 4px 0;
    color:var(--ink);
  }
  .chapter-card p{
    font-size:13px;
    line-height:20px;
    margin:0 0 8px 0;
    color:var(--ink-soft);
  }
  .chapter-card .meta{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--green);
    font-weight:700;
  }

  /* ---------- CONCEPTS ---------- */
  .chapter-eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    letter-spacing:1.5px;
    color:var(--blue);
    text-transform:uppercase;
  }
  h2.chapter-title{
    font-weight:700;
    font-family:'Times New Roman', Times, Georgia, serif;
    font-size:38px;
    margin:0 0 var(--grid) 0;
    color:var(--ink);
    line-height:1.1;
  }
  h3.section-label{
    font-family:'JetBrains Mono',monospace;
    font-size:12.5px;
    text-transform:uppercase;
    letter-spacing:1px;
    color:var(--ink-soft);
    border-bottom:1.5px dotted var(--line);
    padding-bottom:6px;
    margin:0 0 var(--grid) 0;
  }
  .join-diagrams{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    margin:0 0 var(--grid) 0;
    background:#FAFAFA;
    border:1.5px solid var(--line);
    border-radius:8px;
    padding:14px;
  }
  .join-diagrams svg{overflow:visible;}
  .concept{margin-bottom:var(--grid);}
  .section-divider{
    display:flex;
    align-items:center;
    gap:12px;
    margin:calc(var(--grid) * 1.4) 0 var(--grid) 0;
  }
  .section-divider::before, .section-divider::after{
    content:"";
    flex:1;
    height:2px;
    background:repeating-linear-gradient(90deg, var(--red) 0 6px, transparent 6px 11px);
  }
  .section-divider span{
    font-weight:700;
    font-family:'Times New Roman', Times, Georgia, serif;
    font-size:26px;
    color:var(--red);
    white-space:nowrap;
  }
  .diagram-box{
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:8px;
    padding:14px 10px 6px 10px;
    margin:0 0 var(--grid) 0;
    text-align:center;
    overflow-x:auto;
  }
  .diagram-box svg{max-width:100%; height:auto;}
  .concept h4{
    font-family:'Times New Roman', Times, Georgia, serif;
    font-size:22px;
    color:var(--red);
    margin:0 0 2px 0;
  }
  pre{
    background:#262626;
    color:#E5E5E5;
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    padding:14px 16px;
    border-radius:6px;
    overflow-x:auto;
    line-height:1.5;
    box-shadow:2px 3px 0 var(--line);
    margin:0 0 var(--grid) 0;
  }
  code{font-family:'JetBrains Mono',monospace;}
  .inline-code{background:var(--paper-dark); padding:1px 5px; border-radius:3px; font-size:13.5px;}

  /* ---------- CHALLENGES ---------- */
  .challenge-picker{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:16px;
  }
  .cnum{
    width:26px;height:26px;
    border-radius:50%;
    border:1.5px solid var(--ink-soft);
    background:var(--card);
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    color:var(--ink);
  }
  .cnum.active{border-color:var(--red); border-width:2.5px; font-weight:700;}
  .cnum.done{background:var(--green); border-color:var(--green); color:#fff;}

  .challenge{
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:8px;
    padding:18px 20px;
    margin-top:6px;
    margin-bottom:34px;
    position:relative;
  }
  .challenge::before{
    content:"TASK";
    position:absolute;
    top:-11px; left:16px;
    background:var(--highlight);
    color:#1F1F1F;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    font-weight:700;
    letter-spacing:1px;
    padding:2px 8px;
    border-radius:3px;
    transform:rotate(-2deg);
  }
  .challenge p{font-size:14.5px; margin-bottom:12px;}
  .code-editor{
    position:relative;
    width:100%;
    min-height:150px;
    border:1.5px solid var(--ink-soft);
    border-radius:6px;
    background:#FAFAFA;
    overflow:hidden;
  }
  .code-editor .highlight-layer{
    position:absolute;
    top:0; left:0; right:0; bottom:0;
    margin:0;
    padding:10px 12px;
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    line-height:1.5;
    white-space:pre-wrap;
    word-wrap:break-word;
    tab-size:4;
    -moz-tab-size:4;
    color:var(--ink);
    background:transparent;
    box-shadow:none;
    overflow:hidden;
    pointer-events:none;
  }
  textarea.answer-box{
    position:relative;
    width:100%;
    min-height:150px;
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    line-height:1.5;
    padding:10px 12px;
    border:none;
    background:transparent;
    color:transparent;
    caret-color:var(--ink);
    resize:none;
    white-space:pre-wrap;
    word-wrap:break-word;
    tab-size:4;
    -moz-tab-size:4;
    z-index:2;
  }
  textarea.answer-box:focus{outline:2px solid var(--blue); outline-offset:1px;}
  .tok-kw{color:var(--blue); font-weight:700;}
  .tok-str{color:var(--green);}
  .tok-com{color:#8A8A8A; font-style:italic;}
  .tok-num{color:var(--red);}
  .tok-ann{color:var(--red); font-weight:700;}
  .hint-box{
    margin-top:10px;
    background:#FAFAFA;
    border:1.5px dotted #999999;
    border-radius:6px;
    padding:9px 13px;
    font-size:13px;
    color:var(--ink);
  }
  .hint-label{font-family:'Times New Roman', Times, Georgia, serif; color:#5A5A5A; font-size:17px; margin-right:5px;}
  .completion-banner{
    background:var(--card);
    border:2px dashed var(--green);
    border-radius:8px;
    padding:16px 18px;
    margin-bottom:var(--grid);
    text-align:center;
  }
  .completion-note{font-family:'Times New Roman', Times, Georgia, serif; font-size:20px; color:var(--ink-soft); margin:8px 0 0 0;}
  .progress-line{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--ink-soft);
    margin:-8px 0 var(--grid) 0;
  }
  .proj-steps{display:flex; flex-direction:column; gap:0;}
  .proj-step{
    background:var(--card);
    border:1.5px solid var(--line);
    border-left:5px solid var(--line);
    border-radius:6px;
    padding:14px 18px;
    margin-bottom:16px;
  }
  .capstone-picker{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:var(--grid);
  }
  .capstone-pill{
    font-family:'JetBrains Mono',monospace;
    font-size:12.5px;
    font-weight:700;
    padding:8px 16px;
    border:2px solid var(--line);
    border-radius:20px;
    background:var(--card);
    color:var(--ink-soft);
    cursor:pointer;
  }
  .capstone-pill:hover{border-color:var(--blue); color:var(--blue);}
  .capstone-pill.active{border-color:var(--red); color:var(--red); background:#fff;}
  .proj-step-head{display:flex; align-items:center; gap:10px; margin-bottom:4px;}
  .proj-num{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--ink-soft);
    border:1.3px solid var(--ink-soft);
    border-radius:50%;
    width:20px;height:20px;
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
  }
  .proj-step h4{
    font-family:'Times New Roman', Times, Georgia, serif;
    font-size:22px;
    color:var(--red);
    margin:0;
  }
  .proj-note{
    font-size:13px;
    color:var(--ink-soft);
    background:#FAFAFA;
    border-left:3px solid var(--highlight);
    padding:8px 12px;
    margin-top:6px;
    border-radius:0 4px 4px 0;
  }
  .interview-box{
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:8px;
    padding:16px 20px;
    margin-bottom:var(--grid);
  }
  .interview-hint{
    font-family:'Times New Roman', Times, Georgia, serif;
    font-size:15px;
    color:var(--ink-soft);
    margin:0 0 12px 0;
  }
  .interview-answer-box{
    width:100%;
    min-height:110px;
    font-family:'Times New Roman', Times, Georgia, serif;
    font-size:15px;
    line-height:1.5;
    padding:12px 14px;
    border:1.5px solid var(--ink-soft);
    border-radius:6px;
    background:#FAFAFA;
    color:var(--ink);
    resize:vertical;
  }
  .interview-answer-box:focus{outline:2px solid var(--blue); outline-offset:1px;}
  .mini-project{
    background:#FAFAFA;
    border:1.5px dashed var(--green);
    border-radius:8px;
    padding:16px 20px;
    margin-bottom:var(--grid);
  }
  .journey-box{
    background:var(--card);
    border:2px solid var(--ink);
    border-radius:8px;
    padding:16px 20px;
    margin-bottom:var(--grid);
    position:relative;
  }
  .journey-box::before{
    content:"PAWCONNECT — STEP " attr(data-step) " OF 20";
    position:absolute;
    top:-11px; left:16px;
    background:var(--ink);
    color:#fff;
    font-family:'Times New Roman', Times, Georgia, serif;
    font-size:11px;
    font-weight:700;
    letter-spacing:1px;
    padding:2px 10px;
    border-radius:3px;
  }
  .journey-box h4{
    font-family:'Times New Roman', Times, Georgia, serif;
    font-size:24px;
    color:var(--ink);
    margin:8px 0 4px 0;
  }
  .journey-note{
    font-size:13px;
    color:var(--ink-soft);
    background:var(--paper-dark);
    border-left:3px solid var(--ink);
    padding:8px 12px;
    margin-top:8px;
    border-radius:0 4px 4px 0;
  }
  .journey-link{
    display:block;
    text-align:center;
    font-family:'Times New Roman', Times, Georgia, serif;
    font-size:15px;
    color:var(--ink);
    text-decoration:underline;
    cursor:pointer;
    padding:10px;
    margin-top:6px;
  }
  .mini-project h4{
    font-family:'Times New Roman', Times, Georgia, serif;
    font-size:24px;
    color:var(--green);
    margin:0 0 4px 0;
  }
  .proj-reqs{
    margin:10px 0 0 0;
    padding-left:20px;
    font-size:14px;
    line-height:22px;
  }
  .proj-reqs li{margin-bottom:4px;}
  .links-list{
    list-style:none;
    padding:0;
    margin:0 0 var(--grid) 0;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .links-list li{
    background:var(--card);
    border:1.3px solid var(--line);
    border-radius:5px;
    padding:8px 12px;
  }
  .links-list a{
    color:var(--blue);
    font-size:13px;
    text-decoration:none;
    font-family:'JetBrains Mono',monospace;
  }
  .links-list a::before{content:"↗ "; opacity:0.6;}
  .links-list a:hover{text-decoration:underline;}

  .board-section{
    background:#FAFAFA;
    border:1.5px solid var(--line);
    border-radius:8px;
    padding:16px 16px 18px 16px;
    margin:0 0 var(--grid) 0;
  }
  .board-wrap{
    display:flex;
    gap:12px;
    overflow-x:auto;
    padding-bottom:4px;
  }
  .board-col{
    flex:1 1 160px;
    min-width:160px;
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:6px;
    padding:8px;
  }
  .board-col-head{
    font-family:'JetBrains Mono',monospace;
    font-size:11.5px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.5px;
    color:var(--ink-soft);
    border-bottom:1.5px dashed var(--line);
    padding-bottom:6px;
    margin-bottom:8px;
    display:flex;
    justify-content:space-between;
  }
  .board-count{color:var(--blue);}
  .board-col-body{display:flex; flex-direction:column; gap:7px; min-height:40px;}
  .board-card{
    background:#fff;
    border:1.3px solid var(--line);
    border-left:4px solid var(--highlight);
    border-radius:4px;
    padding:7px 8px;
    font-size:12.5px;
  }
  .board-card-text{display:block; margin-bottom:5px; line-height:16px; word-break:break-word;}
  .board-card-actions{display:flex; gap:4px;}
  .board-btn{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    border:1.3px solid var(--ink-soft);
    background:#fff;
    border-radius:3px;
    padding:2px 6px;
    cursor:pointer;
    color:var(--ink);
  }
  .board-btn:hover{background:var(--paper-dark);}
  .board-btn:disabled{opacity:0.3; cursor:not-allowed;}
  .board-btn.board-del{border-color:var(--red); color:var(--red); margin-left:auto;}
  .board-empty{font-size:11.5px; color:var(--ink-soft); font-style:italic; padding:6px 2px;}
  .board-add{
    display:flex;
    gap:8px;
    margin-top:12px;
    flex-wrap:wrap;
  }
  .board-add input{
    flex:1 1 200px;
    font-family:'JetBrains Mono',monospace;
    font-size:12.5px;
    padding:7px 10px;
    border:1.5px solid var(--line);
    border-radius:5px;
    background:#fff;
    color:var(--ink);
  }
  .board-add button{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    font-weight:700;
    border:2px solid var(--green);
    color:var(--green);
    background:#fff;
    border-radius:4px;
    padding:7px 14px;
    cursor:pointer;
  }
  .board-add button:hover{background:var(--green); color:#fff;}
  #boardResetBtn{
    border:1.3px dashed var(--ink-soft) !important;
    color:var(--ink-soft) !important;
    background:none !important;
    font-weight:400 !important;
    text-decoration:none;
  }
  #boardResetBtn:hover{border-color:var(--red) !important; color:var(--red) !important; background:none !important;}
  .challenge-controls{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:10px;
    flex-wrap:wrap;
    gap:10px;
  }
  .check-btn{
    font-family:'JetBrains Mono',monospace;
    font-size:12.5px;
    font-weight:700;
    letter-spacing:0.5px;
    background:#fff;
    border:2px solid var(--red);
    color:var(--red);
    padding:8px 16px;
    border-radius:4px;
    cursor:pointer;
    text-transform:uppercase;
  }
  .check-btn:hover{background:var(--red); color:#fff;}
  .check-btn:disabled{opacity:.45; cursor:not-allowed; border-color:var(--ink-soft); color:var(--ink-soft);}
  .check-btn:disabled:hover{background:none;}
  .attempts{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-soft);}
  .attempts.low{color:var(--red); font-weight:700;}

  .checklist{margin-top:12px; font-family:'JetBrains Mono',monospace; font-size:12.5px; list-style:none; padding:0;}
  .checklist li{padding:3px 0 3px 22px; position:relative;}
  .checklist li.pass{color:var(--green);}
  .checklist li.fail{color:var(--red);}
  .checklist li.pass::before{content:"✓"; position:absolute; left:0; font-weight:700;}
  .checklist li.fail::before{content:"✗"; position:absolute; left:0; font-weight:700;}

  .stamp{
    display:inline-block;
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    font-size:14px;
    letter-spacing:2px;
    padding:6px 14px;
    border:3px solid;
    border-radius:6px;
    margin-top:12px;
    transform:rotate(-4deg);
    text-transform:uppercase;
  }
  .stamp.good{color:var(--green); border-color:var(--green); background:rgba(62,113,80,0.08);}
  .stamp.bad{color:var(--red); border-color:var(--red); background:rgba(178,58,46,0.08);}

  .reveal{

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ============================================================
   TINY SYNTAX HIGHLIGHTER — covers Java, SQL, YAML/Gherkin-ish text
   ============================================================ */
const HL_KEYWORDS = new Set([
  'class','extends','implements','public','private','protected','static','void','new','return',
  'if','else','for','while','try','catch','finally','throws','throw','import','interface','abstract',
  'final','synchronized','volatile','transient','this','true','false','null','int','long','double',
  'float','boolean','String','package','instanceof',
  'SELECT','FROM','WHERE','INSERT','INTO','VALUES','UPDATE','SET','DELETE','CREATE','TABLE','ALTER',
  'DROP','JOIN','LEFT','RIGHT','INNER','OUTER','FULL','ON','GROUP','BY','HAVING','ORDER','LIMIT',
  'UNION','DISTINCT','AS','AND','OR','NOT','NULL','PRIMARY','KEY','FOREIGN','REFERENCES','CHECK',
  'DEFAULT','UNIQUE','VIEW','BEGIN','COMMIT','DESC','ASC','LIKE','IN','BETWEEN','IS',
  'Given','When','Then','And','But','Feature','Scenario','Background',
  'on','push','branches','env','jobs','stages','run','FROM','COPY','WORKDIR','EXPOSE','ENTRYPOINT','CMD','ENV'
]);
const HL_TOKEN_RE = /(\/\/.*|--.*|#.*)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|(@[A-Za-z_]\w*)|(\b\d+(?:\.\d+)?\b)|(\b[A-Za-z_]\w*\b)/g;

function highlightCode(code){
  let out = '';
  let last = 0;
  let m;
  HL_TOKEN_RE.lastIndex = 0;
  while((m = HL_TOKEN_RE.exec(code))){
    out += esc(code.slice(last, m.index));
    if(m[1]) out += '<span class="tok-com">'+esc(m[1])+'</span>';
    else if(m[2]) out += '<span class="tok-str">'+esc(m[2])+'</span>';
    else if(m[3]) out += '<span class="tok-ann">'+esc(m[3])+'</span>';
    else if(m[4]) out += '<span class="tok-num">'+esc(m[4])+'</span>';
    else if(m[5]){
      const w = m[5];
      out += HL_KEYWORDS.has(w) ? '<span class="tok-kw">'+esc(w)+'</span>' : esc(w);
    }
    last = HL_TOKEN_RE.lastIndex;
  }
  out += esc(code.slice(last));
  return out + '\n';
}

{ id:'threads', tab:'Threads', title:'Threads', blurb:'Getting more than one piece of work running at the same time.',
  links:[
    {label:'Oracle — Concurrency (official tutorial)', url:'https://docs.oracle.com/javase/tutorial/essential/concurrency/'},
    {label:'Java SE 17 — Thread (official API docs)', url:'https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/lang/Thread.html'}
  ],
  concepts:[
    {name:'What a thread actually is', explain:'Every Java program already runs on one thread by default. A thread is simply an independent path of execution — a second (or third) line of work your program can carry out alongside the first, instead of finishing one thing before starting the next.', code:'System.out.println("This runs on the main thread already.");'},
    {name:'start() vs run()', explain:'Calling run() directly just runs that code like any normal method, right where you are — no new thread gets created. Calling start() is what actually asks Java to open a new path of execution and run it there.', code:'Thread t = new Thread(() -> System.out.println("On a new thread"));\nt.start();'},
    {name:'Waiting for another thread to finish', explain:"Sometimes your main code needs a thread's result before continuing. join() pauses the calling thread until the other one is completely done.", code:'t.start();\nt.join();\nSystem.out.println("t is definitely finished now");'},
    {name:'Thread lifecycle', explain:'A thread moves through states as it runs: NEW (created but not started), RUNNABLE (running or ready to run), BLOCKED or WAITING (paused, waiting on a lock or condition), and TERMINATED (finished). Think of it like a job application moving from applied, to hired, to on the job, to done.', code:'// NEW -> RUNNABLE -> (BLOCKED / WAITING) -> TERMINATED'},
    {name:'Concurrency vs parallelism', explain:'Concurrency means juggling multiple tasks, making progress on more than one without necessarily running at the exact same instant. Parallelism means actually running tasks at the same instant, usually on multiple CPU cores. Threads give you concurrency; how much real parallelism you get depends on the hardware.', code:'// concurrency: switching between tasks quickly\n// parallelism: tasks literally running at once, on different cores'},
    {name:'Thread pools (ExecutorService)', explain:'Creating a brand new Thread for every little task is wasteful. A thread pool keeps a fixed set of reusable worker threads on standby and hands them tasks as they come in, which is how most real applications manage threads instead of using raw Thread objects everywhere.', code:'ExecutorService pool = Executors.newFixedThreadPool(4);\npool.submit(() -> System.out.println("task running"));'},
    {name:'A common pitfall: deadlock', explain:'A deadlock happens when two threads each hold something the other needs, and both wait forever — like two people each refusing to hand over their half of a pair of scissors until they get the other half first. The synchronized chapter covers this in more depth.', code:'// Thread A holds lock 1, waiting for lock 2\n// Thread B holds lock 2, waiting for lock 1 — neither ever proceeds'},
    {name:'Callable and Future', explain:"A Runnable can't return a result or throw a checked exception. Callable can — you submit it to an ExecutorService and get back a Future, which is like a claim ticket you can later call .get() on to collect the actual result once it's ready.", code:'Future<Integer> future = pool.submit(() -> 2 + 2);\nint result = future.get(); // waits for the result if not ready yet'},
    {name:'Interrupting a thread', explain:"You can't force-kill a thread directly, but you can politely ask it to stop with interrupt(). It's then up to that thread's code to notice the interruption (often via an InterruptedException) and actually wind down.", code:'worker.interrupt();\n// inside the thread: catch (InterruptedException e) { /* stop cleanly */ }'},
    {name:'Thread-safe collections', explain:'Regular collections like ArrayList and HashMap are not safe to share across threads without extra locking. java.util.concurrent provides ready-made thread-safe alternatives, like ConcurrentHashMap, that handle the locking internally.', code:'Map<String,Integer> scores = new ConcurrentHashMap<>();\nscores.put("Milo", 10); // safe even with multiple threads writing'},
    {name:'Naming, checking, and daemon threads', explain:'A few small but genuinely useful Thread methods: setName()/getName() label a thread so it is easier to identify in logs or a debugger; isAlive() tells you whether a thread has finished running yet; setDaemon(true), called BEFORE start(), marks a thread as background work that should not stop the whole program from exiting — the JVM kills daemon threads automatically once every non-daemon thread is done.', code:'Thread t = new Thread(() -> System.out.println("working"));\nt.setName("Worker-1");\nt.setDaemon(true);   // must be called before start()\nt.start();\n\nSystem.out.println(t.getName());  // "Worker-1"\nSystem.out.println(t.isAlive());  // true while it is still running'}
  ],

  journey:{step:3, title:'PawConnect, Step 3 — a background monitor thread', blurb:'PawConnect gets its first background task: an IntakeMonitor that quietly watches the shelter\'s dog count while the rest of the program keeps running — a real use of start(), run(), and a daemon thread, not a toy example.',
    code:'package pawconnect;\n\npublic class IntakeMonitor extends Thread {\n    private final DogStore store;\n\n    public IntakeMonitor(DogStore store) {\n        this.store = store;\n        setDaemon(true); // don\'t let this thread keep the whole program alive on its own\n    }\n\n    @Override\n    public void run() {\n        while (true) {\n            System.out.println("[monitor] Dogs currently in shelter: " + store.getAll().size());\n            try {\n                Thread.sleep(5000);\n            } catch (InterruptedException e) {\n                break;\n            }\n        }\n    }\n}',
    note:'Started with new IntakeMonitor(store).start() alongside whatever else PawConnect is doing — a second, independent path of execution, exactly like this chapter\'s start()/run() concept, now doing a real job.'},
  challenges:[
    {p:'Create a class called <span class="inline-code">Greeter</span> that extends <span class="inline-code">Thread</span>. Inside run(), print "Hello Thread". Then create one and start it.',
     checks:[{l:'Class Greeter extends Thread', t:/class\s+Greeter\s+extends\s+Thread/i},{l:'Has a run() method', t:/public\s+void\s+run\s*\(\s*\)/i},{l:'Prints "Hello Thread"', t:/hello thread/i},{l:'Calls .start()', t:/\.start\s*\(\s*\)/i}],
     s:'class Greeter extends Thread {\n    public void run() {\n        System.out.println("Hello Thread");\n    }\n}\n\nGreeter g = new Greeter();\ng.start();',
     m:['Calling g.run() instead of g.start() — it will print the message, but not on a separate thread.','Forgetting "extends Thread" — without it Java has no idea this class is special.']},
    {p:'Do the same thing but with <span class="inline-code">Runnable</span> instead of extending Thread. Print "Hello Runnable".',
     checks:[{l:'Implements Runnable', t:/implements\s+Runnable/i},{l:'Has a run() method', t:/public\s+void\s+run\s*\(\s*\)/i},{l:'Prints "Hello Runnable"', t:/hello runnable/i},{l:'Wraps it in a Thread and starts it', t:/new\s+Thread\s*\([^)]*\)[\s\S]*\.start\s*\(\s*\)/i}],
     s:'class Greeter implements Runnable {\n    public void run() {\n        System.out.println("Hello Runnable");\n    }\n}\n\nThread t = new Thread(new Greeter());\nt.start();',
     m:["A Runnable has no start() method of its own — it has to be wrapped in a Thread first.","Forgetting to pass the Runnable into the Thread constructor."]},
    {p:'Create and start two separate thread objects, one after another, inside main().',
     checks:[{l:'Two .start() calls', t:c=>((c.match(/\.start\s*\(\s*\)/g)||[]).length>=2)},{l:'Two separate "new" objects created', t:c=>((c.match(/new\s+Thread/g)||[]).length>=2) || /new\s+\w+\(\)[\s\S]*new\s+\w+\(\)/.test(c)}],
     s:'Thread a = new Thread(() -> System.out.println("A"));\nThread b = new Thread(() -> System.out.println("B"));\na.start();\nb.start();',
     m:['Calling .start() twice on the SAME thread object throws an IllegalThreadStateException — each thread can only ever be started once.','Reusing one variable for both instead of creating two separate objects.']},
    {p:'Inside run(), pause for one second with <span class="inline-code">Thread.sleep(1000)</span> before printing "Done sleeping". Handle the exception sleep() can throw.',
     checks:[{l:'Calls Thread.sleep(1000)', t:/Thread\.sleep\s*\(\s*1000\s*\)/i},{l:'Has a try/catch or throws', t:/try\s*\{|throws\s+InterruptedException/i},{l:'Prints "Done sleeping"', t:/done sleeping/i}],
     s:'public void run() {\n    try {\n        Thread.sleep(1000);\n        System.out.println("Done sleeping");\n    } catch (InterruptedException e) {\n        e.printStackTrace();\n    }\n}',
     m:['sleep() can throw InterruptedException — it has to be caught or declared with throws, or the code will not compile.','1000 is milliseconds, not seconds — 1000ms is correct for one second, but it is easy to misjudge.']},
    {p:'Give a thread a custom name with <span class="inline-code">setName("Worker")</span>, then print it back with <span class="inline-code">getName()</span>.',
     checks:[{l:'Calls setName("Worker")', t:/setName\s*\(\s*"Worker"\s*\)/i},{l:'Calls getName()', t:/getName\s*\(\s*\)/i}],
     s:'Thread t = new Thread();\nt.setName("Worker");\nSystem.out.println(t.getName());',
     m:['Printing getName() before calling setName() — the name has to be set first.','Assuming a thread has no name until you give it one — it actually gets a default like "Thread-0" automatically.']},
    {p:'Use <span class="inline-code">join()</span> so main() completely waits for your thread to finish before moving on.',
     checks:[{l:'Calls .start()', t:/\.start\s*\(\s*\)/i},{l:'Calls .join()', t:/\.join\s*\(\s*\)/i}],
     s:'Thread t = new Thread(() -> System.out.println("working"));\nt.start();\nt.join();\nSystem.out.println("t is done");',
     m:['Calling join() before start() — you would be waiting on a thread that has not even begun.','join() can also throw InterruptedException — worth wrapping in a try/catch in real code.']},
    {p:'Check whether a thread is still running with <span class="inline-code">isAlive()</span> and print the result.',
     checks:[{l:'Calls isAlive()', t:/isAlive\s*\(\s*\)/i},{l:'Prints something', t:/System\.out\.print/i}],
     s:'Thread t = new Thread(() -> System.out.println("hi"));\nt.start();\nSystem.out.println(t.isAlive());',
     m:['Checking isAlive() immediately after start() and assuming it is always true — a fast thread may already be finished.','Checking isAlive() before start() — it will always be false there.']},
    {p:'Set a thread\'s priority to the maximum with <span class="inline-code">setPriority(Thread.MAX_PRIORITY)</span>.',
     checks:[{l:'Calls setPriority(Thread.MAX_PRIORITY)', t:/setPriority\s*\(\s*Thread\.MAX_PRIORITY\s*\)/i}],
     s:'Thread t = new Thread(() -> System.out.println("important work"));\nt.setPriority(Thread.MAX_PRIORITY);\nt.start();',
     m:['Assuming higher priority guarantees it runs first — it is only a hint to the scheduler, not a promise.','Setting priority after the thread has already finished running has no effect.']},
    {p:'Create a thread using a lambda instead of a full Runnable class, and start it.',
     checks:[{l:'Uses new Thread(() -> ...)', t:/new\s+Thread\s*\(\s*\(\s*\)\s*->/i},{l:'Calls .start()', t:/\.start\s*\(\s*\)/i}],
     s:'Thread t = new Thread(() -> System.out.println("lambda thread"));\nt.start();',
     m:['Forgetting the empty () before -> for a Runnable that takes no arguments.','Forgetting .start() entirely — a lambda by itself never runs on its own thread.']},
    {p:'Make a thread a daemon thread with <span class="inline-code">setDaemon(true)</span> before starting it.',
     checks:[{l:'Calls setDaemon(true)', t:/setDaemon\s*\(\s*true\s*\)/i},{l:'Calls .start()', t:/\.start\s*\(\s*\)/i}],
     s:'Thread t = new Thread(() -> System.out.println("background work"));\nt.setDaemon(true);\nt.start();',
     m:['Calling setDaemon(true) AFTER start() throws an IllegalThreadStateException — it has to be set before the thread starts.','Forgetting daemon threads get killed automatically when the main program exits — not suitable for work that must finish.']},
    {p:'Create one shared Runnable, then use it to build and start two separate Thread objects — proving the same Runnable can back more than one thread.',
     checks:[{l:'One Runnable variable created', t:/Runnable\s+\w+\s*=/i},{l:'Two Thread objects using it', t:c=>((c.match(/new\s+Thread\s*\(\s*\w+\s*\)/g)||[]).length>=2)},{l:'Both started', t:c=>((c.match(/\.start\s*\(\s*\)/g)||[]).length>=2)}],
     s:'Runnable task = () -> System.out.println("running from: " + Thread.currentThread().getName());\nThread t1 = new Thread(task);\nThread t2 = new Thread(task);\nt1.start();\nt2.start();',
     m:['Creating a new Runnable for each thread instead of reusing one — that misses the point that one Runnable can be shared.','Assuming the two threads share state just because they share a Runnable — they only share the CODE, not automatically any data inside it.']},
    {p:'Submit a task to an ExecutorService using <span class="inline-code">Callable</span>, then retrieve its result with <span class="inline-code">Future.get()</span>.',
     checks:[{l:'Uses Callable', t:/Callable/i},{l:'submit(', t:/\.submit\s*\(/i},{l:'Uses Future', t:/Future/i},{l:'Calls .get()', t:/\.get\s*\(\s*\)/i}],
     s:'ExecutorService pool = Executors.newFixedThreadPool(2);\nCallable<Integer> task = () -> 2 + 2;\nFuture<Integer> future = pool.submit(task);\nint result = future.get();\nSystem.out.println(result);',
     m:['Using Runnable instead of Callable when you actually need a return value — Runnable cannot return anything.','Forgetting future.get() can throw checked exceptions (InterruptedException, ExecutionException) that need handling.']},
    {p:'Create a fixed thread pool of 3 workers, submit 3 tasks to it, then shut it down properly.',
     checks:[{l:'newFixedThreadPool(3)', t:/newFixedThreadPool\s*\(\s*3\s*\)/i},{l:'At least one submit(', t:/\.submit\s*\(/i},{l:'Calls shutdown()', t:/\.shutdown\s*\(\s*\)/i}],
     s:'ExecutorService pool = Executors.newFixedThreadPool(3);\npool.submit(() -> System.out.println("task 1"));\npool.submit(() -> System.out.println("task 2"));\npool.submit(() -> System.out.println("task 3"));\npool.shutdown();',
     m:['Forgetting shutdown() — without it, the pool\'s threads can keep the program running indefinitely instead of exiting.','Calling shutdown() before submitting all the tasks you actually need done.']},
    {p:'Write a Runnable (as a lambda) that loops while sleeping, and stops cleanly when it catches an InterruptedException instead of letting the exception crash it.',
     checks:[{l:'Has a loop', t:/\b(while|for)\s*\(/i},{l:'Calls Thread.sleep', t:/Thread\.sleep/i},{l:'Catches InterruptedException', t:/catch\s*\(\s*InterruptedException/i}],
     s:'Runnable task = () -> {\n    while (true) {\n        try {\n            Thread.sleep(500);\n        } catch (InterruptedException e) {\n            System.out.println("stopped cleanly");\n            return;\n        }\n    }\n};',
     m:['Catching the exception but forgetting to actually exit the loop (missing return or break) — the loop just keeps going as if nothing happened.','Swallowing the exception with an empty catch block, silently hiding the interruption instead of responding to it.']},
    {p:'Start a thread, let main sleep briefly, then call <span class="inline-code">.interrupt()</span> on that thread from main.',
     checks:[{l:'Starts a thread', t:/\.start\s*\(\s*\)/i},{l:'main sleeps before interrupting', t:/Thread\.sleep/i},{l:'Calls .interrupt()', t:/\.interrupt\s*\(\s*\)/i}],
     s:'Thread worker = new Thread(() -> {\n    try { Thread.sleep(5000); } catch (InterruptedException e) { System.out.println("interrupted!"); }\n});\nworker.start();\nThread.sleep(1000);\nworker.interrupt();',
     m:['Calling interrupt() before the thread has even started — nothing is running yet to interrupt.','Assuming interrupt() forcibly stops the thread immediately — it only requests that the thread notice and respond, it does not stop anything by itself.']},
    {p:'Create a ConcurrentHashMap shared by two threads, each putting a different key into it.',
     checks:[{l:'Uses ConcurrentHashMap', t:/ConcurrentHashMap/i},{l:'Two threads', t:c=>((c.match(/new\s+Thread/g)||[]).length>=2)},{l:'At least one .put(', t:/\.put\s*\(/i}],
     s:'Map<String,Integer> scores = new ConcurrentHashMap<>();\nThread t1 = new Thread(() -> scores.put("Milo", 10));\nThread t2 = new Thread(() -> scores.put("Bella", 8));\nt1.start();\nt2.start();',
     m:['Using a plain HashMap instead — it is not safe to write to from multiple threads at once and can silently corrupt itself.','Forgetting to actually start both threads, leaving the map only partially filled.']},

{ id:'sync', tab:'synchronized', title:'The synchronized keyword', blurb:'Keeping two threads from corrupting the same piece of data.',
  links:[
    {label:'Oracle — Synchronization (official tutorial)', url:'https://docs.oracle.com/javase/tutorial/essential/concurrency/sync.html'},
    {label:'Java SE 17 — java.util.concurrent.atomic package', url:'https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/util/concurrent/atomic/package-summary.html'}
  ],
  concepts:[
    {name:'Why shared data is dangerous', explain:'When two threads read and write the same variable at the same time, their steps can interleave in an unpredictable order, and updates can silently get lost. This is called a race condition.', code:'balance = balance + 10; // unsafe if two threads run this at once'},
    {name:'Locking with synchronized', explain:'Marking a method or block synchronized means only one thread can be inside it at a time — everyone else waits their turn, like a single key to a shared room.', code:'public synchronized void deposit(int amount) {\n    balance += amount;\n}'},
    {name:'Locking on a specific object', explain:'synchronized(this) locks on the whole object. You can also lock on a separate, dedicated lock object, so unrelated methods are not forced to wait on each other unnecessarily.', code:'private final Object lock = new Object();\nsynchronized(lock) { balance += amount; }'},
    {name:'Deadlock', explain:'A deadlock happens when two threads each hold a lock the other one needs, and both wait forever for the other to let go — nothing moves, and the program just hangs.', code:'// Thread 1: synchronized(lockA){ synchronized(lockB){ ... } }\n// Thread 2: synchronized(lockB){ synchronized(lockA){ ... } } // danger!'},
    {name:'The volatile keyword', explain:"Threads can each keep their own cached copy of a variable for speed, which means one thread's change might not be immediately visible to another. Marking a variable volatile forces every read and write to go straight to main memory, so all threads always see the latest value.", code:'private volatile boolean running = true;'},
    {name:'Atomic classes', explain:'For simple things like counters, java.util.concurrent.atomic classes (like AtomicInteger) give you thread-safety without needing synchronized at all — they use lower-level tricks to update values safely in one uninterruptible step.', code:'AtomicInteger counter = new AtomicInteger(0);\ncounter.incrementAndGet();'},
    {name:'Coordinating with wait() and notify()', explain:'Sometimes a thread needs to pause until some condition becomes true, and another thread needs to wake it up once it does. wait() pauses the current thread; notify() wakes one waiting thread back up. Both only work inside a synchronized block.', code:'synchronized(lock) {\n    while (!ready) { lock.wait(); }\n}'},
    {name:'ReentrantLock, a more flexible lock', explain:"synchronized is simple but rigid. ReentrantLock does the same core job — only one thread inside at a time — but adds extras like tryLock() (give up instead of waiting forever) and requires you to explicitly call unlock(), usually in a finally block so it always releases.", code:'lock.lock();\ntry {\n    balance += amount;\n} finally {\n    lock.unlock();\n}'},
    {name:'Semaphore', explain:'Where a lock allows exactly one thread in at a time, a Semaphore allows up to N threads in at once — useful for things like limiting how many threads can hit a database connection pool simultaneously.', code:'Semaphore permits = new Semaphore(3); // only 3 threads at a time\npermits.acquire();\ntry { /* work */ } finally { permits.release(); }'},
    {name:'CountDownLatch', explain:'A CountDownLatch lets one or more threads wait until a set number of other threads have finished some work — like waiting for three chefs to each finish their dish before the waiter brings the whole meal out together.', code:'CountDownLatch latch = new CountDownLatch(3);\n// each worker calls latch.countDown() when done\nlatch.await(); // blocks until the count reaches 0'}
  ],
  interview:[
    {level:'Beginner', q:'What is a race condition?'},
    {level:'Beginner', q:'What does the synchronized keyword actually do?'},
    {level:'Beginner', q:'Why can two threads reading the same variable at the same time still cause bugs?'},
    {level:'Intermediate', q:'What is the difference between synchronizing a whole method and synchronizing a block?'},
    {level:'Intermediate', q:'What is a deadlock, and how can it happen with two locks?'},
    {level:'Intermediate', q:'What does volatile do, and how is it different from synchronized?'},
    {level:'Intermediate', q:'When would you reach for an AtomicInteger instead of synchronized?'}
  ],
  journey:{step:4, title:'PawConnect, Step 4 — making DogStore thread-safe', blurb:'Now that IntakeMonitor runs on its own thread while the main program keeps adding dogs, two threads genuinely touch the same dog list at once — exactly the race condition this chapter warns about. The fix is the same synchronized keyword from the notes above.',
    code:'// DogStore.java, updated\npublic synchronized void add(Dog dog) {\n    dogs.add(dog);\n    byId.put(dog.getId(), dog);\n}\n\npublic synchronized List<Dog> getAll() {\n    return new ArrayList<>(dogs);\n}',
    note:'Without synchronized here, IntakeMonitor reading the list at the exact moment the main thread is adding to it could see a half-updated, corrupted view — a bug that would show up rarely and be maddening to reproduce, exactly as this chapter\'s notes describe.'},
  challenges:[
    {p:'Write a class <span class="inline-code">PiggyBank</span> with an <span class="inline-code">int balance</span> field and a synchronized <span class="inline-code">deposit</span> method that adds an amount to it.',
     checks:[{l:'Class PiggyBank', t:/class\s+PiggyBank/i},{l:'Uses synchronized', t:/synchronized/i},{l:'Has deposit(...) method', t:/void\s+deposit\s*\(/i},{l:'Updates balance', t:/balance\s*\+=|balance\s*=\s*balance\s*\+/i}],
     s:'class PiggyBank {\n    int balance = 0;\n    public synchronized void deposit(int amount) {\n        balance += amount;\n    }\n}',
     m:['Writing the method but forgetting the word synchronized in front of it.','Never actually changing balance — accepting the amount but not adding it.']},
    {p:'Rewrite <span class="inline-code">withdraw()</span> using a synchronized BLOCK around just the balance change, instead of synchronizing the whole method.',
     checks:[{l:'Uses synchronized(...) block', t:/synchronized\s*\(/i},{l:'Subtracts from balance', t:/balance\s*-=|balance\s*=\s*balance\s*-/i}],
     s:'public void withdraw(int amount) {\n    synchronized(this) {\n        balance -= amount;\n    }\n}',
     m:['Synchronizing on the wrong object — it needs to be the same lock every other synchronized code touching balance uses.','Leaving unrelated, slow code inside the block, which forces other threads to wait longer than necessary.']},
    {p:'Add a synchronized <span class="inline-code">withdraw()</span> method to PiggyBank that subtracts an amount from balance.',
     checks:[{l:'synchronized withdraw method', t:/synchronized\s+void\s+withdraw\s*\(/i},{l:'Subtracts from balance', t:/balance\s*-=|balance\s*=\s*balance\s*-/i}],
     s:'public synchronized void withdraw(int amount) {\n    balance -= amount;\n}',
     m:['Forgetting synchronized — deposit and withdraw both need it, or one can still corrupt the other.','Allowing balance to go negative without any check — not a compile error, but a real-world bug.']},
    {p:'Make a static synchronized method that increments a shared static counter across every instance.',
     checks:[{l:'static synchronized method', t:/static\s+synchronized/i},{l:'Has a static counter field', t:/static\s+int\s+\w+/i},{l:'Increments it', t:/\+\+|\+=\s*1/i}],
     s:'class Counter {\n    static int count = 0;\n    public static synchronized void increment() {\n        count++;\n    }\n}',
     m:['Using an instance-level synchronized method for something that is actually shared across ALL instances via a static field — that does not protect it.','Forgetting static on the counter field itself.']},
    {p:'Create a private final <span class="inline-code">Object lock</span> field, and use <span class="inline-code">synchronized(lock)</span> instead of synchronizing on the whole object.',
     checks:[{l:'Has a lock field', t:/Object\s+lock\s*=\s*new\s+Object\s*\(\s*\)/i},{l:'Uses synchronized(lock)', t:/synchronized\s*\(\s*lock\s*\)/i}],
     s:'private final Object lock = new Object();\n\npublic void deposit(int amount) {\n    synchronized(lock) {\n        balance += amount;\n    }\n}',
     m:['Making the lock field public or non-final — other code could then swap it out or lock on the wrong thing.','Using a different lock object in different methods that are supposed to protect the same data.']},
    {p:'Here is a buggy counter: <span class="inline-code">void increment(){ count++; }</span> — rewrite it with synchronized added so it is safe across threads.',
     checks:[{l:'Uses synchronized', t:/synchronized/i},{l:'increment method present', t:/void\s+increment\s*\(/i},{l:'Still increments count', t:/count\s*\+\+|count\s*\+=\s*1/i}],
     s:'public synchronized void increment() {\n    count++;\n}',
     m:['count++ looks like one step, but it is actually read-then-write — two threads can both read the old value before either writes back.','Adding synchronized to only one of several methods that touch count, leaving the others unprotected.']},
    {p:'Inside a synchronized method, call <span class="inline-code">wait()</span> to pause the current thread until it is notified.',
     checks:[{l:'Uses synchronized', t:/synchronized/i},{l:'Calls wait()', t:/\.wait\s*\(\s*\)|(?<!\.)\bwait\s*\(\s*\)/i}],
     s:'public synchronized void waitForFunds() throws InterruptedException {\n    while (balance == 0) {\n        wait();\n    }\n}',
     m:['Calling wait() outside a synchronized block — Java throws an IllegalMonitorStateException.','Using if instead of while to re-check the condition after waking up — the condition can change again before you actually get to run.']},
    {p:'Add synchronized to a <span class="inline-code">getBalance()</span> method too, since even reading shared data during a write can be unsafe.',
     checks:[{l:'synchronized getBalance method', t:/synchronized[\s\S]{0,20}getBalance\s*\(/i},{l:'Returns balance', t:/return\s+balance/i}],
     s:'public synchronized int getBalance() {\n    return balance;\n}',
     m:['Assuming reads are always safe — a read can catch balance mid-update if the write is not finished, giving a half-correct value.','Synchronizing the write but leaving the read unprotected, which defeats the point.']},
    {p:'Write two methods, deposit and withdraw, both synchronized, so only one of either can run at a time on the same object.',
     checks:[{l:'Two synchronized methods', t:c=>((c.match(/synchronized/gi)||[]).length>=2)},{l:'deposit present', t:/void\s+deposit\s*\(/i},{l:'withdraw present', t:/void\s+withdraw\s*\(/i}],
     s:'public synchronized void deposit(int amount) { balance += amount; }\npublic synchronized void withdraw(int amount) { balance -= amount; }',
     m:['Synchronizing only one of the two methods — the unprotected one can still run at the same time as the protected one.','Forgetting both methods on the same object share the same intrinsic lock automatically — no extra setup needed.']},
    {p:'Use <span class="inline-code">AtomicInteger</span> instead of synchronized to safely increment a shared counter.',
     checks:[{l:'Uses AtomicInteger', t:/AtomicInteger/i},{l:'Calls incrementAndGet()', t:/incrementAndGet\s*\(\s*\)/i}],
     s:'import java.util.concurrent.atomic.AtomicInteger;\n\nAtomicInteger count = new AtomicInteger(0);\ncount.incrementAndGet();',
     m:['Using plain count++ on an AtomicInteger by mistake — the whole point is to use its built-in thread-safe methods instead.','Forgetting the import for java.util.concurrent.atomic.AtomicInteger.']}
  ]
},

{ id:'sockets', tab:'Sockets', title:'Networking & Sockets', blurb:'How two programs on different computers actually talk.',
  links:[
    {label:'Oracle — All About Sockets (official tutorial)', url:'https://docs.oracle.com/javase/tutorial/networking/sockets/'},
    {label:'Java SE 17 — Socket (official API docs)', url:'https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/net/Socket.html'}
  ],
  concepts:[
    {name:'Client and server roles', explain:'A ServerSocket sits and waits for a connection to come in; a Socket is what a client uses to dial in. Once connected, both ends end up holding a Socket object they can send and receive through.', code:'ServerSocket server = new ServerSocket(5000);'},
    {name:'Reading and writing over a socket', explain:'Once connected, both sides get streams — an output stream to send text out, and an input stream to read what comes back — usually wrapped in something friendlier like PrintWriter and BufferedReader.', code:'PrintWriter out = new PrintWriter(socket.getOutputStream(), true);\nout.println("hello");'},
    {name:'Closing the connection', explain:'Sockets hold onto real system resources, so they need to be closed when you are done with them — either manually with close(), or automatically using try-with-resources.', code:'try (Socket socket = new Socket("localhost", 5000)) {\n    // use it here\n}'},
    {name:'The TCP handshake', explain:"Before accept() actually returns a connected client, TCP quietly runs a three-step handshake behind the scenes: the client sends a SYN (\"can we talk?\"), the server replies SYN-ACK (\"sure, can you hear me?\"), the client replies ACK (\"yes, let's go\"). Only then is the connection officially open.", code:'// SYN -> SYN-ACK -> ACK, then the connection is open'},
    {name:'Handling many clients at once', explain:"A server that only ever handles one client at a time makes everyone else wait. Real servers usually hand each accepted connection off to its own thread, so one slow client doesn't block anybody else.", code:'while (true) {\n    Socket client = server.accept();\n    new Thread(() -> handle(client)).start();\n}'},
    {name:'UDP sockets', explain:'Not every connection uses TCP. DatagramSocket sends UDP packets instead — no handshake, no guaranteed delivery or order, just send-and-hope. It trades reliability for speed, which is why things like live video calls sometimes use it.', code:'DatagramSocket udp = new DatagramSocket();'},
    {name:'Common socket errors', explain:'"Connection refused" usually means nobody is actually listening on that port yet. "Address already in use" means another program (maybe an old copy of your own server) already grabbed that port first.', code:'// java.net.ConnectException: Connection refused\n// java.net.BindException: Address already in use'},
    {name:'Blocking vs non-blocking sockets', explain:'The sockets covered so far are "blocking" — a call like accept() or readLine() just pauses your thread until something happens. Java NIO offers non-blocking sockets and a Selector, which let one single thread watch many connections at once instead of needing one thread per client — more complex, but far more scalable for lots of connections.', code:'Selector selector = Selector.open();\nchannel.register(selector, SelectionKey.OP_ACCEPT);'},
    {name:'Buffering and flushing', explain:'Data written to a socket often sits in a buffer instead of going out immediately, for efficiency. flush() (or the auto-flush option on PrintWriter) forces whatever is buffered to actually be sent right away, instead of waiting for the buffer to fill up.', code:'PrintWriter out = new PrintWriter(socket.getOutputStream(), true); // true = auto-flush'}
  ],
  interview:[
    {level:'Beginner', q:'What is the difference between a Socket and a ServerSocket?'},
    {level:'Beginner', q:'What does accept() actually do?'},
    {level:'Beginner', q:'Why does a socket need both an input stream and an output stream?'},
    {level:'Intermediate', q:'Walk through the TCP three-way handshake in your own words.'},
    {level:'Intermediate', q:'Why does a real server usually hand each client off to its own thread?'},
    {level:'Intermediate', q:'What does setSoTimeout() protect against?'},
    {level:'Intermediate', q:'What is the difference between TCP and UDP, and when would you choose UDP?'}
  ],
  journey:{step:5, title:'PawConnect, Step 5 — reachable over the network', blurb:'PawConnect gets its first real network interface: a plain ServerSocket that any client can connect to and get back the current dog list. Raw and simple, exactly the ServerSocket/accept() pattern from this chapter\'s notes, doing an actual job.',
    code:'package pawconnect;\n\nimport java.io.*;\nimport java.net.*;\n\npublic class ShelterSocketServer {\n    public static void main(String[] args) throws IOException {\n        DogStore store = new DogStore();\n        store.add(new Dog("Milo", 3));\n\n        ServerSocket server = new ServerSocket(6000);\n        System.out.println("PawConnect socket server running on port 6000...");\n\n        while (true) {\n            Socket client = server.accept();\n            PrintWriter out = new PrintWriter(client.getOutputStream(), true);\n            for (Dog d : store.getAll()) {\n                out.println(d.toString());\n            }\n            client.close();\n        }\n    }\n}',
    note:'Connect with a plain socket client, or even "telnet localhost 6000", and the whole dog list prints straight back — PawConnect, reachable from outside its own process for the first time.'},
  challenges:[
    {p:'Write the server side: create a <span class="inline-code">ServerSocket</span> on port 5000, call <span class="inline-code">accept()</span> and store the result in <span class="inline-code">clientSocket</span>, then print "Client connected!".',
     checks:[{l:'ServerSocket on port 5000', t:/new\s+ServerSocket\s*\(\s*5000\s*\)/i},{l:'accept() stored in clientSocket', t:/clientSocket\s*=[^;]*\.accept\s*\(\s*\)/i},{l:'Prints "Client connected!"', t:/client connected/i}],
     s:'ServerSocket server = new ServerSocket(5000);\nSocket clientSocket = server.accept();\nSystem.out.println("Client connected!");',
     m:['Skipping accept() — a ServerSocket alone only listens, it does not give you a usable connection.','Forgetting to save the result of accept() into a variable — with no reference, you cannot send anything back.']},
    {p:'Write the client side: connect to <span class="inline-code">localhost</span> on port 5000 using <span class="inline-code">Socket</span>.',
     checks:[{l:'Creates a Socket to localhost:5000', t:/new\s+Socket\s*\(\s*"localhost"\s*,\s*5000\s*\)/i}],
     s:'Socket socket = new Socket("localhost", 5000);',
     m:['Using a different port than the server is actually listening on — both sides must match exactly.','Trying to connect before the server has called accept() — nothing is listening yet.']},
    {p:'On the server, get the output stream and send the text "Welcome!" using <span class="inline-code">PrintWriter</span>.',
     checks:[{l:'Creates a PrintWriter from the socket output stream', t:/new\s+PrintWriter\s*\(\s*\w+\.getOutputStream\s*\(\s*\)/i},{l:'Sends "Welcome!"', t:/welcome!/i}],
     s:'PrintWriter out = new PrintWriter(clientSocket.getOutputStream(), true);\nout.println("Welcome!");',
     m:['Forgetting the "true" second argument (auto-flush) — without it, messages can sit in a buffer and never actually get sent.','Writing to the wrong socket object — it has to be the one returned by accept(), not the ServerSocket itself.']},
    {p:'On the client, read one line of text back using <span class="inline-code">BufferedReader</span>.',
     checks:[{l:'Creates a BufferedReader from the socket input stream', t:/new\s+BufferedReader\s*\(\s*new\s+InputStreamReader\s*\(\s*\w+\.getInputStream\s*\(\s*\)/i},{l:'Calls readLine()', t:/readLine\s*\(\s*\)/i}],
     s:'BufferedReader in = new BufferedReader(new InputStreamReader(socket.getInputStream()));\nString line = in.readLine();',
     m:['Forgetting readLine() blocks and waits — your program pauses right there until a line actually arrives.','Wrapping the wrong stream — it needs to be getInputStream(), not getOutputStream().']},
    {p:'On the server, read one line sent by the client, the same way.',
     checks:[{l:'BufferedReader from clientSocket input stream', t:/new\s+BufferedReader\s*\(\s*new\s+InputStreamReader\s*\(\s*clientSocket\.getInputStream\s*\(\s*\)/i},{l:'Calls readLine()', t:/readLine\s*\(\s*\)/i}],
     s:'BufferedReader in = new BufferedReader(new InputStreamReader(clientSocket.getInputStream()));\nString message = in.readLine();',
     m:['Reading from the ServerSocket instead of the accepted clientSocket — the ServerSocket itself never carries any actual conversation data.','Not storing the result anywhere — readLine() is useless if you throw away what it returns.']},
    {p:'Close a socket properly once you are done with it, using <span class="inline-code">close()</span>.',
     checks:[{l:'Calls .close()', t:/\.close\s*\(\s*\)/i}],
     s:'socket.close();',
     m:['Forgetting to close sockets at all — over time this leaks system resources and can exhaust available connections.','Closing it too early, before you have finished reading or writing everything you needed.']},
    {p:'Write a server loop that accepts multiple clients one after another, using <span class="inline-code">while(true)</span>.',
     checks:[{l:'while(true) loop', t:/while\s*\(\s*true\s*\)/i},{l:'Calls accept() inside the loop', t:/\.accept\s*\(\s*\)/i}],
     s:'while (true) {\n    Socket clientSocket = server.accept();\n    System.out.println("New client connected!");\n}',
     m:['Calling accept() only once, outside any loop — the server would only ever handle a single client, ever.','Not giving each connection a new variable — reusing one name for every client makes the code confusing to extend later.']},
    {p:'Rewrite a client connection using try-with-resources so the socket closes automatically.',
     checks:[{l:'Uses try (Socket ... = new Socket(...))', t:/try\s*\(\s*Socket\s+\w+\s*=\s*new\s+Socket\s*\(/i}],
     s:'try (Socket socket = new Socket("localhost", 5000)) {\n    // use the socket here\n}',
     m:['Declaring the socket outside the try(...) parentheses — try-with-resources only auto-closes things declared inside them.','Still manually calling close() afterward as well — harmless, but redundant, since try-with-resources already does it.']},
    {p:'Set a socket timeout of 5 seconds using <span class="inline-code">setSoTimeout()</span>, so reading does not wait forever.',
     checks:[{l:'Calls setSoTimeout(5000)', t:/setSoTimeout\s*\(\s*5000\s*\)/i}],
     s:'socket.setSoTimeout(5000);',
     m:['Passing seconds instead of milliseconds — setSoTimeout expects milliseconds, so 5 seconds is 5000.','Forgetting this throws a SocketTimeoutException when it fires — that needs to be caught somewhere.']},
    {p:'Write the client sending a message, and the server echoing that exact same message back.',
     checks:[{l:'Client sends with out.println', t:/out\.println\s*\(/i},{l:'Server reads with readLine()', t:/readLine\s*\(\s*\)/i},{l:'Server echoes back with println', t:c=>((c.match(/println\s*\(/gi)||[]).length>=2)}],
     s:'// client\nout.println("hello server");\n\n// server\nString received = in.readLine();\nout.println(received); // echo it straight back',
     m:['Echoing a hardcoded string instead of the variable that actually holds what was received.','Forgetting the server needs its own PrintWriter to send anything back at all.']}
  ]
},

{ id:'protocols', tab:'Protocols', title:'Protocols', blurb:'The agreed rules computers follow to understand each other.',
  links:[
    {label:'MDN — An overview of HTTP', url:'https://developer.mozilla.org/en-US/docs/Web/HTTP/Overview'},
    {label:'MDN — HTTP response status codes', url:'https://developer.mozilla.org/en-US/docs/Web/HTTP/Status'}
  ],
  concepts:[
    {name:'What a protocol is', explain:'A protocol is simply an agreed set of rules two computers follow so they understand each other — like both sides agreeing to speak the same language and take turns talking.', code:'// HTTP, TCP, and DNS are all protocols — agreed rulebooks, not products'},
    {name:'TCP vs UDP', explain:"TCP double-checks that every piece of data arrives, in the right order, like a phone call where every word gets confirmed. UDP just sends and hopes — no confirmation, no order guarantee — but it's faster, which is why things like live video sometimes use it.", code:'DatagramSocket udpSocket = new DatagramSocket(); // UDP: fast, no guarantees'},
    {name:'HTTP, ports, and HTTPS', explain:'HTTP is the protocol behind the web, built on top of TCP: a client asks with a method like GET, and a server answers with a status code. A port tells a computer which program a request is meant for — 80 for HTTP, 443 for HTTPS. HTTPS is the same idea, wrapped in encryption so nobody in between can read it.', code:'int HTTP_PORT = 80;\nint HTTPS_PORT = 443;'},
    {name:'IP addresses and DNS', explain:'Every computer on a network has a numeric IP address, like a street address. DNS is the phonebook that translates a human-readable name (like example.com) into that numeric address, so you never have to memorize it yourself.', code:'// example.com --DNS lookup--> 93.184.216.34'},
    {name:'Protocols stack on top of each other', explain:"No single protocol does everything. IP handles addressing (getting data to the right computer), TCP handles reliable delivery on top of that, and HTTP handles the actual web request on top of TCP. It's layers, not one protocol doing it all.", code:'// HTTP sits on top of TCP, which sits on top of IP'},
    {name:'The main HTTP methods', explain:'HTTP methods describe the kind of action being requested: GET reads data, POST creates something new, PUT replaces something entirely, PATCH updates part of it, and DELETE removes it.', code:'GET    -> read data\nPOST   -> create data\nPUT    -> replace data\nDELETE -> remove data'},
    {name:'Choosing a method in real Java code', explain:'When building an HttpRequest, .GET() explicitly picks that method (it is also the default if you leave it out entirely), and .build() is what actually finishes constructing the request object — nothing gets sent until later, when it is passed to client.send(...).', code:'HttpRequest request = HttpRequest.newBuilder()\n    .uri(URI.create("https://api.example.com/dogs"))\n    .GET()\n    .build();'},
    {name:'Status code families', explain:'Status codes are grouped by their first digit: 2xx means success, 3xx means redirect (go look somewhere else), 4xx means the client made a mistake (like asking for something that does not exist), and 5xx means the server itself broke.', code:'200 OK        — success\n404 Not Found — client error\n500 Server Error — server error'},
    {name:'Cookies and sessions', explain:"HTTP itself has no memory — every request is a fresh, unrelated conversation. Cookies are small pieces of data the server asks the browser to hold onto and send back with every future request, which is how a site remembers you're logged in between page loads.", code:'// Set-Cookie: sessionId=abc123'},
    {name:'WebSockets', explain:'Regular HTTP is request-then-response — the client always speaks first. A WebSocket upgrades a connection into a persistent, two-way channel where either side can send a message at any time, which is what powers things like live chat and real-time notifications.', code:'ws://example.com/chat  // or wss:// for the encrypted version'},
    {name:'HTTP/1.1 vs HTTP/2', explain:'HTTP/1.1 sends requests over a connection mostly one at a time. HTTP/2 can send many requests over a single connection at once and compresses headers, which is why modern sites often feel noticeably faster without changing any of your actual code.', code:'// same HTTP methods and status codes — HTTP/2 just moves them more efficiently'},
    {name:'Idempotency', explain:'A request is idempotent if making it once has the same end effect as making it five times. GET, PUT, and DELETE are meant to be idempotent — repeating them should not cause extra side effects. POST is not — submitting the same "create an order" request twice can create two orders.', code:'// safe to retry: GET, PUT, DELETE\n// risky to retry blindly: POST'}

{ id:'json', tab:'JSON', title:'JSON — objects vs. strings', blurb:'A plain-text format almost every language can read.',
  links:[

  ],
  concepts:[
    {name:'String vs object', explain:'A JSON string is just plain text following JSON\'s rules. A JSON object is that same data unpacked into something your code can reach into directly by key, like a labelled box instead of a paragraph describing what is inside it.', code:'String text = "{\\"name\\":\\"Milo\\"}";'},
    {name:'Parsing (text to object)', explain:'Turning a JSON string into a usable JSONObject is called parsing, or deserializing. Once parsed, you can pull individual fields out by name.', code:'JSONObject dog = new JSONObject(text);\nString name = dog.getString("name");'},
    {name:'Building JSON from code', explain:'You can also go the other way — start with an empty JSONObject and add fields with .put(), then convert it to text with .toString() when you are ready to send or save it.', code:'JSONObject obj = new JSONObject();\nobj.put("name", "Milo");\nString out = obj.toString();'},
    {name:'The six JSON data types', explain:'JSON only has six kinds of values: string, number, boolean, null, object, and array. Everything in JSON, no matter how complicated it looks, is built out of just these six building blocks.', code:'{ "text": "hi", "num": 3, "yes": true, "nothing": null, "list": [1,2], "nested": {} }'},
    {name:'Common Java JSON libraries', explain:'org.json (used in this notebook) is simple and lightweight. Jackson and Gson are two other very popular libraries that do the same core job — turning JSON text into objects and back — with slightly different APIs and more advanced features.', code:'// org.json, Jackson, and Gson all solve the same problem, differently'},
    {name:'Formatting is just for humans', explain:'Whitespace, line breaks, and indentation in JSON only exist to make it easier for people to read. A parser treats a tightly packed one-liner and a nicely indented version as exactly the same data.', code:'{"a":1}\n// means exactly the same thing as:\n{\n  "a": 1\n}'},
    {name:'Reading booleans and optional fields', explain:'getBoolean(key) reads a true/false field the same way getString() reads text. For a field that might not even be there, opt-style methods like optString(key, fallback) return a default value instead of throwing an error — much safer than assuming every field always exists.', code:'boolean friendly = dog.getBoolean("friendly");\nString nickname = dog.optString("nickname", "none"); // no error if missing'},
    {name:'Looping through a JSONArray', explain:'A JSONArray does not work like a normal Java array or List — you read one element at a time with getJSONObject(i) inside a regular for loop, checking against .length() instead of .length or .size().', code:'for (int i = 0; i < arr.length(); i++) {\n    JSONObject dog = arr.getJSONObject(i);\n    System.out.println(dog.getString("name"));\n}'},
    {name:'JSONArray, not just JSONObject', explain:'When the top-level JSON is a list instead of a labelled object — like a list of dogs — org.json gives you a JSONArray instead, with its own methods: length() for the size, and getJSONObject(i) to pull out the item at a given position.', code:'JSONArray dogs = new JSONArray(text);\nint howMany = dogs.length();'},
    {name:'Escaping special characters', explain:'Some characters can\'t appear raw inside a JSON string — a literal quote or backslash would break the format. They get "escaped" with a backslash, like \\" for a quote mark or \\n for a line break, so the parser knows to treat them as plain text, not structure.', code:'{"quote": "she said \\"hi\\""}'},
    {name:'JSON Schema', explain:'A JSON Schema is a separate JSON document that describes what "valid" JSON is supposed to look like for a given use case — which fields are required, what type each one should be — so data can be validated automatically instead of just hoped to be correct.', code:'{ "required": ["name", "age"], "properties": { "age": { "type": "number" } } }'}

{ id:'serialization', tab:'Serialization', title:'Serialization & Deserialization', blurb:'Freezing an object down, and thawing it back out later.',
  links:[
    {label:'Oracle — Java Object Serialization Specification', url:'https://docs.oracle.com/javase/8/docs/technotes/guides/serialization/index.html'},
    {label:'Java SE 17 — Serializable (official API docs)', url:'https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/io/Serializable.html'}
  ],
  concepts:[
    {name:'Marking a class Serializable', explain:'implements Serializable is a promise to Java that this class is safe to freeze into bytes. It is an empty interface — you write no extra methods, it is purely a label.', code:'class Player implements Serializable {\n    String name;\n    int score;\n}'},
    {name:'Writing and reading objects', explain:'ObjectOutputStream freezes an object to a file or stream. ObjectInputStream thaws it back out later into a working object again, with all the same field values it had before.', code:'new ObjectOutputStream(new FileOutputStream("save.dat")).writeObject(player);'},
    {name:'Skipping fields with transient', explain:'Some fields should not be saved — a password, a cache, something that only makes sense while the program is running. Marking a field transient tells serialization to skip it entirely.', code:'transient String sessionToken;'},
    {name:'Serializable vs Externalizable', explain:'Serializable is automatic — Java figures out the details of freezing and thawing your object for you. Externalizable gives you full manual control over exactly what gets written and read, which is more work but useful when you need tighter control over the format.', code:'class Player implements Externalizable {\n    // you write your own writeExternal()/readExternal()\n}'},
    {name:'Versioning risk', explain:"If you change a class's fields after some objects have already been saved, deserializing those old files later can break or behave unexpectedly. serialVersionUID and careful, backward-compatible field changes help manage this over time.", code:'private static final long serialVersionUID = 1L;'},
    {name:'A security note', explain:'Deserializing data from a source you do not trust can be genuinely dangerous — a specially crafted byte stream can sometimes trigger unexpected behavior during the process. Never blindly deserialize input from somewhere you do not control.', code:'// never call readObject() on data from an untrusted source without validation'},
    {name:'Handling the checked exceptions', explain:'readObject() can fail two different ways: IOException if something goes wrong reading the file or stream itself, and ClassNotFoundException if the saved data refers to a class that no longer exists on the classpath. Both are checked exceptions, so real code has to catch (or declare) them — a multi-catch with a pipe handles both in one block.', code:'try {\n    Player p = (Player) in.readObject();\n} catch (IOException | ClassNotFoundException e) {\n    e.printStackTrace();\n}'},
    {name:'Customizing serialization', explain:'For unusual cases, a Serializable class can define its own private writeObject() and readObject() methods to take manual control over exactly how it gets frozen and thawed — useful when a field needs special handling that the default behavior can\'t do on its own.', code:'private void writeObject(ObjectOutputStream out) throws IOException {\n    out.defaultWriteObject();\n    // extra custom logic here\n}'},
    {name:'Alternatives to Java serialization', explain:"Java's built-in serialization only really works between Java programs, and carries some of the security risks mentioned above. Formats like JSON (covered in this notebook) or Protocol Buffers are often preferred for saving or sending data, since they're portable across languages and easier to inspect.", code:'// Java Serializable: Java-to-Java, binary\n// JSON / Protobuf: cross-language, more transparent'}
  ],
