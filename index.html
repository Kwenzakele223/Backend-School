{ id:'docker', tab:'Docker', title:'Docker', blurb:'Packing your app into a box that runs the same everywhere.',
  links:[
    {label:'Docker — Get Started guide', url:'https://docs.docker.com/get-started/'},
    {label:'Docker — Dockerfile reference', url:'https://docs.docker.com/engine/reference/builder/'}
  ],
  concepts:[
    {name:'What a container is', explain:'A container is a sealed lunchbox with everything your app needs already packed inside — the right runtime, libraries, and settings — so it behaves identically no matter whose computer it runs on.', code:'// A Dockerfile describes exactly what goes inside that lunchbox'},
    {name:'Image vs container', explain:'An image is the frozen recipe. A container is that recipe actually cooked and running. You can start many containers from the exact same image.', code:'FROM openjdk:17'},
    {name:'Talking to a container from outside', explain:'A container is sealed off by default. Mapping a port connects a port on your machine to a port inside the container, so you can actually reach whatever is running there.', code:'// docker run -p 8080:8080 myapp'},
    {name:'Common Dockerfile instructions', explain:'A handful of instructions cover most Dockerfiles: FROM picks the base image, COPY brings files in, RUN executes a command while building, CMD/ENTRYPOINT decide what runs when the container starts, EXPOSE documents a port, WORKDIR sets the working folder, and ENV sets environment variables.', code:'FROM openjdk:17\nWORKDIR /app\nCOPY app.jar app.jar\nENV PORT=8080\nCMD ["java","-jar","app.jar"]'},
    {name:'Volumes', explain:'Containers are normally thrown away along with any data they created. A volume is a folder mapped outside the container so that data survives even after the container itself is deleted.', code:'// docker run -v mydata:/app/data myapp'},
    {name:'docker-compose', explain:'Real apps are often more than one container — your app plus a database, for example. docker-compose lets you describe every container an app needs in one file, and start (or stop) all of them together with a single command.', code:'# docker-compose.yml\nservices:\n  app:\n    build: .\n  db:\n    image: postgres'},
    {name:'Image registries', explain:'Docker Hub (and similar registries) is where built images get stored and shared, the same way GitHub stores and shares code. docker push uploads an image; docker pull downloads one.', code:'// docker push myusername/myapp:1.0'},
    {name:'Layers and build caching', explain:'Each instruction in a Dockerfile creates a "layer", and Docker caches them. If an early layer (like installing dependencies) hasn\'t changed, Docker reuses the cached version instead of redoing it — which is why the order of instructions in a Dockerfile actually affects how fast rebuilds are.', code:'// put things that rarely change (like FROM, dependency installs) near the top\n// put things that change often (like COPY of your own source code) near the bottom'},
    {name:'Multi-stage builds', explain:'A multi-stage build uses one stage to compile/build the app (with all the heavy build tools installed) and a second, much smaller stage that only copies over the finished result — keeping the final image lean instead of shipping the entire build toolchain.', code:'FROM maven:3.9 AS build\nRUN mvn package\n\nFROM openjdk:17\nCOPY --from=build /app/target/app.jar app.jar'},
    {name:'.dockerignore', explain:'Just like .gitignore, a .dockerignore file lists files and folders that should NOT be copied into the image — like local build output or secrets — keeping images smaller and avoiding accidentally shipping things that shouldn\'t be there.', code:'target/\n.git\n.env'},
    {name:'Container networks', explain:'By default, containers can\'t automatically see each other. Docker networks let you put several containers (like your app and its database) on the same virtual network so they can talk to each other by name, without exposing that traffic to the outside world.', code:'// docker network create my-network\n// docker run --network my-network myapp'}
  ],
  interview:[
    {level:'Beginner', q:'What is a container, in plain terms?'},
    {level:'Beginner', q:'What is the difference between an image and a container?'},
    {level:'Beginner', q:'What does the EXPOSE instruction actually do, and not do?'},
    {level:'Intermediate', q:'Walk through what each line of a basic Dockerfile does.'},
    {level:'Intermediate', q:'What is the difference between docker run and docker start?'},
    {level:'Intermediate', q:'What is a volume, and why do you need one?'},
    {level:'Intermediate', q:'What is a multi-stage build, and why would you use one?'}
  ],
  projects:[{
    title:'Containerize a Small App',
    blurb:'Take any small Java console app you have already built and package it into a Docker image that runs identically on any machine with Docker installed.',
    requirements:[
      'A Dockerfile with FROM, WORKDIR, COPY, and ENTRYPOINT.',
      'docker build succeeds and produces a tagged image.',
      'docker run actually runs the app and produces correct output.',
      'A short README section explaining the two commands needed to build and run it.'
    ]
  }],
  challenges:[
    {p:'Write the first line of a Dockerfile, starting from the <span class="inline-code">openjdk:17</span> base image.',
     checks:[{l:'FROM openjdk:17', t:/FROM\s+openjdk:17/i}],
     s:'FROM openjdk:17',
     m:['Forgetting FROM has to be the very first real instruction in a Dockerfile.','Picking a base image that does not actually match what your app needs to run.']},
    {p:'Add a line copying a file called <span class="inline-code">target/app.jar</span> into the image as <span class="inline-code">app.jar</span>.',
     checks:[{l:'COPY target/app.jar app.jar', t:/COPY\s+target\/app\.jar\s+app\.jar/i}],
     s:'COPY target/app.jar app.jar',
     m:['Getting the source and destination paths backwards.','Referencing a file that has not actually been built yet at the time the image is built.']},
    {p:'Add the line that actually runs the app when the container starts, using <span class="inline-code">ENTRYPOINT</span>.',
     checks:[{l:'ENTRYPOINT running java -jar app.jar', t:/ENTRYPOINT\s*\[\s*"java"\s*,\s*"-jar"\s*,\s*"app\.jar"\s*\]/i}],
     s:'ENTRYPOINT ["java", "-jar", "app.jar"]',
     m:['Writing it as a plain shell string instead of the JSON array form — both work, but the array form avoids some shell quirks.','Referencing a jar filename that does not match what was actually copied in.']},
    {p:'Write the command to build an image from a Dockerfile in the current folder, tagged "myapp".',
     checks:[{l:'docker build -t myapp .', t:/docker\s+build\s+-t\s+myapp\s+\./i}],
     s:'docker build -t myapp .',
     m:['Forgetting the trailing dot — it tells Docker to look for the Dockerfile in the current directory.','Forgetting -t and its tag name — without a tag, the image is much harder to refer to later.']},
    {p:'Write the command to run that image, mapping port 8080 on your machine to port 8080 inside the container.',
     checks:[{l:'docker run -p 8080:8080 myapp', t:/docker\s+run\s+-p\s+8080:8080\s+myapp/i}],
     s:'docker run -p 8080:8080 myapp',
     m:['Getting the two port numbers backwards — it is host_port:container_port, in that order.','Forgetting -p entirely, and then wondering why the app cannot be reached from outside.']},
    {p:'Add an <span class="inline-code">EXPOSE 8080</span> instruction to the Dockerfile to document which port the app uses.',
     checks:[{l:'EXPOSE 8080', t:/EXPOSE\s+8080/i}],
     s:'EXPOSE 8080',
     m:['Assuming EXPOSE actually publishes the port — it does not, it is only documentation; -p at run time is what actually maps it.','Forgetting to match the port number the app is really listening on inside the container.']},
    {p:'Write the command to run a container in the background instead of tying up your terminal, using detached mode.',
     checks:[{l:'docker run -d myapp', t:/docker\s+run\s+-d\s+myapp/i}],
     s:'docker run -d myapp',
     m:['Forgetting -d and then being confused why the terminal seems "stuck" showing logs.','Assuming detached mode means the container is not really running — it still is, just not attached to your terminal.']},
    {p:'Write the command that lists all currently running containers.',
     checks:[{l:'docker ps', t:/docker\s+ps(?!\s+-a)/i}],
     s:'docker ps',
     m:['Confusing docker ps (running containers) with docker images (available images) — they list different things.','Not realizing docker ps -a would show stopped containers too, which this plain command does not.']},
    {p:'Write the command to stop a running container, referring to it by the placeholder name "my_container".',
     checks:[{l:'docker stop my_container', t:/docker\s+stop\s+my_container/i}],
     s:'docker stop my_container',
     m:['Using docker rm instead of docker stop — rm deletes it, stop just pauses it, they are not interchangeable.','Trying to stop a container that has already exited — there is nothing running left to stop.']},
    {p:'Add a <span class="inline-code">WORKDIR /app</span> instruction so later commands run from that folder inside the image.',
     checks:[{l:'WORKDIR /app', t:/WORKDIR\s+\/app/i}],
     s:'WORKDIR /app',
     m:['Placing WORKDIR after the commands that were supposed to run inside it — order matters in a Dockerfile.','Assuming WORKDIR also creates the folder outside the image — it only affects paths inside the build.']}
  ]
},

{ id:'pipeline', tab:'Pipelines', title:'CI/CD Pipelines', blurb:'The assembly line that builds, tests, and ships your code automatically.',
  links:[
    {label:'GitHub Actions — official documentation', url:'https://docs.github.com/en/actions'},
    {label:'GitLab — What is CI/CD?', url:'https://about.gitlab.com/topics/ci-cd/'}
  ],
  concepts:[
    {name:'What CI/CD is', explain:'Continuous Integration / Continuous Deployment is an assembly line for code: every time someone pushes a change, a robot automatically builds it, tests it, and — if everything passes — ships it, instead of a person doing all of that by hand each time.', code:'// triggered automatically on every push, not run by hand'},
    {name:'Stages run in order', explain:'A pipeline is broken into stages like build, test, and deploy. Each stage only runs if the one before it succeeded, so a broken build never even reaches the test stage, and broken tests never reach deploy.', code:'// build -> test -> deploy, each gated on the last one passing'},
    {name:'A complete pipeline, explained line by line (GitHub Actions)', explain:'No fragments this time — here is a real, complete, working pipeline for a small Java project. Read the code block below top to bottom, then walk through exactly what each part means: <ul style="margin:10px 0 0 18px; padding:0;">'
      +'<li style="margin-bottom:6px;"><code>name: Java CI</code> — just a label. This is the name that shows up in GitHub\'s "Actions" tab, so you can tell this pipeline apart from any others in the same project.</li>'
      +'<li style="margin-bottom:6px;"><code>on:</code> — the trigger section. Everything nested under it answers one question: WHEN should this pipeline run?</li>'
      +'<li style="margin-bottom:6px;"><code>push: branches: [main]</code> — run automatically every time someone pushes a commit onto the main branch.</li>'
      +'<li style="margin-bottom:6px;"><code>pull_request: branches: [main]</code> — ALSO run whenever someone opens a pull request targeting main. This is what catches a broken change before it even gets merged, not after.</li>'
      +'<li style="margin-bottom:6px;"><code>jobs:</code> — a pipeline is made of one or more jobs. This one has exactly one, and it is named "build" (that name is something you choose, not a keyword).</li>'
      +'<li style="margin-bottom:6px;"><code>runs-on: ubuntu-latest</code> — tells GitHub which operating system to spin up a brand-new, empty virtual machine with, just to run these steps on.</li>'
      +'<li style="margin-bottom:6px;"><code>steps:</code> — the ordered list of individual actions this job performs, top to bottom. If any single step fails, the whole job stops immediately right there — later steps never run.</li>'
      +'<li style="margin-bottom:6px;"><code>uses: actions/checkout@v4</code> — the very first step always has to fetch your actual code onto that empty machine. Skip this, and every step after it has no code to work with at all.</li>'
      +'<li style="margin-bottom:6px;"><code>uses: actions/setup-java@v4</code> with <code>java-version: \'17\'</code> — installs a JDK on that machine, matching whatever version your project actually needs.</li>'
      +'<li style="margin-bottom:6px;"><code>run: mvn compile</code> — this is a "run" step instead of a "uses" step: instead of a pre-built action, it just types a real command, exactly like you would in your own terminal.</li>'
      +'<li style="margin-bottom:6px;"><code>run: mvn test</code> — runs the JUnit tests. If even a single test fails, this step (and the whole job) fails right here — "package" below never even runs.</li>'
      +'<li style="margin-bottom:6px;"><code>run: mvn package</code> — only reached if every step above it succeeded. Bundles the finished, already-tested code into a runnable jar.</li>'
      +'</ul>',
     code:'name: Java CI\n\non:\n  push:\n    branches: [main]\n  pull_request:\n    branches: [main]\n\njobs:\n  build:\n    runs-on: ubuntu-latest\n\n    steps:\n      - name: Check out the code\n        uses: actions/checkout@v4\n\n      - name: Set up Java\n        uses: actions/setup-java@v4\n        with:\n          java-version: \'17\'\n          distribution: \'temurin\'\n\n      - name: Build with Maven\n        run: mvn compile\n\n      - name: Run tests\n        run: mvn test\n\n      - name: Package the app\n        run: mvn package'},
    {name:'The same pipeline, in GitLab CI', explain:'GitLab structures the exact same idea a little differently. This does the same job as the GitHub Actions file above: <ul style="margin:10px 0 0 18px; padding:0;">'
      +'<li style="margin-bottom:6px;"><code>stages:</code> — lists the stages in the order they must run: build first, then test. This replaces GitHub\'s implicit top-to-bottom step order with an explicit list.</li>'
      +'<li style="margin-bottom:6px;"><code>build_job:</code> and <code>test_job:</code> — these are jobs, named whatever you like (just like GitHub\'s "build" job name was your choice).</li>'
      +'<li style="margin-bottom:6px;"><code>stage: build</code> / <code>stage: test</code> — assigns each job to one of the stages listed above. GitLab automatically waits for every job in "build" to succeed before starting anything in "test".</li>'
      +'<li style="margin-bottom:6px;"><code>image: maven:3.9-eclipse-temurin-17</code> — instead of separate "install Java" steps like GitHub Actions used, GitLab just starts from a ready-made Docker image that already has Maven and Java 17 installed.</li>'
      +'<li style="margin-bottom:6px;"><code>script:</code> — the actual list of commands to run, the direct equivalent of GitHub\'s <code>run:</code> lines.</li>'
      +'</ul>Same guarantee either way: if build_job fails, test_job never runs at all.',
     code:'stages:\n  - build\n  - test\n\nbuild_job:\n  stage: build\n  image: maven:3.9-eclipse-temurin-17\n  script:\n    - mvn compile\n\ntest_job:\n  stage: test\n  image: maven:3.9-eclipse-temurin-17\n  script:\n    - mvn test'},
    {name:'CI vs CD vs continuous deployment', explain:'Continuous Integration automatically builds and tests every change. Continuous Delivery goes a step further and automatically prepares a release that is ready to deploy. Continuous Deployment goes all the way and deploys it too, with no human clicking "go".', code:'// CI: build+test automatically\n// CD (delivery): also package a releasable build\n// continuous deployment: also ship it, automatically'},
    {name:'Common pipeline tools', explain:'GitHub Actions, GitLab CI, and Jenkins are three widely used tools. They look different on the surface, but they all share the same underlying idea: stages, triggered by events, running in order.', code:'// different tools, same core idea: triggers -> stages -> steps'},
    {name:'Environments', explain:'Pipelines often deploy to more than one environment, in order — commonly dev, then staging, then production — each one a safer checkpoint before the next, so problems get caught before real users ever see them.', code:'// dev -> staging -> production'},
    {name:'Secrets management', explain:'Real pipelines never hardcode passwords or API keys directly in the YAML file. Instead they pull them at run time from a secure secrets store built into the pipeline tool.', code:'// secrets are referenced by name, never typed out in plain text in the file'},
    {name:'Building a Docker image inside a pipeline', explain:'A step can run any shell command, including docker build — the same command from the Docker chapter, just triggered automatically instead of typed by hand. The -t flag still tags the image with a name, exactly as before.', code:'- name: Build Docker image\n  run: docker build -t myapp .'},
    {name:'Environment variables in a pipeline', explain:'An env: section defines variables the pipeline\'s steps can read, the same idea as an environment variable on your own machine — useful for things like a database URL that changes between dev and production.', code:'env:\n  API_KEY: my-secret-value'},
    {name:'Caching dependencies', explain:'Downloading the same Maven dependencies on every single run wastes time. A cache step saves a folder (like ~/.m2, where Maven keeps its downloads) between runs, keyed by something like the pom.xml contents, so unchanged dependencies do not get re-downloaded every time.', code:'- name: Cache Maven dependencies\n  uses: actions/cache@v4\n  with:\n    path: ~/.m2\n    key: maven-${{ hashFiles(\'pom.xml\') }}'},
    {name:'Running a step only on failure', explain:'Steps can carry a condition. if: failure() means "only run this step if an earlier step in the job has already failed" — the standard way to send a notification only when something actually went wrong, instead of on every single run.', code:'- name: Notify on failure\n  if: failure()\n  run: echo "Build failed, notifying team"'},
    {name:'Build artifacts', explain:'An artifact is a file (or set of files) produced by one stage that a later stage needs, like a compiled jar built in the "build" stage that the "deploy" stage then actually ships. Pipelines pass artifacts along between stages instead of rebuilding from scratch every time.', code:'// build stage produces: target/app.jar\n// deploy stage picks up that same artifact and ships it'},
    {name:'Rollbacks and blue-green deployment', explain:'If a deployment goes wrong, a rollback switches back to the last known-good version. Blue-green deployment keeps two identical environments (blue and green) and switches traffic between them instantly, so a bad release can be undone by just flipping back, with no downtime.', code:'// blue: currently live, v1\n// green: newly deployed, v2 — switch traffic once verified, or flip back if not'},
    {name:'Branch strategies', explain:'Different branches often trigger different pipeline behavior — a feature branch might just run tests, while merging to main might trigger a full build-test-deploy pipeline. This keeps experimental work from accidentally reaching production.', code:'on:\n  push:\n    branches: [main]      # full deploy pipeline\n  pull_request: {}        # tests only, no deploy'}
  ],
  interview:[
    {level:'Beginner', q:'What does CI/CD stand for?'},
    {level:'Beginner', q:'What triggers a pipeline to run?'},
    {level:'Beginner', q:'What happens if one step in a pipeline fails?'},
    {level:'Intermediate', q:'What is the difference between Continuous Delivery and Continuous Deployment?'},
    {level:'Intermediate', q:'Why does a pipeline usually run tests before building a Docker image, not after?'},
    {level:'Intermediate', q:'What is a pipeline secret, and why should it never be hardcoded in the YAML?'},
    {level:'Intermediate', q:'What is the point of caching dependencies in a pipeline?'}
  ],
  projects:[{
    title:'A Real CI Pipeline for a Project You Built',
    blurb:'Push one of your existing Java projects to GitHub and add a real GitHub Actions workflow that builds and tests it automatically.',
    requirements:[
      'A .github/workflows/ci.yml file that triggers on every push to main.',
      'Steps that check out the code, set up Java, and run the project\'s tests.',
      'A passing pipeline run visible in the repository\'s Actions tab.',
      'A short explanation of what would happen if a test were broken on purpose.'
    ]
  }],
  challenges:[
    {p:'Write a YAML trigger that runs the pipeline whenever code is pushed to the "main" branch.',
     checks:[{l:'Has "on:" trigger', t:/on\s*:/i},{l:'Triggers on push', t:/push\s*:/i},{l:'References the main branch', t:/main/i}],
     s:'on:\n  push:\n    branches: [main]',
     m:['Getting the indentation wrong — YAML uses indentation to show structure, and it is strict about it.','Forgetting to list which branch — without one, behavior can be broader than intended.']},
    {p:'Write a "build" stage/step that runs <span class="inline-code">mvn compile</span>.',
     checks:[{l:'Mentions build', t:/build/i},{l:'Runs mvn compile', t:/mvn\s+compile/i}],
     s:'build:\n  run: mvn compile',
     m:['Typing the command as plain text without a "run:" (or equivalent) key most pipeline tools expect.','Confusing mvn compile (just builds) with mvn test (also runs tests) — they do different things.']},
    {p:'Write a "test" stage/step that runs <span class="inml-code">mvn test</span>.',
     checks:[{l:'Mentions test', t:/test/i},{l:'Runs mvn test', t:/mvn\s+test/i}],
     s:'test:\n  run: mvn test',
     m:['Placing the test stage before the build stage — code normally needs to compile before it can be tested.','Assuming tests run automatically just because they exist in the project — the pipeline has to be told to run them.']},
    {p:'Write three stage names, in the correct order they should run: build, test, deploy.',
     checks:[{l:'Has build before test', t:c=>{const b=c.toLowerCase().indexOf('build'); const t=c.toLowerCase().indexOf('test'); return b>-1 && t>-1 && b<t;}},{l:'Has test before deploy', t:c=>{const t=c.toLowerCase().indexOf('test'); const d=c.toLowerCase().indexOf('deploy'); return t>-1 && d>-1 && t<d;}}],
     s:'stages:\n  - build\n  - test\n  - deploy',
     m:['Listing deploy before test — a broken deploy that skipped testing defeats the entire purpose of the pipeline.','Forgetting a stage entirely, like shipping straight from build without ever testing.']},
    {p:'Add a step inside the pipeline that builds a Docker image tagged "myapp".',
     checks:[{l:'Runs docker build', t:/docker\s+build/i},{l:'Tags as myapp', t:/-t\s+myapp/i}],
     s:'build_image:\n  run: docker build -t myapp .',
     m:['Forgetting the trailing dot on the docker build command, same as running it by hand.','Placing this step before the code has actually been compiled and tested.']},
    {p:'Add an environment variable section defining <span class="inline-code">API_KEY</span> with some placeholder value.',
     checks:[{l:'Has "env:" key', t:/env\s*:/i},{l:'Defines API_KEY', t:/API_KEY/i}],
     s:'env:\n  API_KEY: my-secret-value',
     m:['Hardcoding a REAL secret directly in the pipeline file — real pipelines pull secrets from a secure vault, not plain text.','Forgetting env vars usually need to be referenced later using whatever syntax the specific pipeline tool expects.']},
    {p:'Add a "deploy" stage that runs a script called <span class="inline-code">deploy.sh</span>.',
     checks:[{l:'Mentions deploy', t:/deploy/i},{l:'Runs deploy.sh', t:/deploy\.sh/i}],
     s:'deploy:\n  run: ./deploy.sh',
     m:['Forgetting deploy should usually only run after both build and test succeed, not on every push.','Missing the ./ before the script name, which some shells require to run a local script.']},
    {p:'Add a step that caches Maven dependencies at <span class="inline-code">~/.m2</span> so future builds are faster.',
     checks:[{l:'Mentions cache', t:/cache/i},{l:'References ~/.m2', t:/~\/\.m2/i}],
     s:'cache:\n  path: ~/.m2\n  key: maven-dependencies',
     m:['Forgetting a cache key — without one, some tools cannot tell when the cached data is stale.','Assuming caching changes what gets tested — it only saves time downloading the same dependencies again.']},
    {p:'Define two separate jobs that can run in parallel: "test-unit" and "test-integration".',
     checks:[{l:'Has test-unit', t:/test-unit/i},{l:'Has test-integration', t:/test-integration/i}],
     s:'jobs:\n  test-unit:\n    run: mvn test -Dtest=Unit*\n  test-integration:\n    run: mvn test -Dtest=Integration*',
     m:['Nesting one job inside the other instead of listing them as separate, independent jobs.','Assuming "parallel" happens automatically just by listing two jobs — some tools need it explicitly configured.']},
    {p:'Add a step that only runs when a previous stage has failed, to send a notification.',
     checks:[{l:'Has an if: failure() condition', t:/if\s*:\s*failure\s*\(\s*\)/i}],
     s:'notify_failure:\n  if: failure()\n  run: echo "Build failed, notifying team"',
     m:['Forgetting the condition entirely, which makes the notification step run every single time, useful or not.','Writing the condition as always() when the intent was specifically "only on failure".']}
  ]
},

{ id:'sdlc', tab:'SDLC', title:'The Software Development Life Cycle', blurb:'The big picture: every phase a real project moves through, start to finish.',
  links:[
    {label:'Wikipedia — Software development process', url:'https://en.wikipedia.org/wiki/Software_development_process'},
    {label:'Atlassian — Agile software development', url:'https://www.atlassian.com/agile/software-development'}
  ],
  concepts:[
    {name:'What SDLC actually is', explain:'The Software Development Life Cycle is the repeating, structured sequence of phases almost every software project moves through, no matter which methodology (Waterfall, Agile, Scrum) is used to move through them. The phases are the same; only the pacing and order change.', code:'Requirements -> Design -> Implementation -> Testing -> Deployment -> Maintenance'},
    {name:'Phase 1: Requirements', explain:'Before any code gets written, someone talks to the people who actually need the software and writes down, concretely, what it needs to do — this is where user stories from the Project Management chapter usually get born.', code:'// Requirement: users must be able to reset a forgotten password via email'},
    {name:'Phase 2: Design', explain:'Design decides HOW the requirements will actually be built, before writing the real code — system architecture, database schema, and rough UI layout all get decided here, ideally before anyone is deep into implementation and reluctant to change course.', code:'// design decision: dogs table has a foreign_key to owners table'},
    {name:'Phase 3: Implementation', explain:'This is the actual writing of code — most of this entire notebook lives inside this one phase: Threads, Sockets, JSON, OOP, Databases, all of it.', code:'// this is where Threads, Sockets, JSON, OOP, and Databases actually get written'},
    {name:'Phase 4: Testing', explain:'Verifying the software actually does what it was supposed to — Unit tests (the JUnit and TDD chapters), and Acceptance tests (the Acceptance Testing chapter) both live here, though in practice testing happens continuously, not just as one late, isolated phase.', code:'// unit tests, integration tests, and acceptance tests all belong here'},
    {name:'Phase 5: Deployment', explain:'Actually releasing the software to real users — packaging it (the Docker chapter) and automating the release (the Pipelines chapter) both live here.', code:'// docker build, docker push, deploy to production'},
    {name:'Phase 6: Maintenance', explain:'The phase that lasts the longest by far: fixing bugs users actually find, patching security issues, updating dependencies, and slowly adding small improvements — most of a real project\'s total lifetime is spent here, long after the first "launch."', code:'// bug fixes, dependency upgrades, security patches — for years, not weeks'},
    {name:'SDLC models: Waterfall vs Agile vs V-Model', explain:'Waterfall moves through these six phases once, in strict order. Agile repeats a small version of all six phases every sprint. The V-Model pairs each development phase with a matching testing phase planned at the same time (requirements paired with acceptance testing, design paired with integration testing, and so on).', code:'// Waterfall: 6 phases, once\n// Agile: 6 phases, repeated every sprint\n// V-Model: each phase paired with a matching test phase'},
    {name:'How SDLC, Agile, and this notebook all connect', explain:'SDLC describes WHAT phases exist. Agile/Scrum (from the Project Management chapter) describes HOW a team moves through those phases, in small repeating cycles instead of one long line. The Capstone chapters in this notebook are a compressed, personal version of the whole cycle — you gathered a tiny requirement, designed a structure, implemented it, tested it, and (in Capstone III) even packaged and automated its deployment.', code:'// SDLC = the phases that exist\n// Agile/Scrum = how a team paces through them\n// the Capstone chapters = you, doing a tiny version of all six, alone'}
  ],
  interview:[
    {level:'Beginner', q:'What does SDLC stand for?'},
    {level:'Beginner', q:'Name the six phases of the SDLC in order.'},
    {level:'Intermediate', q:'What is the key difference between the Waterfall and Agile models?'},
    {level:'Intermediate', q:'Why does testing happen continuously in Agile instead of only once, near the end?'},
    {level:'Intermediate', q:'What phase does writing a JUnit test usually belong to?'},
    {level:'Intermediate', q:'When might Waterfall still be a reasonable choice over Agile?'}
  ],
  projects:[{
    title:'Walk One Feature Through the Whole SDLC',
    blurb:'Pick one small feature and produce a real artifact for every phase of the SDLC, showing the full journey from idea to shipped code.',
    requirements:[
      'A one-paragraph requirements document describing the feature and who it is for.',

    ]
  }],
  challenges:[
    {p:'List the six SDLC phases, in order, as a comment.',
     checks:[{l:'Mentions Requirements', t:/Requirements/i},{l:'Mentions Design', t:/Design/i},{l:'Mentions Testing', t:/Testing/i},{l:'Mentions Deployment', t:/Deployment/i},{l:'Mentions Maintenance', t:/Maintenance/i}],
     s:'// Requirements -> Design -> Implementation -> Testing -> Deployment -> Maintenance',
     m:['Leaving out Maintenance — it is easy to forget since it happens after the "exciting" launch, but it is usually the longest phase.','Listing them out of order, which loses the point that later phases depend on earlier ones being done first.']},
    {p:'Write a one-paragraph requirements statement for a "forgot password" feature.',
     checks:[{l:'Mentions password', t:/password/i},{l:'Mentions email', t:/email/i}],
     s:'Users who forget their password must be able to request a reset link sent to their registered email address, which expires after 30 minutes.',
     m:['Writing a solution ("add a reset button") instead of a requirement (what the user actually needs to be able to do).','Leaving out important constraints, like how long a reset link should stay valid.']},
    {p:'Write a brief design note describing a database table needed to support that feature.',
     checks:[{l:'Mentions table', t:/table/i},{l:'Mentions a column-like detail', t:/column|field/i}],
     s:'// design: password_resets table — columns: user_id, token, expires_at',
     m:['Jumping straight to code without first deciding the shape of the data — that decision belongs in design, before implementation.','Forgetting an expiry column, when the requirement specifically mentioned the link should expire.']},
    {p:'Write a comment stating which SDLC phase writing a JUnit test belongs to, and briefly why.',
     checks:[{l:'Mentions Testing', t:/Testing/i},{l:'Has a reason', t:/because|since|verif/i}],
     s:'// Testing phase — a JUnit test verifies the implementation actually matches what was required',
     m:['Assuming tests belong to Implementation just because they are also code — their purpose is verification, which is the Testing phase.','Giving no reasoning at all, just naming the phase.']},
    {p:'Write a comment stating which SDLC phase a Dockerfile and deployment pipeline belong to, and why.',
     checks:[{l:'Mentions Deployment', t:/Deployment/i},{l:'Has a reason', t:/because|since|release|ship|so that|used by|real users|out to/i}],
     s:'// Deployment phase — a Dockerfile and pipeline exist so that the finished, tested code can ship out to real users',
     m:['Placing it under Implementation instead — writing the app and shipping the app are genuinely separate concerns.','Forgetting deployment usually assumes testing has already passed, not the other way around.']},
    {p:'Contrast Waterfall and Agile in your own words, as a comment.',
     checks:[{l:'Mentions Waterfall', t:/Waterfall/i},{l:'Mentions Agile', t:/Agile/i}],
     s:'// Waterfall finishes all six phases once, in strict order.\n// Agile repeats a small version of all six phases every sprint, adjusting along the way.',
     m:['Describing Waterfall as simply "the old way" without explaining the actual structural difference.','Implying Agile skips phases entirely — it still does requirements, design, and testing, just in smaller, faster loops.']},
    {p:'Write a short post-launch maintenance bug report, as if a real user found this problem.',
     checks:[{l:'Reads like a bug report', t:c=>c.trim().length>10},{l:'Mentions a problem word', t:/bug|crash|error|broken|fail/i}],
     s:'A user reported the app crashes when they try to reset their password using an email address containing a "+" character.',
     m:['Writing a feature request instead of an actual reported problem — maintenance is largely about fixing what is already live.','Being too vague to actually reproduce or fix, like "app is broken."']},
    {p:'Write a comment mapping at least two SDLC phases to specific chapters in this notebook.',
     checks:[{l:'Mentions a phase', t:/Requirements|Design|Testing|Deployment|Implementation|Maintenance/i},{l:'Mentions a chapter-like topic', t:/OOP|JUnit|Docker|Database|TDD|Acceptance/i}],
     s:'// Design -> OOP chapter (deciding class structure)\n// Testing -> JUnit, TDD, and Acceptance Testing chapters',
     m:['Mapping every single chapter to just one phase — several chapters genuinely span more than one phase.','Making up a phase that is not actually one of the six standard SDLC phases.']},
    {p:'Explain, in a comment, why testing should not be treated as one single isolated phase at the end.',
     checks:[{l:'Mentions Testing', t:/Testing/i},{l:'Mentions early or throughout', t:/early|throughout|continuous|during/i}],
     s:'// Testing should happen continuously throughout development, not just at the end — catching a bug early is far cheaper to fix than catching it after deployment.',
     m:['Treating testing as something that only happens once, right before shipping — real teams test throughout, especially with TDD.','Giving no reason for why earlier testing matters, just asserting that it should happen earlier.']},
    {p:'Write a comment describing what "maintenance" typically costs a team in practice, in your own words.',
     checks:[{l:'Mentions Maintenance', t:/[Mm]aintenance/},{l:'Mentions at least one real cost', t:/bug|security|patch|upgrade|dependency/i}],
     s:'// Maintenance means ongoing work long after launch: fixing bugs users actually find, patching security issues, and upgrading dependencies that go out of date.',
     m:['Assuming a project is "finished" once it launches — for most real software, launch is closer to the halfway point of its total lifetime cost.','Listing only bug fixes, when dependency upgrades and security patches are just as much a part of real maintenance work.']}
  ]
},

{ id:'projmgmt', tab:'Proj. Mgmt', title:'Project Management Basics', blurb:'How real teams plan, track, and actually ship work together.',
  links:[
    {label:'Atlassian — What is Agile?', url:'https://www.atlassian.com/agile'},
    {label:'The official Scrum Guide', url:'https://scrumguides.org/'},
    {label:'Atlassian — What is Kanban?', url:'https://www.atlassian.com/agile/kanban'}
  ],
  concepts:[
    {name:'What project management actually does', explain:'Writing code is only part of shipping software. Someone has to decide what gets built, in what order, by when, and track whether it is actually on track — that coordinating work is project management, whether one person does it informally or a whole role exists for it.', code:'// deciding WHAT to build, WHO builds it, and WHEN it is due'},
    {name:'Waterfall vs Agile', explain:'Waterfall does every phase once, fully, in strict order — requirements, then design, then build, then test, then ship — like building a house from a finished blueprint. Agile breaks the same work into small, repeating cycles, shipping something usable every cycle and adjusting based on real feedback.', code:'// Waterfall: requirements -> design -> build -> test -> ship (once)\n// Agile: plan -> build -> test -> ship -> repeat (many small cycles)'},
    {name:'Scrum, briefly', explain:'Scrum is a specific, popular way of doing Agile: work happens in fixed-length cycles called sprints (often two weeks), with a Product Owner deciding priorities, a Scrum Master keeping the process running smoothly, and a small dev team doing the actual building.', code:'// sprint length: commonly 1-4 weeks, most often 2'},
    {name:'Kanban, briefly', explain:'Kanban skips fixed sprints entirely — work flows continuously through columns like To Do, In Progress, and Done, often with a WIP (work in progress) limit capping how many cards can sit in one column at once, forcing the team to finish things before starting new ones.', code:'// In Progress column: WIP limit of 3 — finish something before starting a 4th'},
    {name:'User stories', explain:'A user story describes a piece of work from the perspective of the person who benefits from it, in a simple, consistent template, which keeps the focus on real value instead of a technical to-do list.', code:'As a shelter volunteer,\nI want to search dogs by breed,\nso that I can quickly find a match for an adopter.'},
    {name:'Acceptance criteria', explain:'Acceptance criteria spell out exactly when a user story counts as actually done — this is the same Given/When/Then structure from the Acceptance Testing chapter, just applied at the planning stage instead of the testing stage.', code:'Given a list of dogs\nWhen I search for "Labrador"\nThen only Labradors appear in the results'},
    {name:'The backlog and prioritization', explain:'The backlog is the full list of everything that could be built, roughly ordered by priority. Backlog grooming (or refinement) is the regular habit of reviewing, reordering, and clarifying that list so the top of it is always ready to actually start.', code:'// backlog, top to bottom = priority order\n1. Fix login bug (High)\n2. Add search filter (Medium)\n3. Dark mode (Low)'},
    {name:'Estimation', explain:'Story points estimate relative effort and uncertainty, not hours directly — a 1-point task is small and well understood, an 8-point task is big or unclear. Planning poker is a common way teams estimate together, each person guessing privately before revealing, to avoid one loud opinion anchoring everyone else\'s guess.', code:'// story points: 1, 2, 3, 5, 8, 13 ... (Fibonacci-ish, on purpose)'},
    {name:'Standups', explain:'A daily standup is a short, time-boxed sync — often exactly three questions: what did I do yesterday, what will I do today, and is anything blocking me. It is meant to surface problems fast, not to be a full status meeting.', code:'Yesterday: fixed the login bug\nToday: start the search filter\nBlockers: none'},
    {name:'Definition of Done', explain:'A shared, written checklist the whole team agrees a piece of work has to satisfy before it counts as finished — code written, tests passing, reviewed, and deployed, for example — so "done" means the same thing to everyone instead of being a personal judgment call.', code:'// Definition of Done:\n// - code written and reviewed\n// - tests passing\n// - deployed to staging'}
  ],
  interview:[
    {level:'Beginner', q:'What is a user story, and what format does it usually follow?'},
    {level:'Beginner', q:'What is a sprint?'},
    {level:'Intermediate', q:'What are the three core Scrum roles, and what does each one do?'},
    {level:'Intermediate', q:'What is the difference between a sprint retrospective and a sprint review?'},
    {level:'Intermediate', q:'What is the difference between Scrum and Kanban?'},
    {level:'Intermediate', q:'What is a Definition of Done, and why does a team need one?'}
  ],
  projects:[{
    title:'Plan a Small Feature Like a Real Team Would',
    blurb:'Take one feature idea (like "dog shelter search by age") and write out the full planning artifacts a real Agile team would produce before writing any code.',
    requirements:[
      'At least 3 user stories in "As a... I want... so that..." format.',
      'Acceptance criteria for each story.',
      'A one-sentence sprint goal covering all three stories.',
      'A Definition of Done checklist that applies to all of them.'
    ]
  }],
  challenges:[
    {p:'Write a user story using the "As a / I want / so that" template, for a search feature.',
     checks:[{l:'Starts with "As a"', t:/As\s+an?\s+\S+/i},{l:'Has "I want"', t:/I want/i},{l:'Has "so that"', t:/so that/i}],
     s:'As a shelter volunteer,\nI want to search dogs by breed,\nso that I can quickly find a match for an adopter.',
     m:['Skipping the "so that" part — without the reason, it is hard to judge whether a proposed solution actually solves the real need.','Writing it from the developer\'s perspective instead of the user\'s — user stories describe value to the user, not implementation steps.']},
    {p:'Write acceptance criteria for that story in Given/When/Then form.',

     s:'Given a list of dogs\nWhen I search for "Labrador"\nThen only Labradors appear in the results',

/* ============================================================
   STATE + PERSISTENCE
   ============================================================ */
const MAX_ATTEMPTS = 5;
function freshState(ch){
  return {
    activeChallenge:0,
    items: (ch.challenges||[]).map(()=>({attempts:0, solved:false, revealed:false, lastCode:"", lastChecklist:null, lastResult:null})),
    activeInterview:0,
    interviewItems: (ch.interview||[]).map(()=>({lastAnswer:"", lastChecklist:null, checked:false})),
    activeProjectIdx:0
  };
}
let state = {};
CHAPTERS.forEach(ch => { state[ch.id] = freshState(ch); });
let currentView = 'home'; // 'home' or a chapter id

async function loadProgress(){
  try{
    const res = await window.storage.get('nb-progress-v2', false);
    if(res && res.value){
      const saved = JSON.parse(res.value);
      Object.keys(saved).forEach(k=>{ if(state[k]) state[k] = saved[k]; });
    }
  }catch(e){}
}
async function saveProgress(){
  try{ await window.storage.set('nb-progress-v2', JSON.stringify(state), false); }
  catch(e){ console.warn('save failed', e); }
}

function chapterSolvedCount(ch){
  return state[ch.id].items.filter(i=>i.solved).length;
}
function chapterTotalCount(ch){
  return ch.challenges.length;
}

/* ============================================================
   RENDERING
   ============================================================ */
function renderTabbar(){
  const bar = document.getElementById('tabbar');
  let html = `<div class="tabitem home-btn ${currentView==='home'?'active':''}" id="homeTab">🏠 Home</div>`;
  CHAPTERS.forEach(ch=>{
    const solved = chapterSolvedCount(ch);
    const done = solved === chapterTotalCount(ch);
    const doneClass = done ? 'done' : '';
    const dotHtml = done ? '✓' : solved;
    html += `<div class="tabitem ${currentView===ch.id?'active':''} ${doneClass}" data-chid="${ch.id}">
      <span class="dot">${dotHtml}</span><span>${ch.tab}</span>
    </div>`;
  });
  bar.innerHTML = html;
  document.getElementById('homeTab').onclick = ()=>{ currentView='home'; renderAll(); };
  bar.querySelectorAll('[data-chid]').forEach(el=>{
    el.onclick = ()=>{ currentView = el.getAttribute('data-chid'); renderAll(); };
  });
}

function renderHome(){
  const root = document.getElementById('root');
  const totalChallenges = CHAPTERS.reduce((s,ch)=>s+ch.challenges.length,0);
  const totalSolved = CHAPTERS.reduce((s,ch)=>s+chapterSolvedCount(ch),0);
  const allDone = totalChallenges>0 && totalSolved===totalChallenges;
  let cards = CHAPTERS.map((ch,idx)=>{
    const metaLabel = `${chapterSolvedCount(ch)}/${chapterTotalCount(ch)} challenges · ${(ch.projects||[]).length} projects · ${(ch.interview||[]).length} interview Qs`;
    return `<div class="chapter-card" data-chid="${ch.id}">
      <div class="num">CH. ${String(idx+1).padStart(2,'0')}</div>
      <h3>${ch.title}</h3>
      <p>${ch.blurb}</p>
      <div class="meta">${metaLabel}</div>
    </div>`;
  }).join('');
  const banner = allDone ? `<div class="completion-banner">
      <div class="stamp good" style="font-size:20px;">all challenges complete ✓</div>
      <p class="completion-note">All ${totalChallenges} challenges solved across every chapter.</p>
    </div>` : '';
  root.innerHTML = `
    ${banner}
    <p class="home-lead">Each chapter carries its own detailed notes, its own set of challenges, its own projects to actually build, and its own interview questions you answer right here for feedback. There is also one thread running through all twenty, in order: <b>PawConnect</b>, a dog shelter management system that grows by one real piece per chapter — start at Chapter 1 and it builds itself up as you go.</p>
    <span class="journey-link" id="viewFullProjectFromHome">→ view PawConnect assembled so far</span>
    <p class="progress-line">${totalSolved} / ${totalChallenges} challenges solved so far</p>
    <div class="chapter-grid">${cards}</div>
  `;
  root.querySelectorAll('[data-chid]').forEach(el=>{
    el.onclick = ()=>{ currentView = el.getAttribute('data-chid'); renderAll(); };
  });
  const homeProjBtn = document.getElementById('viewFullProjectFromHome');
  if(homeProjBtn) homeProjBtn.onclick = ()=>{ currentView='fullproject'; renderAll(); };
}

/* ============================================================
   PRACTICE TASK BOARD (Task Boards chapter)
   ============================================================ */
const BOARD_COLUMNS = ['To Do','In Progress','In Review','Done'];
let boardCards = null;

function seedBoardCards(){
  return [
    {id:1, text:'Fix login bug (#42)', col:0},
    {id:2, text:'Write README for the API', col:0},
    {id:3, text:'Add dark mode toggle', col:1},
    {id:4, text:'Review PR #12', col:2},
    {id:5, text:'Set up CI pipeline', col:3}
  ];
}

async function loadBoard(){
  try{
    const res = await window.storage.get('nb-practice-board', false);
    if(res && res.value){ boardCards = JSON.parse(res.value); return; }
  }catch(e){}
  boardCards = seedBoardCards();
}
async function saveBoard(){
  try{ await window.storage.set('nb-practice-board', JSON.stringify(boardCards), false); }
  catch(e){ console.warn('board save failed', e); }
}

function renderBoardWidget(){
  const container = document.getElementById('practiceBoard');
  if(!container || !boardCards) return;

  const cols = BOARD_COLUMNS.map((colName, ci)=>{
    const colCards = boardCards.filter(c=>c.col===ci);
    const cardsHtml = colCards.map(c=>`
      <div class="board-card">
        <span class="board-card-text">${esc(c.text)}</span>
        <div class="board-card-actions">
          <button class="board-btn" data-act="left" data-id="${c.id}" ${ci===0?'disabled':''}>←</button>
          <button class="board-btn" data-act="right" data-id="${c.id}" ${ci===BOARD_COLUMNS.length-1?'disabled':''}>→</button>
          <button class="board-btn board-del" data-act="del" data-id="${c.id}">×</button>
        </div>
      </div>
    `).join('');
    return `<div class="board-col">
      <div class="board-col-head"><span>${colName}</span><span class="board-count">${colCards.length}</span></div>
      <div class="board-col-body">${cardsHtml || '<div class="board-empty">nothing here</div>'}</div>
    </div>`;
  }).join('');

  container.innerHTML = `
    <div class="board-wrap">${cols}</div>
    <div class="board-add">
      <input type="text" id="boardNewCard" placeholder="new card title, e.g. 'Fix signup form'" maxlength="60">
      <button id="boardAddBtn" type="button">+ add to To Do</button>
      <button class="wipe-link" id="boardResetBtn" type="button" style="margin-left:auto;">↺ reset board to sample cards</button>
    </div>
  `;

  const boardResetBtn = document.getElementById('boardResetBtn');
  if(boardResetBtn){
    boardResetBtn.onclick = ()=>{
      boardCards = seedBoardCards();
      saveBoard();
      renderBoardWidget();
    };
  }

  container.querySelectorAll('.board-btn').forEach(btn=>{
    btn.onclick = ()=>{
      const id = parseInt(btn.getAttribute('data-id'),10);
      const act = btn.getAttribute('data-act');
      const card = boardCards.find(c=>c.id===id);
      if(!card) return;
      if(act==='left' && card.col>0) card.col--;
      if(act==='right' && card.col<BOARD_COLUMNS.length-1) card.col++;
      if(act==='del') boardCards = boardCards.filter(c=>c.id!==id);
      saveBoard();
      renderBoardWidget();
    };
  });
  const addBtn = document.getElementById('boardAddBtn');
  if(addBtn){
    addBtn.onclick = ()=>{
      const input = document.getElementById('boardNewCard');
      const text = input.value.trim();
      if(!text) return;
      const nextId = boardCards.length ? Math.max(...boardCards.map(c=>c.id))+1 : 1;
      boardCards.push({id:nextId, text, col:0});
      input.value = '';
      saveBoard();
      renderBoardWidget();
    };
  }
}

function renderLinks(ch){
  if(!ch.links || !ch.links.length) return '';
  const items = ch.links.map(l => `<li><a href="${l.url}" target="_blank" rel="noopener noreferrer">${l.label}</a></li>`).join('');
  return `
    <h3 class="section-label">Further reading</h3>
    <ul class="links-list">${items}</ul>
  `;
}

function renderInterview(ch){
  if(!ch.interview || !ch.interview.length) return '';
  const iState = state[ch.id];
  const idx = iState.activeInterview;
  const q = ch.interview[idx];
  const item = iState.interviewItems[idx];

  const pickerHtml = ch.interview.map((qq,i)=>{
    const it = iState.interviewItems[i];
    const cls = (i===idx?'active ':'') + (it.checked?'done':'');
    return `<div class="cnum ${cls}" data-ii="${i}">${i+1}</div>`;
  }).join('');

  let feedbackHtml = '';
  if(item.lastChecklist){
    const missed = item.lastChecklist.filter(r=>!r.passed);
    const checklistHtml = '<ul class="checklist">' + item.lastChecklist.map(r=>`<li class="${r.passed?'pass':'fail'}">${r.label}</li>`).join('') + '</ul>';
    const adviceHtml = missed.length
      ? `<div class="hint-box"><span class="hint-label">to define this better —</span> your answer doesn't yet clearly cover: ${missed.map(m=>m.label.toLowerCase()).join('; ')}. Add a sentence on each and check again.</div>`
      : `<div class="stamp good" style="font-size:13px;">covers everything expected ✓</div>`;
    feedbackHtml = checklistHtml + adviceHtml;
  }

  return `
    <h3 class="section-label">Interview questions (${ch.interview.length})</h3>
    <p class="interview-hint">Answer in your own words in the box below, then check — this checks whether the key ideas are present, not your exact wording.</p>
    <div class="challenge-picker">${pickerHtml}</div>
    <div class="challenge">
      <p><span class="inline-code">${q.level}</span> — ${q.q}</p>
      <textarea class="interview-answer-box" id="interviewBox" spellcheck="true" placeholder="Type your answer here, like you're explaining it to someone new...">${esc(item.lastAnswer||"")}</textarea>
      <div class="challenge-controls">
        <button class="check-btn" id="interviewCheckBtn">check my answer</button>
        <span class="attempts">${item.checked ? 'checked — you can revise and check again anytime' : 'not checked yet'}</span>
      </div>
      ${feedbackHtml}
    </div>
  `;
}

function renderJourney(ch){
  if(!ch.journey) return '';
  const j = ch.journey;
  const extra = j.extraCode ? `<pre><code>${esc(j.extraCode)}</code></pre>` : '';
  return `
    <h3 class="section-label">The connected project — PawConnect</h3>
    <div class="journey-box" data-step="${j.step}">
      <h4>${j.title}</h4>
      <p class="concept-explain">${j.blurb}</p>
      <pre><code>${esc(j.code)}</code></pre>
      ${extra}
      ${j.note ? `<p class="journey-note">${j.note}</p>` : ''}
      ${j.step===20 ? `<span class="journey-link" id="viewFullProjectBtn">→ that\'s every step — view the complete, assembled PawConnect project</span>` : ''}
    </div>
  `;
}

function renderFullProject(){
  const root = document.getElementById('root');
  const steps = CHAPTERS.filter(ch=>ch.journey).sort((a,b)=>a.journey.step-b.journey.step);
  const stepsHtml = steps.map(ch=>{
    const j = ch.journey;
    return `<div class="journey-box" data-step="${j.step}">
      <h4>${j.title}</h4>
      <p class="concept-explain">${j.blurb}</p>
      <pre><code>${esc(j.code)}</code></pre>
      ${j.extraCode ? `<pre><code>${esc(j.extraCode)}</code></pre>` : ''}
      ${j.note ? `<p class="journey-note">${j.note}</p>` : ''}
    </div>`;
  }).join('');

  root.innerHTML = `
    <div class="chapter-eyebrow">the complete build</div>
    <h2 class="chapter-title">PawConnect — Every Step, Assembled</h2>
    <p class="home-lead">Every piece from every chapter, in the exact order it was built — one real dog shelter management system, grown one concept at a time from a single Java class up to a tested, containerized, documented service. ${steps.length} of 20 steps are assembled so far.</p>
    <div class="proj-steps">${stepsHtml}</div>
    <span class="journey-link" id="backHomeFromProject">← back to the chapters</span>
  `;
  const backBtn = document.getElementById('backHomeFromProject');
  if(backBtn) backBtn.onclick = ()=>{ currentView='home'; renderAll(); };
}

function renderMiniProject(ch){
  if(!ch.projects || !ch.projects.length) return '';
  const pState = state[ch.id];
  const idx = pState.activeProjectIdx;
  const p = ch.projects[idx];
  const reqs = p.requirements.map(r=>`<li>${r}</li>`).join('');

  const pickerHtml = ch.projects.map((pp,i)=>`
    <div class="capstone-pill ${i===idx?'active':''}" data-pi="${i}">${i+1}. ${pp.title}</div>
  `).join('');

  return `
    <h3 class="section-label">Projects (${ch.projects.length})</h3>
    <div class="capstone-picker">${pickerHtml}</div>
    <div class="mini-project">
      <h4>${p.title}</h4>
      <p class="concept-explain">${p.blurb}</p>
      <ul class="proj-reqs">${reqs}</ul>
    </div>
  `;
}

function renderChapter(){
  const ch = CHAPTERS.find(c=>c.id===currentView);
  const chState = state[ch.id];
  const root = document.getElementById('root');

  const conceptsHtml = ch.concepts.map(cn=>{
    if(cn.divider){
      return `<div class="section-divider"><span>${cn.divider}</span></div>`;
    }
    const mediaHtml = cn.svg
      ? `<div class="diagram-box">${cn.svg}</div>`
      : (cn.code ? `<pre><code>${esc(cn.code)}</code></pre>` : '');
    return `
    <div class="concept">
      <h4>${cn.name}</h4>
      <p class="concept-explain">${cn.explain}</p>
      ${mediaHtml}
    </div>
  `;
  }).join('');

  const pickerHtml = ch.challenges.map((c,i)=>{
    const it = chState.items[i];
    const cls = (i===chState.activeChallenge?'active ':'') + (it.solved?'done':'');
    return `<div class="cnum ${cls}" data-idx="${i}">${it.solved?'✓':(i+1)}</div>`;
  }).join('');

  const idx = chState.activeChallenge;
  const c = ch.challenges[idx];
  const it = chState.items[idx];
  const attemptsLeft = MAX_ATTEMPTS - it.attempts;
  const lowClass = attemptsLeft<=2 ? 'low':'';

  let checklistHtml = '';
  if(it.lastChecklist){
    checklistHtml = '<ul class="checklist">' + it.lastChecklist.map(r=>`<li class="${r.passed?'pass':'fail'}">${r.label}</li>`).join('') + '</ul>';
  }
  let stampHtml = '';
  if(it.solved) stampHtml = '<div class="stamp good">nice work ✓</div>';
  else if(it.lastResult==='fail' && !it.revealed) stampHtml = '<div class="stamp bad">try again ✗</div>';

  let hintHtml = '';
  if(!it.solved && !it.revealed && it.attempts>=3 && it.lastChecklist){
    const firstFail = it.lastChecklist.find(r=>!r.passed);
    if(firstFail){
      hintHtml = `<div class="hint-box"><span class="hint-label">a nudge —</span>still missing: ${firstFail.label}</div>`;
    }
  }

  let revealHtml = '';
  if(it.revealed && !it.solved){
    revealHtml = `<div class="reveal">
      <span class="rlabel">attempt limit reached — let's fix it together</span>
      <h4>What usually trips people up here</h4>
      <ul>${c.m.map(x=>`<li>${x}</li>`).join('')}</ul>
      <h4>A working version</h4>
      <pre><code>${esc(c.s)}</code></pre>
    </div>`;
  }

  root.innerHTML = `
    <div class="chapter-eyebrow">chapter ${CHAPTERS.findIndex(x=>x.id===ch.id)+1} of ${CHAPTERS.length}</div>
    <h2 class="chapter-title">${ch.title}</h2>

    <h3 class="section-label">The concepts</h3>
    ${conceptsHtml}

    ${renderJourney(ch)}

    ${ch.hasPracticeBoard ? `
    <h3 class="section-label">Practice board — try it yourself</h3>
    <div class="board-section">
      <p class="concept-explain">Move cards across the columns with the arrow buttons, delete one with ×, or add your own below — this is a real, working, click-to-move board so the idea stops being abstract. Your changes save automatically.</p>
      <div id="practiceBoard"></div>
    </div>
    ` : ''}

    <h3 class="section-label">${ch.challengeLabel || 'Ten small challenges'}</h3>
    <div class="challenge-picker">${pickerHtml}</div>

    <div class="challenge">
      <p>${c.p}</p>
      <div class="code-editor">
        <pre class="highlight-layer" id="hlLayer" aria-hidden="true"><code id="hlCode">${highlightCode(it.lastCode||"")}</code></pre>
        <textarea class="answer-box" id="answerBox" spellcheck="false">${esc(it.lastCode||"")}</textarea>
      </div>
      <div class="challenge-controls">
        <button class="check-btn" id="checkBtn" ${it.solved || it.revealed ? 'disabled':''}>${it.solved?'solved':'check my code'}</button>
        <span class="attempts ${lowClass}">attempts left: ${Math.max(attemptsLeft,0)} / ${MAX_ATTEMPTS}</span>
      </div>
      ${stampHtml}
      ${checklistHtml}
      ${hintHtml}
      ${revealHtml}
    </div>

    ${renderInterview(ch)}
    ${renderMiniProject(ch)}
    ${renderLinks(ch)}
  `;

  root.querySelectorAll('.cnum').forEach(el=>{
    el.onclick = ()=>{ chState.activeChallenge = parseInt(el.getAttribute('data-idx'),10); renderAll(); };
  });
  const btn = document.getElementById('checkBtn');
  if(btn) btn.onclick = ()=>checkAnswer(ch, c, it);

  const fullProjBtn = document.getElementById('viewFullProjectBtn');
  if(fullProjBtn) fullProjBtn.onclick = ()=>{ currentView = 'fullproject'; renderAll(); };

  const box = document.getElementById('answerBox');
  const hlCode = document.getElementById('hlCode');
  const hlLayer = document.getElementById('hlLayer');
  if(box && hlCode){
    box.addEventListener('input', ()=>{ hlCode.innerHTML = highlightCode(box.value); });
    box.addEventListener('scroll', ()=>{ hlLayer.scrollTop = box.scrollTop; hlLayer.scrollLeft = box.scrollLeft; });
    box.addEventListener('keydown', (e)=>{
      if(e.key === 'Tab'){
        e.preventDefault();
        const start = box.selectionStart, end = box.selectionEnd;
        box.value = box.value.slice(0, start) + '\t' + box.value.slice(end);
        box.selectionStart = box.selectionEnd = start + 1;
        hlCode.innerHTML = highlightCode(box.value);
      }
    });
  }

  if(ch.hasPracticeBoard) renderBoardWidget();

  if(ch.interview && ch.interview.length){
    root.querySelectorAll('[data-ii]').forEach(el=>{
      el.onclick = ()=>{ state[ch.id].activeInterview = parseInt(el.getAttribute('data-ii'),10); renderAll(); };
    });
    const interviewBtn = document.getElementById('interviewCheckBtn');
    if(interviewBtn) interviewBtn.onclick = ()=>checkInterviewAnswer(ch, state[ch.id].activeInterview);
  }

  if(ch.projects && ch.projects.length){
    root.querySelectorAll('[data-pi]').forEach(el=>{
      el.onclick = ()=>{ state[ch.id].activeProjectIdx = parseInt(el.getAttribute('data-pi'),10); renderAll(); };
    });
  }
}

function renderAll(){
  renderTabbar();
  if(currentView==='home'){
    renderHome();
  } else if(currentView==='fullproject'){
    renderFullProject();
  } else {
    renderChapter();
  }
}

function checkAnswer(ch, c, it){
  const box = document.getElementById('answerBox');
  const code = box.value;
  it.lastCode = code;

  const results = c.checks.map(chk=>{
    const passed = (chk.t instanceof RegExp) ? chk.t.test(code) : chk.t(code);
    return {label:chk.l, passed};
  });
  const allPassed = results.every(r=>r.passed);
  it.lastChecklist = results;

  if(allPassed){
    it.solved = true;
    it.lastResult = 'pass';
  } else {
    it.attempts += 1;
    it.lastResult = 'fail';
    if(it.attempts >= MAX_ATTEMPTS) it.revealed = true;
  }
  saveProgress();
  renderAll();
}

function checkInterviewAnswer(ch, idx){
  const box = document.getElementById('interviewBox');
  const answer = box.value;
  const item = state[ch.id].interviewItems[idx];
  item.lastAnswer = answer;
  const q = ch.interview[idx];
  const checks = (q.checks && q.checks.length)
    ? q.checks
    : [{l:'Answer is substantial enough to actually explain the idea (15+ words)', t:c=>c.trim().split(/\s+/).filter(Boolean).length>=15}];
  const results = checks.map(chk=>{
    const passed = (chk.t instanceof RegExp) ? chk.t.test(answer) : chk.t(answer);
    return {label:chk.l, passed};
  });
  item.lastChecklist = results;
  item.checked = true;
  saveProgress();
  renderAll();
}

/* ============================================================
   SEARCH
   ============================================================ */
function stripHtml(s){ return (s || '').replace(/<[^>]+>/g, ''); }

function buildSearchIndex(){
  const index = [];
  CHAPTERS.forEach(ch=>{
    index.push({type:'chapter', chId:ch.id, title:ch.title, snippet:ch.blurb});
    ch.concepts.forEach(cn=>{
      if(cn.divider) return;
      index.push({type:'concept', chId:ch.id, title:cn.name, snippet:stripHtml(cn.explain).slice(0,110)});
    });
    ch.challenges.forEach((c,i)=>{
      index.push({type:'challenge', chId:ch.id, challengeIdx:i, title:`${ch.tab} — task ${i+1}`, snippet:stripHtml(c.p).slice(0,110)});
    });
    (ch.projects||[]).forEach((p,pi)=>{
      index.push({type:'project', chId:ch.id, projectIdx:pi, title:`${ch.tab} — project: ${p.title}`, snippet:stripHtml(p.blurb).slice(0,110)});
    });
  });
  return index;
}
const SEARCH_INDEX = buildSearchIndex();

function runSearch(query){
  const q = query.trim().toLowerCase();
  const resultsBox = document.getElementById('searchResults');
  if(q.length < 2){
    resultsBox.classList.remove('open');
    resultsBox.innerHTML = '';
    return;
  }
  const matches = SEARCH_INDEX.filter(item =>
    item.title.toLowerCase().includes(q) || item.snippet.toLowerCase().includes(q)
  ).slice(0, 12);

  if(matches.length === 0){
    resultsBox.innerHTML = '<div class="search-empty">nothing in the notebook matches that</div>';
  } else {
    resultsBox.innerHTML = matches.map((m,i)=>`
      <div class="search-result-item" data-i="${i}">
        <span class="srtype">${m.type}</span>
        <span class="srtitle">${m.title}</span>
        <div class="srsnippet">${m.snippet}</div>
      </div>
    `).join('');
    resultsBox.querySelectorAll('.search-result-item').forEach(el=>{
      el.onclick = ()=>{
        const m = matches[parseInt(el.getAttribute('data-i'),10)];
        currentView = m.chId;
        if(m.type==='challenge') state[m.chId].activeChallenge = m.challengeIdx;
        if(m.type==='project') state[m.chId].activeProjectIdx = m.projectIdx;
        resultsBox.classList.remove('open');
        document.getElementById('searchInput').value = '';
        renderAll();
      };
    });
  }
  resultsBox.classList.add('open');
}

/* ============================================================
   INIT
   ============================================================ */
document.getElementById('resetBtn').onclick = async ()=>{
  CHAPTERS.forEach(ch => state[ch.id] = freshState(ch));
  boardCards = seedBoardCards();
  currentView = 'home';
  await saveProgress();
  await saveBoard();
  renderAll();
};

document.getElementById('searchInput').addEventListener('input', (e)=>runSearch(e.target.value));
document.addEventListener('click', (e)=>{
  if(!e.target.closest('.search-wrap')){
    document.getElementById('searchResults').classList.remove('open');
  }
});

(async function init(){
  await loadProgress();
  await loadBoard();
  renderAll();
})();
</script>
